  /vastu/ayadi:
    post:
      operationId: calculateAyadi
      tags:
      - Vastu
      summary: Calculate Ayadi shadvarga - Vastu proportion and yoni calculator API
      description: 'Ayadi shadvarga calculator for a building or a room: send the dimensions and the API returns all six proportional formulas with the multiplier, the divisor and the remainder shown, the member each remainder names, and the two verdict rules the texts state. Choose between three text families, which genuinely disagree, and choose your own cubit length, because every remainder is unit sensitive. Built for practitioner tools, plan checking software and anyone who has to justify a dimension rather than assert it.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                length:
                  type: number
                  exclusiveMinimum: 0
                  example: 11
                  description: Length of the building or room, in the unit given. Under the Manasara family this is the measure the aya and rksha formulas multiply; under the perimeter family it only feeds the perimeter.
                breadth:
                  type: number
                  exclusiveMinimum: 0
                  example: 11
                  description: Breadth of the building or room, in the unit given. Under the Manasara family this is the measure the vyaya and yoni formulas multiply.
                perimeter:
                  type: number
                  exclusiveMinimum: 0
                  example: 11
                  description: Perimeter of the plan, if it is not simply twice the length plus twice the breadth. The perimeter family runs every formula on this one measure, so it is the number that decides all six remainders there.
                circumference:
                  type: number
                  exclusiveMinimum: 0
                  example: 11
                  description: Circumference or height, if the Manasara vara and tithi formulas should read something other than the perimeter. Defaults to the perimeter, which is what a rectangular plan supplies.
                unit:
                  type: string
                  enum:
                  - hasta
                  - feet
                  - metres
                  default: hasta
                  example: hasta
                  description: 'Unit the Ayadi dimensions are given in. Every remainder is unit sensitive, so this is an input and never assumed: the same building measured in cubits and in feet gives different remainders. hasta is the classical cubit and needs no conversion; feet and metres are converted using hastaInches and rounded to whole cubits, and the rounded figures are returned. Defaults to hasta.'
                hastaInches:
                  type: number
                  exclusiveMinimum: 0
                  default: 18
                  example: 18
                  description: Length of one hasta, the classical cubit, in inches. Defaults to 18, which is 24 angula at three quarters of an inch each and is the value three independent sources agree on. Raise it if your lineage measures the cubit differently; the value used is echoed on the response so a stored reading can be reproduced years later. Only used when unit is feet or metres.
                ayadiText:
                  type: string
                  enum:
                  - manasara
                  - perimeter-texts
                  - utpala
                  default: manasara
                  example: manasara
                  description: Which family of Ayadi formulas to apply. manasara takes length, breadth and circumference separately and is double sourced. perimeter-texts runs every formula on the perimeter alone and is the family the usual worked example is printed for. utpala supplies a yoni formula from the length times the breadth and nothing else, so the other five vargas fall back to the perimeter family and the response says so. Defaults to manasara.
                vyayaFormula:
                  type: string
                  enum:
                  - p9-10
                  - p3-14
                  default: p9-10
                  example: p9-10
                  description: Which vyaya formula the perimeter family uses. The printed table gives two joined by the word or and states no rule for choosing. p9-10 multiplies by nine and divides by ten, which is the only divisor consistent with the ten member vyaya group, so its remainder can be placed in that group and it is the default. p3-14 multiplies by three and divides by fourteen, and its remainder maps to no group any source enumerates. Ignored when ayadiText is manasara, which has one vyaya formula.
              required:
              - length
              - breadth
      responses:
        '200':
          description: The six vargas with their arithmetic, the vayas quotient and the verdict
          content:
            application/json:
              schema:
                type: object
                properties:
                  measures:
                    type: object
                    properties:
                      length:
                        type: number
                        example: 11
                        description: Length in whole hasta, after conversion and rounding.
                      breadth:
                        type: number
                        example: 11
                        description: Breadth in whole hasta, after conversion and rounding.
                      perimeter:
                        type: number
                        example: 11
                        description: Perimeter in whole hasta, either as you sent it or as twice length plus twice breadth.
                      circumference:
                        type: number
                        example: 11
                        description: Circumference in whole hasta, defaulting to the perimeter.
                      area:
                        type: number
                        example: 121
                        description: Length times breadth in whole hasta squared, which is the measure the Utpala yoni formula reads.
                    required:
                    - length
                    - breadth
                    - perimeter
                    - circumference
                    - area
                    description: What was actually divided, in whole cubits. Every remainder is unit sensitive and the formulas are integer arithmetic, so a measure sent in feet or metres is converted and rounded and the rounded figure is published here rather than left for you to infer.
                  vargas:
                    type: array
                    items:
                      type: object
                      properties:
                        varga:
                          type: string
                          example: yoni
                          description: 'Which of the six proportional formulas this row is: aya, vyaya, yoni, rksha, tithi or vara. Always English, safe to compare against.'
                        operand:
                          type: string
                          example: perimeter
                          description: 'Which measure the formula multiplied: length, breadth, circumference, perimeter or area. This is where the three text families differ most, since the Manasara reads three measures separately and the perimeter family reads one.'
                        operandValue:
                          type: number
                          example: 11
                          description: The measure in whole hasta, after any conversion and rounding. This is the number actually multiplied, so a surprising remainder can be traced to it.
                        multiplier:
                          type: number
                          example: 3
                          description: What the measure was multiplied by, per the formula of the chosen text family.
                        divisor:
                          type: number
                          example: 8
                          description: What the product was divided by, which is also the size of the group named.
                        product:
                          type: number
                          example: 33
                          description: The measure times the multiplier, shown so the arithmetic can be checked by hand.
                        remainder:
                          type: number
                          example: 1
                          description: 'What the division left. This is the Ayadi result: the remainder, not the quotient, names the member of the group.'
                        groupSize:
                          type: number
                          example: 8
                          description: How many members the group has. Aya is a group of twelve and vyaya a group of ten, which is stated in the text even though the names are not.
                        name:
                          type: string
                          example: Dhvaja
