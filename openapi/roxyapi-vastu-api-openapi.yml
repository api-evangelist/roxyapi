  /vastu/devatas:
    get:
      operationId: listDevatas
      tags:
      - Vastu
      summary: List the 45 devatas - Vastu Purusha Mandala reference API
      description: 'Reference table of the 45 devatas of the Vastu Purusha Mandala: which squares of the 81 pada grid each one holds, which ring and which side, how many padas, and the verses that place it. A pure reference endpoint with no plot required, for building a mandala diagram or a glossary. Where the sources contradict each other, and they do on several rows, the row says so instead of quietly picking a side.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 45
          default: 45
          example: 45
          description: 'Maximum items to return per page. Range: 1-45, default 45.'
        required: false
        description: 'Maximum items to return per page. Range: 1-45, default 45.'
        name: limit
        in: query
      - schema:
          type: integer
          minimum: 0
          default: 0
          example: 0
          description: Number of items to skip for pagination. Default 0.
        required: false
        description: Number of items to skip for pagination. Default 0.
        name: offset
        in: query
      responses:
        '200':
          description: The devatas of the mandala with their squares, class and verses
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    example: 45
                    description: How many devatas there are in all. Always 45 squares held, though the chapter prints only 44 distinct names because Indra appears twice.
                  limit:
                    type: number
                    example: 45
                    description: How many were requested per page.
                  offset:
                    type: number
                    example: 0
                    description: How many were skipped.
                  devatas:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: jayanta
                          description: 'Identifier of the devata, lower case transliteration. Always English, safe to compare against. Indra appears twice in the chapter, on the east perimeter and on the inner ring, so those two carry the ids indra-outer and indra-inner, which are ours: no source read for this package prints a distinguishing name for either.'
                        name:
                          type: string
                          example: Jayanta
                          description: 'Display name of the devata. A Sanskrit proper noun: romanised with the diacritics the transliteration carries in every language, and written in Devanagari as the Sanskrit text prints it when lang is hi. Compare on id, never on this.'
                        class:
                          type: string
                          enum:
                          - perimeter
                          - innerRing
                          - innerCorner
                          - center
                          example: perimeter
                          description: 'Which ring of the mandala the devata belongs to: perimeter for the outer 32, innerRing for the eight around Brahma, innerCorner for the four on the inner diagonals, center for Brahma alone. 32 plus 8 plus 4 plus 1 is 45. Always English.'
                        group:
                          type: string
                          example: dvipada
                          description: 'How many squares the devata holds under 53.49 to 50: padika for one, dvipada for two, tripada for three. Absent for Brahma, whom those verses leave outside the scheme while enumerating 44 devatas.'
                        side:
                          type: string
                          example: East
                          description: Which side of the perimeter the devata sits on. Present only on the outer 32, which are the ones the verses enumerate side by side.
                        quadrant:
                          type: string
                          example: Northeast
                          description: Which quarter of the mandala the devata occupies, where it sits in one. Absent for a devata spread along a side rather than gathered in a corner.
                        squares:
                          type: array
                          items:
                            type: number
                          example:
                          - 3
                          - 12
                          description: 'Which of the 81 squares the devata holds. The verses name one square per devata and fix the pada count of each, and the remaining squares follow from that count: a dvipada takes its named square plus the one a step inward, a tripada the three cell cardinal run of the second ring.'
                        cells:
                          type: array
                          items:
                            type: object
                            properties:
                              rowFromNorth:
                                type: number
                                example: 3
                                description: Row of the grid, 1 at the northern edge and 9 at the southern one.
                              columnFromWest:
                                type: number
                                example: 9
                                description: Column of the grid, 1 at the western edge and 9 at the eastern one.
                            required:
                            - rowFromNorth
                            - columnFromWest
                          description: The same squares as row and column pairs, which is what you draw with. The corners of the grid are 1 north-east, 9 south-east, 73 north-west and 81 south-west.
                        padaCount:
                          type: number
                          example: 2
                          description: 'How many squares the devata holds: one, two or three for the 44 enumerated devatas, and nine for Brahma.'
                        entrancePada:
                          type: number
                          example: 3
                          description: The entrance pada this devata governs, 1 to 32. Present only on the outer 32, since only a perimeter square can hold a main door.
