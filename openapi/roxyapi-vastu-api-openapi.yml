  /vastu/timing/griha-pravesh:
    post:
      operationId: findGrihaPraveshDates
      tags:
      - Vastu
      summary: Find griha pravesh dates - Vastu house warming muhurta API
      description: 'Griha pravesh muhurta search over a date window: send the window and the place, and the API returns every day that clears the classical day-level rules, with the nakshatra, tithi, weekday and solar position that qualified it and the rule ids that admitted it. Two Muhurta texts disagree on the admissible nakshatras and you choose which one leads, and the rules a date search cannot settle are published rather than dropped. Built for house warming date pickers, practitioner scheduling and agent assistants that have to answer when a family should move in.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate:
                  type: string
                  format: date
                  example: '2027-01-20'
                  description: First day of the search window, in YYYY-MM-DD. Every limb is read at sunrise of the local day, because the Hindu day begins at sunrise rather than at midnight.
                endDate:
                  type: string
                  format: date
                  example: '2027-03-20'
                  description: Last day of the search window, in YYYY-MM-DD, inclusive. The window is capped at 93 days, which is a full season and the same cap the Vedic auspicious day search carries.
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  example: 28.6139
                  description: Latitude of the house, in decimal degrees, positive north. Sunrise decides where one day ends and the next begins, so a nakshatra running out during the morning changes which day it counts for.
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  example: 77.209
                  description: Longitude of the house, in decimal degrees, positive east.
                timezone:
                  anyOf:
                  - type: number
                    minimum: -14
                    maximum: 14
                  - type: string
                  description: 'IANA name (e.g. "America/New_York", "Europe/London", "UTC"), decimal hours (e.g. -5 for EST, 1 for CET), or a fixed UTC offset (e.g. "-05:00", "+01:00"). Prefer the IANA name: it is resolved to the offset in force at the birth date and time, historical daylight-saving rules included, while a fixed offset or decimal is taken literally and will be wrong if it does not match the daylight-saving state at that moment. On a transition day a time in the repeated hour is read as its first occurrence and a time in the skipped hour is moved forward past the gap. Invalid timezones return 400 with a validation error.'
                  example: America/New_York
                muhurtaText:
                  type: string
                  enum:
                  - muhurta-chintamani
                  - kalaprakasika
                  default: muhurta-chintamani
                  example: muhurta-chintamani
                  description: Which Muhurta text supplies the admissible nakshatras for entering a new house. muhurta-chintamani admits eight and kalaprakasika admits twelve; seven overlap and are the high confidence core, one is unique to the first and five to the second. The two texts are independent witnesses, which is what makes the overlap strong and the difference worth exposing. Defaults to muhurta-chintamani.
              required:
              - startDate
              - endDate
              - latitude
              - longitude
              - timezone
      responses:
        '200':
          description: Every admitted day with its panchang limbs, plus the rules and the rejections
          content:
            application/json:
              schema:
                type: object
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          example: '2027-02-11'
                          description: The admitted day, in YYYY-MM-DD.
                        sunrise:
                          type: string
                          example: '2027-02-11T01:32:11.000Z'
                          description: Sunrise at the coordinates you sent, as a UTC instant. This is the moment every limb below was read at. Absent inside a polar night, where the Sun does not rise and the day was read from local midnight instead.
                        nakshatra:
                          type: object
                          properties:
                            number:
                              type: number
                              example: 4
                              description: Nakshatra number 1 to 27, counting from Ashwini. Abhijit is not among them.
                            id:
                              type: string
                              example: rohini
                              description: Identifier of the nakshatra, lower case with hyphens. Always English transliteration, safe to compare against and against the same value on the panchang endpoints.
                            name:
                              type: string
                              example: Rohini
                              description: Display name of the nakshatra, as the panchang endpoints spell it.
                          required:
                          - number
                          - id
                          - name
                          description: The nakshatra the Moon stood in at sunrise, which is the strongest of the rules.
                        tithi:
                          type: object
                          properties:
                            number:
                              type: number
                              example: 6
                              description: Tithi number 1 to 30 across the lunar month, 1 to 15 bright then 16 to 30 dark.
                            name:
                              type: string
                              example: Ṣaṣṭī
                              description: Display name of the tithi, as the panchang endpoints spell it.
                            paksha:
                              type: string
                              example: Shukla
                              description: 'Which half of the lunar month: Shukla for the bright half and Krishna for the dark. Always English, safe to compare against.'
                          required:
                          - number
                          - name
                          - paksha
                          description: The tithi running at sunrise.
                        vara:
                          type: object
                          properties:
                            number:
                              type: number
                              example: 4
                              description: Weekday number, 0 for Sunday through 6 for Saturday.
                            name:
                              type: string
                              example: Thursday
                              description: Weekday name, counted from sunrise rather than from midnight.
                          required:
                          - number
                          - name
                          description: The weekday, which begins at sunrise in this reckoning.
                        ayana:
                          type: string
                          example: uttarayana
                          description: 'Which half of the solar year: uttarayana is the northern course and is required, dakshinayana the southern. Always English, safe to compare against.'
                        solarLongitude:
                          type: number
                          example: 296.412
                          description: Sidereal longitude of the Sun at sunrise, in degrees. Published because two of the rules are solar and a caller can check them from it.
                        karana:
                          type: string
                          example: Bava
                          description: The karana at sunrise. Vishti, also called Bhadra, is the one that bars a day. Always English transliteration.
                        quality:
                          type: string
                          example: preferred
                          description: preferred where the tithi is one both texts single out and the weekday is not the neutral one, admissible otherwise. Always English, safe to compare against.
                        admittedBy:
                          type: array
                          items:
                            type: string
                          example:
                          - nakshatra-admissible
                          - tithi-window
                          description: The rule ids this day satisfied, in the order they were tested. Look each one up in the rules field for what it requires and where it comes from.
                        reading:
                          type: string
                          example: The day clears every rule this search can test, on the nakshatra Rohini, the tithi Ṣaṣṭī and a Thursday.
                          description: The day as a sentence, for a report or a chat answer. Translated in place when lang is set to a language other than English.
                      required:
                      - date
                      - nakshatra
                      - tithi
                      - vara
                      - ayana
                      - solarLongitude
                      - karana
                      - quality
                      - admittedBy
                      - reading
                    description: The days in the window that clear every day-level rule, in date order. Only admitted days are listed; the rules that rejected the rest are tallied in rejectionsByRule.
                  total:
                    type: number
                    example: 4
                    description: How many days were admitted.
                  window:
                    type: object
                    properties:
                      startDate:
                        type: string
                        example: '2027-01-20'
                        description: First day searched, echoed.
                      endDate:
                        type: string
                        example: '2027-03-20'
                        description: Last day searched, echoed.
                      daysEvaluated:
                        type: number
                        example: 60
                        description: How many days the window covered, inclusive of both ends.
                    required:
                    - startDate
                    - endDate
                    - daysEvaluated
                    description: What was searched, echoed so a stored result is self describing.
                  rejectionsByRule:
                    type: object
                    additionalProperties:
                      type: number
                      example: 21
                      description: How many days that rule rejected. One day can be rejected by several rules.
                    example:
                      uttarayana: 21
                      nakshatra-admissible: 45
                    description: 'A tally of which rule rejected how many days, keyed on the rule id. This is what makes an empty result actionable: a window inside the southern course fails every day on one rule and you can see that at a glance.'
                  rules:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: nakshatra-admissible
                          description: Identifier of the rule, which is what the day rows reference.
                        requirement:
                          type: string
                          example: The nakshatra at sunrise must be one the chosen text admits for entering a new house.
                          description: What the rule requires, as original prose. Translated in place when lang is set.
                        confidence:
                          type: string
                          example: high
                          description: 'How well attested the rule is: high where two independent texts agree, medium where two dependent witnesses do or one text states it twice. Always English.'
                        source:
                          type: object
                          properties:
                            text:
                              type: string
                              example: Brihat Samhita
                              description: The primary text this verdict rests on, or the literal value convention where no verse states the rule. Always English, safe to compare against.
                            chapter:
                              type: number
                              example: 53
                              description: Chapter of the primary text. Absent on a convention, which has no chapter to cite.
                            verse:
                              type: string
                              example: '118'
                              description: Verse or verse range inside the chapter. Absent on a convention. A range is written with a hyphen, as in 115-117.
                            translation:
                              type: string
                              example: N. Chidambaram Iyer
                              description: Translator of the edition the verse was read in. Absent on a convention.
                            year:
                              type: number
                              example: 1884
                              description: Publication year of that edition. Absent on a convention.
                            publicDomain:
                              type: boolean
                              example: true
                              description: Whether the cited edition is in the public domain. True on the 1884 Brihat Samhita edition, whose verses are quoted. False on the 1933 Manasara edition behind the Ayadi formulas, from which only the multipliers, divisors and names are taken, never a sentence.
                            basis:
                              type: string
                              example: the south-west placement of the principal bedroom is later Vastu practice; chapter 53 places no bedroom
                              description: Why a convention rule says what it says. Present only when text is convention, and it names the tradition the rule comes from rather than a verse.
                          required:
                          - text
                          description: 'Where a verdict comes from: a chapter and verse of a named public-domain edition, or the literal convention with the practice it rests on. Every verdict in this domain carries one.'
                      required:
                      - id
                      - requirement
                      - confidence
                      - source
                    description: Every rule applied, with what it requires, how well attested it is, and where it comes from.
                  leftToTheAstrologer:
                    type: array
                    items:
                      type: string
                    example:
                    - The rising sign at the moment of entry should be one of the four fixed signs, or a sign benefic to the owner. One text admits a movable sign only when the rising navamsa is the Bull.
                    description: The rules a date search cannot settle, published rather than dropped. They are judgements about a MOMENT and about the owner, not about a day, and a caller who believes an admitted day is finished without them would be wrong.
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                          example: Brihat Samhita
                          description: The primary text this verdict rests on, or the literal value convention where no verse states the rule. Always English, safe to compare against.
                        chapter:
                          type: number
                          example: 53
                          description: Chapter of the primary text. Absent on a convention, which has no chapter to cite.
                        verse:
                          type: string
                          example: '118'
                          description: Verse or verse range inside the chapter. Absent on a convention. A range is written with a hyphen, as in 115-117.
                        translation:
                          type: string
                          example: N. Chidambaram Iyer
                          description: Translator of the edition the verse was read in. Absent on a convention.
                        year:
                          type: number
                          example: 1884
                          description: Publication year of that edition. Absent on a convention.
                        publicDomain:
                          type: boolean
                          example: true
                          description: Whether the cited edition is in the public domain. True on the 1884 Brihat Samhita edition, whose verses are quoted. False on the 1933 Manasara edition behind the Ayadi formulas, from which only the multipliers, divisors and names are taken, never a sentence.
                        basis:
                          type: string
                          example: the south-west placement of the principal bedroom is later Vastu practice; chapter 53 places no bedroom
                          description: Why a convention rule says what it says. Present only when text is convention, and it names the tradition the rule comes from rather than a verse.
                      required:
                      - text
                      description: 'Where a verdict comes from: a chapter and verse of a named public-domain edition, or the literal convention with the practice it rests on. Every verdict in this domain carries one.'
                    description: The primary citations behind the whole search, including the one house entry rule the Brihat Samhita itself states, which is in its muhurta chapter and not in the architecture chapter.
                  conventions:
                    type: object
                    properties:
                      muhurtaText:
                        type: string
                        example: muhurta-chintamani
                        description: Which Muhurta text supplied the nakshatra list. Echoes the resolved value whether it was sent or defaulted.
                      timezone:
                        type: number
                        example: 5.5
                        description: The UTC offset in hours the local day was resolved with, after any IANA name was resolved to a number.
                    required:
                    - muhurtaText
                    - timezone
                    description: The switches this search resolved, echoed so it can be reproduced later.
                required:
                - days
                - total
                - window
                - rejectionsByRule
                - rules
                - leftToTheAstrologer
                - sources
                - conventions
