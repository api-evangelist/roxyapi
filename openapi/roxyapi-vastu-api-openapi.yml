  /vastu/directions:
    get:
      operationId: listDikpalaDirections
      tags:
      - Vastu
      summary: List the eight directions - Vastu dikpala and direction reference API
      description: 'Reference table of the eight Vastu directions: the dikpala who rules each quarter of the horizon, the squares of the mandala it covers with their devatas, what the chapter places on that side, and what standing water there brings. A pure reference endpoint with no plot required, for building a picker or a directions guide. Every row says which verse each part comes from and labels the element as the later convention it is.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 8
          default: 8
          example: 8
          description: 'Maximum items to return per page. Range: 1-8, default 8.'
        required: false
        description: 'Maximum items to return per page. Range: 1-8, default 8.'
        name: limit
        in: query
      - schema:
          type: integer
          minimum: 0
          default: 0
          example: 0
          description: Number of items to skip for pagination. Default 0.
        required: false
        description: Number of items to skip for pagination. Default 0.
        name: offset
        in: query
      responses:
        '200':
          description: The eight directions with their dikpalas, devatas and water effects
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    example: 8
                    description: How many directions there are in all, which is always eight.
                  limit:
                    type: number
                    example: 8
                    description: How many were requested per page.
                  offset:
                    type: number
                    example: 0
                    description: How many were skipped.
                  directions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: Northeast
                          description: Compass sector, one of North, Northeast, East, Southeast, South, Southwest, West, Northwest. Always English, whatever the lang parameter says, so it stays safe to compare against and against the same value on the feng shui and I Ching endpoints.
                        dikpala:
                          type: string
                          example: Īśāna
                          description: 'The lord of this quarter of the horizon, per Brihat Samhita 54.3. A Sanskrit proper noun: romanised with the diacritics the transliteration carries in every language, and written in Devanagari as the Sanskrit text prints it when lang is hi. Compare on id, never on this. These are NOT the 45 mandala devatas and the two sets must not be merged: Agni is the north-east mandala square and the south-east dikpala.'
                        kind:
                          type: string
                          example: intercardinal
                          description: Whether this is one of the four cardinal directions or one of the four intercardinal quarters. Always English.
                        element:
                          type: string
                          example: water
                          description: 'The element conventionally assigned to this quarter: fire, earth, air or water. Present only on the four intercardinal quarters, because the cardinal ones carry none in this scheme, and it is labelled convention because the Brihat Samhita assigns no element to any direction at all.'
                        squares:
                          type: array
                          items:
                            type: number
                          example:
                          - 1
                          - 2
                          - 10
                          - 11
                          - 21
                          description: The squares of the 81 pada grid this direction covers. For a cardinal direction those are its eight perimeter squares in the order the verses enumerate them; for an intercardinal quarter they are the corner square and the four single pada squares gathered around it.
                        devatas:
                          type: array
                          items:
                            type: object
                            properties:
                              square:
                                type: number
                                example: 1
                                description: Square number in the 81 pada grid.
                              id:
                                type: string
                                example: agni
                                description: Identifier of the devata holding it. Always English transliteration, safe to compare against and to look up on the devatas endpoint.
                              name:
                                type: string
                                example: Agni
                                description: 'Display name of the devata. A Sanskrit proper noun: romanised with the diacritics the transliteration carries in every language, and written in Devanagari as the Sanskrit text prints it when lang is hi.'
                            required:
                            - square
                            - id
                            - name
                          description: The devatas of the squares this direction covers, in the same order as the squares list.
                        places:
                          type: string
                          example: the apartment for the Devas
                          description: What Brihat Samhita 53.118 puts on this side, in the chapter own terms. Present on the four intercardinal quarters, which are the only ones that verse places anything on.
                        water:
                          type: object
                          properties:
                            effect:
                              type: string
                              example: Sons.
                              description: What 53.119 says follows from standing water in this quarter, as original prose.
                            auspiciousness:
                              type: string
                              example: auspicious
                              description: Whether that effect is a gain or a harm. Only the north and the north-east are gains. Always English.
                          required:
                          - effect
                          - auspiciousness
                          description: What the chapter says about standing water here, which it gives for all eight directions.
                        sources:
                          type: array
                          items:
                            type: object
                            properties:
                              text:
