openapi: 3.2.0
info:
  title: Roxy Vastu API
  version: 2.0.0
  description: '# RoxyAPI: the Spiritual OS layer for agentic AI


    > **Base URL:** `https://roxyapi.com/api/v2`.'
  x-error-codes:
  - code: validation_error
    status: 400
    meaning: A field is missing or invalid. The body lists every failing field at once in issues, each with its path and the expected shape.
  - code: bad_request
    status: 400
    meaning: The request was rejected as a whole, for example a body that is not valid JSON or a date range that ends before it starts.
  - code: date_out_of_range
    status: 400
    meaning: A date lies outside the span the planetary positions are served for. The error names the supported dates.
  - code: api_key_required
    status: 401
    meaning: No API key was sent.
  - code: invalid_api_key
    status: 401
    meaning: The key sent is malformed or cannot be verified.
  - code: api_key_revoked
    status: 401
    meaning: The key was valid once and has since been revoked from the account page.
  - code: subscription_not_found
    status: 401
    meaning: The key verifies, but the subscription behind it no longer exists.
  - code: subscription_inactive
    status: 401
    meaning: The subscription behind the key is cancelled, expired or suspended, or a trial is past its end date.
  - code: publishable_key_not_allowed_on_mcp
    status: 401
    meaning: A publishable key was used on a Remote MCP server, which takes a secret key.
  - code: invalid_client_ip
    status: 401
    meaning: A keyless request could not be attributed to a caller.
  - code: unauthorized
    status: 401
    meaning: Authentication failed with no more specific reason to give.
  - code: forbidden
    status: 403
    meaning: The key is valid, but this request is not permitted.
  - code: origin_required
    status: 403
    meaning: A publishable key with an origin allowlist was used with no Origin header, as from a server or a native app.
  - code: origin_not_allowed
    status: 403
    meaning: The calling site is not on the origin allowlist of this publishable key.
  - code: not_found
    status: 404
    meaning: Nothing is served at this path, or the identifier in it does not exist. A path miss adds suggestions, the closest real endpoints.
  - code: method_not_allowed
    status: 405
    meaning: The path exists for a different HTTP method. The body lists the accepted methods in allow, as does the Allow header.
  - code: conflict
    status: 409
    meaning: The request cannot be applied in the current state.
  - code: gone
    status: 410
    meaning: The path was removed permanently.
  - code: payload_too_large
    status: 413
    meaning: The request body is larger than the API accepts.
  - code: unsupported_media_type
    status: 415
    meaning: 'A request with a body was sent without Content-Type: application/json.'
  - code: unprocessable_entity
    status: 422
    meaning: Every field is valid, but the combination cannot be computed.
  - code: rate_limit_exceeded
    status: 429
    meaning: The monthly request allowance is used up. Retry-After gives the seconds to the reset.
  - code: rate_limit_per_minute
    status: 429
    meaning: The per-minute limit of the plan was reached. Retry-After gives the seconds to the next minute, and the monthly allowance is not charged.
  - code: rate_limited
    status: 429
    meaning: A rate limit was reached, reported without the plan detail.
  - code: free_tier_exhausted
    status: 429
    meaning: A keyless request has used up its trial allowance.
  - code: internal_error
    status: 500
    meaning: The request failed inside our service. Retry with exponential backoff.
  - code: compute_saturated
    status: 503
    meaning: Heavy calculations are briefly at capacity. Send the same request again after Retry-After seconds.
  - code: error
    status: null
    meaning: A fallback for a status with no more specific code. The status and the error field carry the signal.
  contact:
    name: RoxyAPI Support
    url: https://roxyapi.com/contact
  license:
    name: Proprietary
    url: https://roxyapi.com/policy/terms
servers:
- url: https://roxyapi.com/api/v2
  description: Production API v2
security:
- apiKey: []
tags:
- name: Vastu
  description: 'Vastu Shastra API for directional home and plot analysis: entrance padas with the classical effect of each of the 32 perimeter positions, the Vastu Purusha Mandala projected over a real plot on the 81 pada or the 64 pada grid, room placement checks over a closed room enum, Ayadi shadvarga across three text families, plot shape and ground level under two schools that genuinely disagree, and griha pravesh dates composed over a verified panchang.'
paths:
  /vastu/entrance:
    post:
      operationId: calculateEntrancePada
      tags:
      - Vastu
      summary: Calculate entrance pada - Vastu main door direction API
      description: 'Vastu entrance analysis for a main door: send the plot and where the door sits, and the API returns which of the 32 perimeter padas it falls on, the devata of that square, the effect the classical chapter gives that pada, and the favourable padas on the same side to move toward. Every verdict carries the chapter and verse it comes from as a typed field, and the reading holds on either the 81 pada or the 64 pada division. Built for property and interior design tools, practitioner reports, and any product that has to say whether a front door is well placed.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plot:
                  type: object
                  properties:
                    width:
                      type: number
                      exclusiveMinimum: 0
                      example: 30
                      description: East-west extent of a rectangular plot, in the unit given. Send this with depth for a rectangle, or send polygon instead.
                    depth:
                      type: number
                      exclusiveMinimum: 0
                      example: 40
                      description: North-south extent of a rectangular plot, in the unit given. Send this with width for a rectangle, or send polygon instead.
                    polygon:
                      type: array
                      items:
                        type: object
                        properties:
                          x:
                            type: number
                            example: 15
                            description: Distance east of the plot origin, in the same unit as the plot. The x axis runs east.
                          y:
                            type: number
                            example: 0
                            description: Distance north of the plot origin, in the same unit as the plot. The y axis runs north.
                        required:
                        - x
                        - y
                      minItems: 3
                      maxItems: 16
                      example:
                      - x: 0
                        y: 0
                      - x: 30
                        y: 0
                      - x: 30
                        y: 40
                      - x: 0
                        y: 40
                      description: The plot outline as 3 to 16 vertices in plot coordinates, x east and y north, in either winding order. Use this instead of width and depth for a plot with a cut corner, an extension or an irregular boundary.
                    unit:
                      type: string
                      enum:
                      - feet
                      - metres
                      default: feet
                      example: feet
                      description: Unit the plot dimensions are given in. Every distance the response returns is in this same unit. The mandala projection is scale free, so this affects the areas and the marma size and nothing else.
                  example:
                    width: 30
                    depth: 40
                    unit: feet
                  description: The ground the mandala is projected over. Send width and depth for a compass-aligned rectangle, or polygon for anything else. The x axis runs east and the y axis north, and the mandala is aligned to the compass rather than to the building.
                facing:
                  type: string
                  enum:
                  - North
                  - Northeast
                  - East
                  - Southeast
                  - South
                  - Southwest
                  - West
                  - Northwest
                  example: North
                  description: Direction the front of the house looks out toward, one of the eight compass sectors. Case and punctuation are folded, so north-east, northeast and NorthEast all resolve. Send this or facingDegrees, never both.
                facingDegrees:
                  type: number
                  minimum: 0
                  maximum: 360
                  example: 15
                  description: Direction the front of the house looks out toward, as a compass bearing in degrees clockwise from true north, measured looking OUT from the building. The same convention the feng shui facing endpoints use, so a bearing works unchanged across the two domains. Send this or facing, never both.
                door:
                  type: object
                  properties:
                    x:
                      type: number
                      example: 15
                      description: Distance east of the plot origin, in the same unit as the plot. The x axis runs east.
                    y:
                      type: number
                      example: 0
                      description: Distance north of the plot origin, in the same unit as the plot. The y axis runs north.
                  required:
                  - x
                  - y
                  description: Where the main door sits, in plot coordinates. The point is snapped to the nearest boundary of the plot, so a coordinate read off a drawing that lands slightly inside or outside still resolves. Send this or doorPosition, never both.
                doorPosition:
                  type: number
                  minimum: 0
                  maximum: 1
                  example: 0.4
                  description: 'Where the main door sits along the facing side, as a fraction from 0 to 1 measured from the corner the chapter starts that side at: the north-east for an east facing, the south-east for a south facing, the south-west for a west facing and the north-west for a north facing. The side carries 8 padas, so to aim at pada n of 8 send its midpoint, (n - 0.5) / 8: 0.0625 for the first pada, 0.4375 for the fourth, 0.9375 for the eighth. The response names the pada the fraction resolved to in ordinalOnSide. Requires a cardinal facing, since an intercardinal facing names no single side. Send this or door, never both.'
                grid:
                  type: string
                  enum:
                  - 81-pada
                  - 64-pada
                  default: 81-pada
                  example: 81-pada
                  description: 'Which division of the ground to read: 81-pada is the Paramasayika of Brihat Samhita 53.42, the grid the chapter numbers and names every devata on, and 64-pada is the Manduka of 53.55, for which the chapter gives structure only and no devata names. Defaults to 81-pada.'
              required:
              - plot
              example:
                plot:
                  width: 30
                  depth: 40
                  unit: feet
                facing: North
                doorPosition: 0.4
              description: Where the main door sits on the plot. Send facing or facingDegrees, never both, and locate the door with either door coordinates or doorPosition, never both.
      responses:
        '200':
          description: Entrance pada, its devata, the classical effect and the favourable padas
          content:
            application/json:
              schema:
                type: object
                properties:
                  pada:
                    type: number
                    example: 3
                    description: Which of the 32 perimeter padas the main door falls on, numbered 1 to 32. Padas 1 to 8 run down the east side from the north-east corner, 9 to 16 along the south from the south-east, 17 to 24 up the west from the south-west and 25 to 32 along the north from the north-west. This index is the identifier every entrance verdict keys on.
                  side:
                    type: string
                    example: East
                    description: Which of the four sides the pada belongs to. A corner square belongs to exactly one side, decided by the verses rather than by geometry, so the south-east corner reads South even though it sits at the end of the east edge.
                  startCorner:
                    type: string
                    example: Northeast
                    description: The corner the chapter counts this side from. The four start corners are stated in the verses themselves, which is what makes the effect to pada alignment a reading rather than an inference.
                  ordinalOnSide:
                    type: number
                    example: 3
                    description: Position of the pada along its own side, 1 to 8, counting from the start corner. Useful for drawing a door strip without recomputing the global index.
                  square:
                    type: number
                    example: 3
                    description: The square of the 81 pada grid the door falls in, 1 to 81. It is always the 81 pada square, whichever grid you ask for, because that is the division the chapter numbers and the one the 32 padas are enumerated on. Squares run row-major over the printed plate, so the corners are 1 north-east, 9 south-east, 73 north-west and 81 south-west.
                  cell:
                    type: object
                    properties:
                      rowFromNorth:
                        type: number
                        example: 3
                        description: Row of the grid the square sits in, 1 at the northern edge.
                      columnFromWest:
                        type: number
                        example: 9
                        description: Column of the grid the square sits in, 1 at the western edge.
                    required:
                    - rowFromNorth
                    - columnFromWest
                    description: The square as a row and column, which is what you draw with. Row 1 is the northern edge and column 1 the western one.
                  devata:
                    type: object
                    properties:
                      id:
                        type: string
                        example: jayanta
                        description: Identifier of the devata holding that square. Always English transliteration, safe to compare against and to look up on the devatas endpoint.
                      name:
                        type: string
                        example: Jayanta
                        description: 'Display name of the devata. A Sanskrit proper noun: romanised with the diacritics the transliteration carries in every language, and written in Devanagari as the Sanskrit text prints it when lang is hi. Compare on id, never on this.'
                      padaCount:
                        type: number
                        example: 2
                        description: 'How many of the 81 squares this devata holds: one for a padika, two for a dvipada, three for a tripada and nine for Brahma.'
                    required:
                    - id
                    - name
                    - padaCount
                    description: The devata holding the entrance square. Present only on the 81 pada grid, because 53.55 to 56 gives the 64 pada division its structure and names no devata on it. The effects themselves apply to either division, which is why the pada and the effect are returned in both cases.
                  effect:
                    type: string
                    example: Great wealth.
                    description: What the chapter says follows from a main entrance on this pada. Original prose composed from the verse, translated in place when lang is set.
                  auspiciousness:
                    type: string
                    example: inauspicious
                    description: 'How the stated effect reads: auspicious for a gain, inauspicious for a harm, mixed where the text names a gain and a loss together. A RoxyAPI classification of the verse effect rather than a word in the text, and always English so it is safe to key styling on.'
                  reading:
                    type: string
                    example: 'The main entrance falls on pada 3 of the East side, counted from the Northeast corner. That pada is the square of Jayanta. The effect the verse gives for this pada: Great wealth.'
                    description: The verdict as a sentence, for a report or a chat answer. Composed from the pada, its side and its effect, and translated in place when lang is set.
                  recommendedPadas:
                    type: array
                    items:
                      type: number
                    example:
                    - 3
                    - 4
                    description: The padas on this same side whose stated effect is a gain, so a door can be moved to the nearest favourable position without re-reading the whole table. Empty on a side where the chapter names no gain at all, which is true of the south.
                  source:
                    type: object
                    properties:
                      text:
                        type: string
                        example: Brihat Samhita
                        description: The primary text this verdict rests on, or the literal value convention where no verse states the rule. Always English, safe to compare against.
                      chapter:
                        type: number
                        example: 53
                        description: Chapter of the primary text. Absent on a convention, which has no chapter to cite.
                      verse:
                        type: string
                        example: '118'
                        description: Verse or verse range inside the chapter. Absent on a convention. A range is written with a hyphen, as in 115-117.
                      translation:
                        type: string
                        example: N. Chidambaram Iyer
                        description: Translator of the edition the verse was read in. Absent on a convention.
                      year:
                        type: number
                        example: 1884
                        description: Publication year of that edition. Absent on a convention.
                      publicDomain:
                        type: boolean
                        example: true
                        description: Whether the cited edition is in the public domain. True on the 1884 Brihat Samhita edition, whose verses are quoted. False on the 1933 Manasara edition behind the Ayadi formulas, from which only the multipliers, divisors and names are taken, never a sentence.
                      basis:
                        type: string
                        example: the south-west placement of the principal bedroom is later Vastu practice; chapter 53 places no bedroom
                        description: Why a convention rule says what it says. Present only when text is convention, and it names the tradition the rule comes from rather than a verse.
                    required:
                    - text
                    description: 'Where a verdict comes from: a chapter and verse of a named public-domain edition, or the literal convention with the practice it rests on. Every verdict in this domain carries one.'
                  conventions:
                    type: object
                    properties:
                      grid:
                        type: string
                        example: 81-pada
                        description: Which division of the ground was read. Echoes the resolved value whether it was sent or defaulted.
                      unit:
                        type: string
                        enum:
                        - feet
                        - metres
                        example: feet
                        description: Unit every distance and area in the response is measured in, areas in its square. Echoes the resolved value whether it was sent or defaulted.
                    required:
                    - grid
                    - unit
                    description: The switches this reading resolved, echoed so a stored response can be reproduced years later without knowing what the defaults were on the day it was made.
                required:
                - pada
                - side
                - startCorner
                - ordinalOnSide
                - square
                - cell
                - effect
                - auspiciousness
                - reading
                - recommendedPadas
                - source
                - conventions
        '400':
          description: Validation error. `issues[]` lists every failed field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: First issue summary.
                  code:
                    type: string
                    enum:
                    - validation_error
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                  issues:
                    type: array
                    description: Every validation failure. Use this to rebuild a valid request.
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Dot-separated field path, or "(root)" for top-level.
                        message:
                          type: string
                        code:
                          type: string
                          description: Zod issue code (invalid_type, too_small, too_big, invalid_string, ...).
                        expected:
                          type: string
                          description: Expected type for invalid_type.
                        minimum:
                          description: Minimum bound for too_small issues.
                          oneOf:
                          - type: number
                          - type: string
                        maximum:
                          description: Maximum bound for too_big issues.
                          oneOf:
                          - type: number
                          - type: string
                        inclusive:
                          type: boolean
                        format:
                          type: string
                          description: Format name for string issues (regex, email, url, uuid).
                        pattern:
                          type: string
                          description: Regex pattern when format is regex.
                      required:
                      - path
                      - message
                required:
                - error
                - code
                - doc_url
                - issues
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                required:
                - error
                - code
                - doc_url
        '405':
          description: Method not allowed. The path exists but only responds to the methods listed in `allow[]` and the `Allow` response header.
          headers:
            Allow:
              description: Comma-separated list of allowed methods (RFC 9110).
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                    - method_not_allowed
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                  allow:
                    type: array
                    items:
                      type: string
                    description: Allowed HTTP methods for this path. Mirrors the Allow response header.
                  docs:
                    type: string
                    description: Link to the product page for this domain.
                required:
                - error
                - code
                - doc_url
                - allow
        '429':
          description: Monthly rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                required:
                - error
                - code
                - doc_url
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                required:
                - error
                - code
                - doc_url
  /vastu/mandala:
    post:
      operationId: generateMandala
      tags:
      - Vastu
      summary: Generate Vastu Purusha Mandala - 81 pada and 64 pada grid API
      description: 'Vastu Purusha Mandala projected over a real plot: send the ground and the API returns every square with the devata holding it, the brahmasthan as a polygon you can draw, the marma points, the six vamsa diagonals named by their devatas and the nine atimarma crossings. Choose the 81 pada Paramasayika or the 64 pada Manduka, and the response says which verses each part rests on. Built for floor plan overlays, practitioner reports and any tool that has to place rooms against the classical grid.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plot:
                  type: object
                  properties:
                    width:
                      type: number
                      exclusiveMinimum: 0
                      example: 30
                      description: East-west extent of a rectangular plot, in the unit given. Send this with depth for a rectangle, or send polygon instead.
                    depth:
                      type: number
                      exclusiveMinimum: 0
                      example: 40
                      description: North-south extent of a rectangular plot, in the unit given. Send this with width for a rectangle, or send polygon instead.
                    polygon:
                      type: array
                      items:
                        type: object
                        properties:
                          x:
                            type: number
                            example: 15
                            description: Distance east of the plot origin, in the same unit as the plot. The x axis runs east.
                          y:
                            type: number
                            example: 0
                            description: Distance north of the plot origin, in the same unit as the plot. The y axis runs north.
                        required:
                        - x
                        - y
                      minItems: 3
                      maxItems: 16
                      example:
                      - x: 0
                        y: 0
                      - x: 30
                        y: 0
                      - x: 30
                        y: 40
                      - x: 0
                        y: 40
                      description: The plot outline as 3 to 16 vertices in plot coordinates, x east and y north, in either winding order. Use this instead of width and depth for a plot with a cut corner, an extension or an irregular boundary.
                    unit:
                      type: string
                      enum:
                      - feet
                      - metres
                      default: feet
                      example: feet
                      description: Unit the plot dimensions are given in. Every distance the response returns is in this same unit. The mandala projection is scale free, so this affects the areas and the marma size and nothing else.
                  example:
                    width: 30
                    depth: 40
                    unit: feet
                  description: The ground the mandala is projected over. Send width and depth for a compass-aligned rectangle, or polygon for anything else. The x axis runs east and the y axis north, and the mandala is aligned to the compass rather than to the building.
                grid:
                  type: string
                  enum:
                  - 81-pada
                  - 64-pada
                  default: 81-pada
                  example: 81-pada
                  description: 'Which division of the ground to read: 81-pada is the Paramasayika of Brihat Samhita 53.42, the grid the chapter numbers and names every devata on, and 64-pada is the Manduka of 53.55, for which the chapter gives structure only and no devata names. Defaults to 81-pada.'
              required:
              - plot
      responses:
        '200':
          description: Every cell of the projected mandala with its devata, brahmasthan and geometry
          content:
            application/json:
              schema:
                type: object
                properties:
                  grid:
                    type: string
                    example: 81-pada
                    description: Which division was projected, echoing the resolved value.
                  cells:
                    type: array
                    items:
                      type: object
                      properties:
                        square:
                          type: number
                          example: 41
                          description: Square number, 1 to 81 on the Paramasayika and 1 to 64 on the Manduka. Squares run row-major over the printed plate, which puts 1 in the north-east, 9 in the south-east, 73 in the north-west and 81 in the south-west on the 81 pada grid.
                        rowFromNorth:
                          type: number
                          example: 5
                          description: Row of the grid, 1 at the northern edge and 9 or 8 at the southern one.
                        columnFromWest:
                          type: number
                          example: 5
                          description: Column of the grid, 1 at the western edge and 9 or 8 at the eastern one.
                        devata:
                          type: string
                          example: brahma
                          description: Identifier of the devata holding this square. Always English transliteration, safe to compare against. Present only on the 81 pada grid, since the chapter names no devata on the 64 pada division.
                        devataName:
                          type: string
                          example: Brahmā
                          description: 'Display name of that devata. A Sanskrit proper noun: romanised with the diacritics the transliteration carries in every language, and written in Devanagari as the Sanskrit text prints it when lang is hi. Present only on the 81 pada grid.'
                        class:
                          type: string
                          enum:
                          - perimeter
                          - innerRing
                          - innerCorner
                          - center
                          example: center
                          description: 'Which ring of the mandala the devata belongs to: perimeter for the outer 32, innerRing for the eight around Brahma, innerCorner for the four on the inner diagonals, center for Brahma. Present only on the 81 pada grid.'
                        group:
                          type: string
                          example: dvipada
                          description: 'How many squares the devata holds under the classification of 53.49 to 50: padika for one, dvipada for two, tripada for three. Absent for Brahma, which those verses leave outside the scheme, and on the 64 pada grid.'
                        role:
                          type: string
                          enum:
                          - brahma
                          - halved-inner-corner
                          - halved-outer-corner
                          - around-brahma
                          - dvipada
                          - outer
                          example: around-brahma
                          description: 'The structural role 53.55 to 56 gives this square of the 64 pada division: brahma, halved-inner-corner, halved-outer-corner, around-brahma, dvipada or outer. Present only on the 64 pada grid, which is the only thing that chapter states about it.'
                        center:
                          type: object
                          properties:
                            x:
                              type: number
                              example: 15
                              description: Distance east of the plot origin, in the same unit as the plot. The x axis runs east.
                            y:
                              type: number
                              example: 0
                              description: Distance north of the plot origin, in the same unit as the plot. The y axis runs north.
                          required:
                          - x
                          - y
                          description: Centre of the square in plot coordinates. This point is the marmasthala of the square, the vital spot 53.57 forbids raising a pillar on.
                        withinPlot:
                          type: boolean
                          example: true
                          description: Whether the centre of this square falls inside the plot outline. False where an irregular plot has a corner cut away, which is how a missing quarter of the mandala shows up as data rather than as a missing row.
                      required:
                      - square
                      - rowFromNorth
                      - columnFromWest
                      - center
                      - withinPlot
                    description: Every square of the projected mandala, row-major from the north-west. 81 entries on the Paramasayika and 64 on the Manduka.
                  brahmasthan:
                    type: object
                    properties:
                      squares:
                        type: array
                        items:
                          type: number
                        example:
                        - 31
                        - 32
                        - 33
                        - 40
                        - 41
                        - 42
                        - 49
                        - 50
                        - 51
                        description: 'The squares Brahma holds: the nine central squares on the 81 pada grid, the four on the 64 pada grid.'
                      polygon:
                        type: array
                        items:
                          type: object
                          properties:
                            x:
                              type: number
                              example: 15
                              description: Distance east of the plot origin, in the same unit as the plot. The x axis runs east.
                            y:
                              type: number
                              example: 0
                              description: Distance north of the plot origin, in the same unit as the plot. The y axis runs north.
                          required:
                          - x
                          - y
                        description: The brahmasthan as four corners in plot coordinates, so it can be drawn straight onto a plan. It is the block a house is kept clear of, and the chapter destroys the family of a house whose gate faces it.
                      area:
                        type: number
                        example: 133.33
                        description: Area of the brahmasthan in the square of the plot unit, so a report can quote how much ground it covers.
                    required:
                    - squares
                    - polygon
                    - area
                    description: The central block of the mandala. Nine squares on the Paramasayika and four on the Manduka.
                  marma:
                    type: object
                    properties:
                      points:
                        type: array
                        items:
                          type: object
                          properties:
                            x:
                              type: number
                              example: 15
                              description: Distance east of the plot origin, in the same unit as the plot. The x axis runs east.
                            y:
                              type: number
                              example: 0
                              description: Distance north of the plot origin, in the same unit as the plot. The y axis runs north.
                          required:
                          - x
                          - y
                        description: The centre of every square, which 53.57 calls a marmasthala and forbids raising a pillar over.
                      areaEach:
                        type: number
                        example: 1.85
                        description: Area of one marma spot in the square of the plot unit. 53.64 sets it at one eighth of the area of a square, so it scales with the plot.
                    required:
                    - points
                    - areaEach
                    description: The vital spots of the mandala. Present on the 81 pada grid, where 53.57 and 53.64 state the rule and its size. Absent on the 64 pada grid, for which the chapter states neither.
                  vamsa:
                    type: array
                    items:
                      type: object
                      properties:
                        fromSquare:
                          type: number
                          example: 73
                          description: Square the line starts at, named in 53.63 by the devata holding it.
                        fromDevata:
                          type: string
                          example: roga
                          description: Identifier of the devata at that end. Always English transliteration, safe to compare against.
                        toSquare:
                          type: number
                          example: 9
                          description: Square the line ends at, named in 53.63 by the devata holding it.
                        toDevata:
                          type: string
                          example: vayu
                          description: Identifier of the devata at that end.
                        axis:
                          type: string
                          example: northwest-southeast
                          description: Which way the line runs across the grid, northwest-southeast or northeast-southwest. Derived from the endpoint cells rather than stored, so it cannot disagree with the geometry.
                        isMainDiagonal:
                          type: boolean
                          example: true
                          description: Whether this is one of the two corner to corner diagonals. The other four run parallel to them, two cells either side.
                        from:
                          type: object
                          properties:
                            x:
                              type: number
                              example: 15
                              description: Distance east of the plot origin, in the same unit as the plot. The x axis runs east.
                            y:
                              type: number
                              example: 0
                              description: Distance north of the plot origin, in the same unit as the plot. The y axis runs north.
                          required:
                          - x
                          - y
                          description: Start of the line in plot coordinates, at the centre of its square.
                        to:
                          type: object
                          properties:
                            x:
                              type: number
                              example: 15
                              description: Distance east of the plot origin, in the same unit as the plot. The x axis runs east.
                            y:
                              type: number
                              example: 0
                              description: Distance north of the plot origin, in the same unit as the plot. The y axis runs north.
                          required:
                          - x
                          - y
                          description: End of the line in plot coordinates, at the centre of its square.
                      required:
                      - fromSquare
                      - fromDevata
                      - toSquare
                      - toDevata
                      - axis
                      - isMainDiagonal
                      - from
                      - to
                    description: 'The six vamsa lines of 53.63, each named in the verse by the devatas at its two ends. Present only on the 81 pada grid: the 64 pada division is told to draw its main diagonals and nothing further is stated, so a six line geometry there would be borrowed from a different text.'
                  atimarma:
                    type: array
                    items:
                      type: number
                    example:
                    - 23
                    - 31
                    - 33
                    - 39
                    - 41
                    - 43
                    - 49
                    - 51
                    - 59
                    description: The nine squares where the six vamsa lines cross. 53.63 asserts nine points and lists none, so these are computed by intersecting the lines rather than transcribed. They are the centre, the four corners of the Brahma block and the four cardinal squares of the second ring. Present only on the 81 pada grid.
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type: string
                          example: Brihat Samhita
                          description: The primary text this verdict rests on, or the literal value convention where no verse states the rule. Always English, safe to compare against.
                        chapter:
                          type: number
                          example: 53
                          description: Chapter of the primary text. Absent on a convention, which has no chapter to cite.
                        verse:
                          type: string
                          example: '118'
                          description: Verse or verse range inside the chapter. Absent on a convention. A range is written with a hyphen, as in 115-117.
                        translation:
                          type: string
                          example: N. Chidambaram Iyer
                          description: Translator of the edition the verse was read in. Absent on a convention.
                        year:
                          type: number
                          example: 1884
                          description: Publication year of that edition. Absent on a convention.
                        publicDomain:
                          type: boolean
                          example: true
                          description: Whether the cited edition is in the public domain. True on the 1884 Brihat Samhita edition, whose verses are quoted. False on the 1933 Manasara edition behind the Ayadi formulas, from which only the multipliers, divisors and names are taken, never a sentence.
                        basis:
                          type: string
                          example: the south-west placement of the principal bedroom is later Vastu practice; chapter 53 places no bedroom
                          description: Why a convention rule says what it says. Present only when text is convention, and it names the tradition the rule comes from rather than a verse.
                      required:
                      - text
                      description: 'Where a verdict comes from: a chapter and verse of a named public-domain edition, or the literal convention with the practice it rests on. Every verdict in this domain carries one.'
                    description: 'Every verse this projection rests on: the grid and its devatas, the 64 pada structure where that grid was asked for, and the marma and vamsa geometry where it applies.'
                  conventions:
                    type: object
                    properties:
                      grid:
                        type: string
                        example: 81-pada
                        description: Which division of the ground was projected. Echoes the resolved value whether it was sent or defaulted.
                      unit:
                        type: string
                        enum:
                        - feet
                        - metres
                        example: feet
                        description: Unit every distance and area in the response is measured in, areas in its square. Echoes the resolved value whether it was sent or defaulted.
                    required:
                    - grid
                    - unit
                    description: The switches this projection resolved, echoed so a stored response can be reproduced later.
                required:
                - grid
                - cells
                - brahmasthan
                - sources
                - conventions
