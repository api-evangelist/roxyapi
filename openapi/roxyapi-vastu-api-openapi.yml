  /vastu/devatas/{id}:
    get:
      operationId: getDevata
      tags:
      - Vastu
      summary: Look up one devata - Vastu mandala devata reference API
      description: 'Look up one devata of the Vastu Purusha Mandala: the squares it holds, its ring and side, its pada count, the entrance pada it governs where it sits on the perimeter, and the verses that place it. Case and punctuation in the id are folded, so indra-outer, Indra_Outer and INDRA OUTER all resolve.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - agni
          - parjanya
          - jayanta
          - indra-outer
          - surya
          - satya
          - bhrisa
          - antariksha
          - vayu
          - pusha
          - vitatha
          - brihatkshata
          - yama
          - gandharva
          - bhringaraja
          - mriga
          - pitri
          - dauvarika
          - sugriva
          - kusumadanta
          - varuna
          - asura
          - sosha
          - papayakshma
          - roga
          - ahi
          - mukhya
          - bhallata
          - soma
          - bhujaga
          - aditi
          - diti
          - aryaman
          - savita
          - vivasvan
          - indra-inner
          - mitra
          - rajayakshma
          - prthvidhara
          - apavatsa
          - apa
          - savitra
          - jaya
          - rudra
          - brahma
          example: jayanta
          description: Devata id, lower case transliteration. The two Indras are indra-outer for the east perimeter square and indra-inner for the inner ring one. Case and punctuation are folded.
        required: true
        description: Devata id, lower case transliteration. The two Indras are indra-outer for the east perimeter square and indra-inner for the inner ring one. Case and punctuation are folded.
        name: id
        in: path
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      responses:
        '200':
          description: One devata with its squares, class, entrance pada and verses
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: jayanta
                    description: 'Identifier of the devata, lower case transliteration. Always English, safe to compare against. Indra appears twice in the chapter, on the east perimeter and on the inner ring, so those two carry the ids indra-outer and indra-inner, which are ours: no source read for this package prints a distinguishing name for either.'
                  name:
                    type: string
                    example: Jayanta
                    description: 'Display name of the devata. A Sanskrit proper noun: romanised with the diacritics the transliteration carries in every language, and written in Devanagari as the Sanskrit text prints it when lang is hi. Compare on id, never on this.'
                  class:
                    type: string
                    enum:
                    - perimeter
                    - innerRing
                    - innerCorner
                    - center
                    example: perimeter
                    description: 'Which ring of the mandala the devata belongs to: perimeter for the outer 32, innerRing for the eight around Brahma, innerCorner for the four on the inner diagonals, center for Brahma alone. 32 plus 8 plus 4 plus 1 is 45. Always English.'
                  group:
                    type: string
                    example: dvipada
                    description: 'How many squares the devata holds under 53.49 to 50: padika for one, dvipada for two, tripada for three. Absent for Brahma, whom those verses leave outside the scheme while enumerating 44 devatas.'
                  side:
                    type: string
                    example: East
                    description: Which side of the perimeter the devata sits on. Present only on the outer 32, which are the ones the verses enumerate side by side.
                  quadrant:
                    type: string
                    example: Northeast
                    description: Which quarter of the mandala the devata occupies, where it sits in one. Absent for a devata spread along a side rather than gathered in a corner.
                  squares:
                    type: array
                    items:
                      type: number
                    example:
                    - 3
                    - 12
                    description: 'Which of the 81 squares the devata holds. The verses name one square per devata and fix the pada count of each, and the remaining squares follow from that count: a dvipada takes its named square plus the one a step inward, a tripada the three cell cardinal run of the second ring.'
                  cells:
                    type: array
                    items:
                      type: object
                      properties:
                        rowFromNorth:
                          type: number
                          example: 3
                          description: Row of the grid, 1 at the northern edge and 9 at the southern one.
                        columnFromWest:
                          type: number
                          example: 9
                          description: Column of the grid, 1 at the western edge and 9 at the eastern one.
                      required:
                      - rowFromNorth
                      - columnFromWest
                    description: The same squares as row and column pairs, which is what you draw with. The corners of the grid are 1 north-east, 9 south-east, 73 north-west and 81 south-west.
                  padaCount:
                    type: number
                    example: 2
                    description: 'How many squares the devata holds: one, two or three for the 44 enumerated devatas, and nine for Brahma.'
                  entrancePada:
                    type: number
                    example: 3
                    description: The entrance pada this devata governs, 1 to 32. Present only on the outer 32, since only a perimeter square can hold a main door.
                  role:
                    type: string
                    example: The devata Jayanta holds 2 of the eighty one squares on the East side of the mandala.
                    description: 'What the devata holds, as a sentence composed from the sourced structure. There is deliberately no meaning field: no source read for this package gives a devata a meaning, and inventing one would be unsourced content on a route that sells a citation per verdict. Translated in place when lang is set.'
                  verses:
                    type: array
                    items:
                      type: string
                    example:
                    - '53.43'
                    - '53.44'
                    - '53.45'
                    - '53.49'
                    - '53.50'
                    description: Which verses of chapter 53 place this devata and fix its pada count, so a report can print the citation.
                  note:
                    type: string
                    example: Iyer prints Indra for BOTH this square and the other; the printed text therefore yields 44 distinct names for 45 padas.
                    description: 'Where the sources disagree or contradict themselves about this row, and where Brahma sits outside the pada-count scheme. Present on the six rows that carry a recorded divergence: the two Indras, the north-east and south-east corner devatas where the Manasara differs from the Brihat Samhita, Prthvidhara, whom the chapter places on two different squares in two different verses, and Brahma. Original prose, translated in place when lang is set.'
                  source:
                    type: object
                    properties:
                      text:
                        type: string
                        example: Brihat Samhita
                        description: The primary text this verdict rests on, or the literal value convention where no verse states the rule. Always English, safe to compare against.
                      chapter:
                        type: number
                        example: 53
                        description: Chapter of the primary text. Absent on a convention, which has no chapter to cite.
                      verse:
                        type: string
                        example: '118'
                        description: Verse or verse range inside the chapter. Absent on a convention. A range is written with a hyphen, as in 115-117.
                      translation:
                        type: string
                        example: N. Chidambaram Iyer
                        description: Translator of the edition the verse was read in. Absent on a convention.
                      year:
                        type: number
                        example: 1884
                        description: Publication year of that edition. Absent on a convention.
                      publicDomain:
                        type: boolean
                        example: true
                        description: Whether the cited edition is in the public domain. True on the 1884 Brihat Samhita edition, whose verses are quoted. False on the 1933 Manasara edition behind the Ayadi formulas, from which only the multipliers, divisors and names are taken, never a sentence.
                      basis:
                        type: string
                        example: the south-west placement of the principal bedroom is later Vastu practice; chapter 53 places no bedroom
                        description: Why a convention rule says what it says. Present only when text is convention, and it names the tradition the rule comes from rather than a verse.
                    required:
                    - text
                    description: 'Where a verdict comes from: a chapter and verse of a named public-domain edition, or the literal convention with the practice it rests on. Every verdict in this domain carries one.'
                required:
                - id
                - name
                - class
                - squares
                - cells
                - padaCount
                - role
                - verses
                - source
