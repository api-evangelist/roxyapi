  /vastu/plot:
    post:
      operationId: calculatePlotAnalysis
      tags:
      - Vastu
      summary: Analyse a plot - Vastu land and site assessment API
      description: 'Vastu plot analysis from typed geometry: send the outline, the facing, where the ground falls and where the water is, and the API returns a verdict on the shape, the proportion, the ground level under two schools, each corner extension and cut, the road and the water. Every verdict names the chapter and verse behind it, or says plainly that it is convention, which matters because the ground level verses and the widely taught modern rule genuinely disagree. Built for listing and land assessment tools, practitioner site reports and buyer facing checks.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plot:
                  type: object
                  properties:
                    width:
                      type: number
                      exclusiveMinimum: 0
                      example: 30
                      description: East-west extent of a rectangular plot, in the unit given. Send this with depth for a rectangle, or send polygon instead.
                    depth:
                      type: number
                      exclusiveMinimum: 0
                      example: 40
                      description: North-south extent of a rectangular plot, in the unit given. Send this with width for a rectangle, or send polygon instead.
                    polygon:
                      type: array
                      items:
                        type: object
                        properties:
                          x:
                            type: number
                            example: 15
                            description: Distance east of the plot origin, in the same unit as the plot. The x axis runs east.
                          y:
                            type: number
                            example: 0
                            description: Distance north of the plot origin, in the same unit as the plot. The y axis runs north.
                        required:
                        - x
                        - y
                      minItems: 3
                      maxItems: 16
                      example:
                      - x: 0
                        y: 0
                      - x: 30
                        y: 0
                      - x: 30
                        y: 40
                      - x: 0
                        y: 40
                      description: The plot outline as 3 to 16 vertices in plot coordinates, x east and y north, in either winding order. Use this instead of width and depth for a plot with a cut corner, an extension or an irregular boundary.
                    unit:
                      type: string
                      enum:
                      - feet
                      - metres
                      default: feet
                      example: feet
                      description: Unit the plot dimensions are given in. Every distance the response returns is in this same unit. The mandala projection is scale free, so this affects the areas and the marma size and nothing else.
                  example:
                    width: 30
                    depth: 40
                    unit: feet
                  description: The ground the mandala is projected over. Send width and depth for a compass-aligned rectangle, or polygon for anything else. The x axis runs east and the y axis north, and the mandala is aligned to the compass rather than to the building.
                facing:
                  type: string
                  enum:
                  - North
                  - Northeast
                  - East
                  - Southeast
                  - South
                  - Southwest
                  - West
                  - Northwest
                  example: North
                  description: Direction the front of the house looks out toward, one of the eight compass sectors. Case and punctuation are folded, so north-east, northeast and NorthEast all resolve. Send this or facingDegrees, never both.
                facingDegrees:
                  type: number
                  minimum: 0
                  maximum: 360
                  example: 15
                  description: Direction the front of the house looks out toward, as a compass bearing in degrees clockwise from true north, measured looking OUT from the building. The same convention the feng shui facing endpoints use, so a bearing works unchanged across the two domains. Send this or facing, never both.
                slopeLowDirection:
                  type: string
                  enum:
                  - North
                  - Northeast
                  - East
                  - Southeast
                  - South
                  - Southwest
                  - West
                  - Northwest
                  example: Northeast
                  description: Which quarter of the plot the ground falls toward, that is where the LOW point is. The chapter states its rules in terms of the side that stands HIGHER, so the opposite of this value is what the verses are read against, and both are returned. Omit it if the ground is level.
                road:
                  type: string
                  enum:
                  - North
                  - Northeast
                  - East
                  - Southeast
                  - South
                  - Southwest
                  - West
                  - Northwest
                  example: North
                  description: 'Which side a road runs along. The verdict is convention: the chapter states no rule for the side a road is on, only that an obstruction facing the gate brings misery unless it lies beyond twice the height of the house.'
                extensions:
                  type: array
                  items:
                    type: string
                    enum:
                    - North
                    - Northeast
                    - East
                    - Southeast
                    - South
                    - Southwest
                    - West
                    - Northwest
                  maxItems: 8
                  example:
                  - Northeast
                  description: 'Quarters where the plot bulges out beyond a rectangle. Every extension verdict is convention: the chapter states no rule for a named corner and the nearest verses speak of a figure with a limb wanting.'
                cuts:
                  type: array
                  items:
                    type: string
                    enum:
                    - North
                    - Northeast
                    - East
                    - Southeast
                    - South
                    - Southwest
                    - West
                    - Northwest
                  maxItems: 8
                  example:
                  - Southwest
                  description: Quarters where a corner is missing from the rectangle. Every cut verdict is convention, for the same reason as the extensions.
                water:
                  type: string
                  enum:
                  - North
                  - Northeast
                  - East
                  - Southeast
                  - South
                  - Southwest
                  - West
                  - Northwest
                  example: Northeast
                  description: 'Which quarter holds standing water, a well, a tank or a sump. This one IS sourced: 53.119 gives a distinct effect for each of the eight directions and calls only the north and the north-east favourable.'
                slopeSchool:
                  type: string
                  enum:
                  - brihat-samhita
                  - modern
                  default: brihat-samhita
                  example: brihat-samhita
                  description: Which reading of the ground level to lead with. brihat-samhita applies verses 115 to 117 as written, where a higher north-east is a loss, a higher east or north is permitted when level ground is unavoidable and still carries its stated cost, and a higher south or west carries its cost with no allowance. modern applies the widely taught rule that the north-east must be the lowest point, which agrees with verse 115 and contradicts the verse 116 allowance. Both readings are returned whichever you choose, so the disagreement is visible rather than hidden. Defaults to brihat-samhita.
              required:
              - plot
              example:
                plot:
                  width: 30
                  depth: 40
                  unit: feet
                facing: North
                slopeLowDirection: Northeast
                road: North
                extensions:
                - Northeast
                cuts:
                - Southwest
                water: Northeast
              description: 'The site to read: the ground, which way the front looks, and whichever of the slope, road, extensions, cuts and water you know. Send facing or facingDegrees, never both, and the same for the two plot forms.'
      responses:
        '200':
          description: Shape, proportion, ground level under both schools, corners, road and water verdicts
          content:
            application/json:
              schema:
                type: object
                properties:
                  orientation:
                    type: object
                    properties:
                      facing:
                        type: string
                        example: Northeast
                        description: Compass sector, one of North, Northeast, East, Southeast, South, Southwest, West, Northwest. Always English, whatever the lang parameter says, so it stays safe to compare against and against the same value on the feng shui and I Ching endpoints.
                      sitting:
                        type: string
                        example: South
                        description: The sector directly opposite the facing, which is the back of the building. Always English.
                      facingDegrees:
                        type: number
                        example: 15
                        description: The bearing you sent, echoed. Absent when you named a sector instead of a bearing.
                      mountain:
                        type: string
                        example: N3
                        description: The 15 degree mountain the bearing fell in, in the compass label form the feng shui endpoints use. Absent when you named a sector instead of a bearing, since a sector spans three mountains.
                    required:
                    - facing
                    - sitting
                    description: Which way the building looks and which way it sits. Resolved through the same 24 mountain table the feng shui facing endpoints use, so a bearing lands in the same sector on both domains.
                  dimensions:
                    type: object
                    properties:
                      length:
                        type: number
                        example: 40
                        description: North-south extent of the plot, in the unit you sent.
                      breadth:
                        type: number
                        example: 30
                        description: East-west extent of the plot, in the unit you sent.
                      area:
                        type: number
                        example: 1200
                        description: Area enclosed by the outline, in the square of your unit. Computed from the polygon, so a cut corner reduces it.
                      ratio:
                        type: number
                        example: 1.333
                        description: Length divided by breadth. The chapter has exactly one rank-independent ratio rule, twice the breadth for a house with an inner hall, and no band at all for anything else.
                    required:
                    - length
                    - breadth
                    - area
                    - ratio
                    description: What the outline measures, in the unit you sent.
                  shape:
                    type: object
                    properties:
                      verdict:
                        type: string
                        example: irregular
                        description: How the reading lands. Always English, safe to compare against and to key styling on.
                      effect:
                        type: string
                        example: The ground is not a regular four sided figure. The chapter gives the death of kinsmen for an irregular shape and barrenness for irregular sides.
                        description: What the verdict means, as original prose. Translated in place when lang is set to a language other than English.
                      source:
                        type: object
                        properties:
                          text:
                            type: string
                            example: Brihat Samhita
                            description: The primary text this verdict rests on, or the literal value convention where no verse states the rule. Always English, safe to compare against.
                          chapter:
                            type: number
                            example: 53
                            description: Chapter of the primary text. Absent on a convention, which has no chapter to cite.
                          verse:
                            type: string
                            example: '118'
                            description: Verse or verse range inside the chapter. Absent on a convention. A range is written with a hyphen, as in 115-117.
                          translation:
                            type: string
                            example: N. Chidambaram Iyer
                            description: Translator of the edition the verse was read in. Absent on a convention.
                          year:
                            type: number
                            example: 1884
                            description: Publication year of that edition. Absent on a convention.
                          publicDomain:
                            type: boolean
                            example: true
                            description: Whether the cited edition is in the public domain. True on the 1884 Brihat Samhita edition, whose verses are quoted. False on the 1933 Manasara edition behind the Ayadi formulas, from which only the multipliers, divisors and names are taken, never a sentence.
                          basis:
                            type: string
                            example: the south-west placement of the principal bedroom is later Vastu practice; chapter 53 places no bedroom
                            description: Why a convention rule says what it says. Present only when text is convention, and it names the tradition the rule comes from rather than a verse.
                        required:
                        - text
                        description: 'Where a verdict comes from: a chapter and verse of a named public-domain edition, or the literal convention with the practice it rests on. Every verdict in this domain carries one.'
                    required:
                    - verdict
                    - effect
                    - source
                    description: Whether the ground is a regular four sided figure, per 53.115, which gives the death of kinsmen for an irregular shape and barrenness for irregular sides.
                  ratio:
                    type: object
                    properties:
                      verdict:
                        type: string
                        example: irregular
                        description: How the reading lands. Always English, safe to compare against and to key styling on.
                      effect:
                        type: string
                        example: The ground is not a regular four sided figure. The chapter gives the death of kinsmen for an irregular shape and barrenness for irregular sides.
                        description: What the verdict means, as original prose. Translated in place when lang is set to a language other than English.
                      source:
                        type: object
                        properties:
                          text:
                            type: string
                            example: Brihat Samhita
                            description: The primary text this verdict rests on, or the literal value convention where no verse states the rule. Always English, safe to compare against.
                          chapter:
                            type: number
                            example: 53
                            description: Chapter of the primary text. Absent on a convention, which has no chapter to cite.
                          verse:
                            type: string
                            example: '118'
                            description: Verse or verse range inside the chapter. Absent on a convention. A range is written with a hyphen, as in 115-117.
                          translation:
                            type: string
                            example: N. Chidambaram Iyer
                            description: Translator of the edition the verse was read in. Absent on a convention.
                          year:
                            type: number
                            example: 1884
                            description: Publication year of that edition. Absent on a convention.
                          publicDomain:
                            type: boolean
