  /vastu/rooms:
    post:
      operationId: calculateRoomCompliance
      tags:
      - Vastu
      summary: Check room placement - Vastu room direction compliance API
      description: 'Vastu room direction check for a whole floor plan: send the plot and a list of rooms, by quarter or by outline, and the API returns a verdict per room with the quarters it belongs in, the quarters to keep it out of, a remedy when it is misplaced, and a composite score with the weights published. Four of the twelve room types carry a chapter and verse and the other eight are labelled convention, so a report can say which half of it is classical. Built for floor plan tools, listing checks and practitioner reports.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                plot:
                  type: object
                  properties:
                    width:
                      type: number
                      exclusiveMinimum: 0
                      example: 30
                      description: East-west extent of a rectangular plot, in the unit given. Send this with depth for a rectangle, or send polygon instead.
                    depth:
                      type: number
                      exclusiveMinimum: 0
                      example: 40
                      description: North-south extent of a rectangular plot, in the unit given. Send this with width for a rectangle, or send polygon instead.
                    polygon:
                      type: array
                      items:
                        type: object
                        properties:
                          x:
                            type: number
                            example: 15
                            description: Distance east of the plot origin, in the same unit as the plot. The x axis runs east.
                          y:
                            type: number
                            example: 0
                            description: Distance north of the plot origin, in the same unit as the plot. The y axis runs north.
                        required:
                        - x
                        - y
                      minItems: 3
                      maxItems: 16
                      example:
                      - x: 0
                        y: 0
                      - x: 30
                        y: 0
                      - x: 30
                        y: 40
                      - x: 0
                        y: 40
                      description: The plot outline as 3 to 16 vertices in plot coordinates, x east and y north, in either winding order. Use this instead of width and depth for a plot with a cut corner, an extension or an irregular boundary.
                    unit:
                      type: string
                      enum:
                      - feet
                      - metres
                      default: feet
                      example: feet
                      description: Unit the plot dimensions are given in. Every distance the response returns is in this same unit. The mandala projection is scale free, so this affects the areas and the marma size and nothing else.
                  example:
                    width: 30
                    depth: 40
                    unit: feet
                  description: The ground the mandala is projected over. Send width and depth for a compass-aligned rectangle, or polygon for anything else. The x axis runs east and the y axis north, and the mandala is aligned to the compass rather than to the building.
                facing:
                  type: string
                  enum:
                  - North
                  - Northeast
                  - East
                  - Southeast
                  - South
                  - Southwest
                  - West
                  - Northwest
                  example: North
                  description: Direction the front of the house looks out toward, one of the eight compass sectors. Case and punctuation are folded, so north-east, northeast and NorthEast all resolve. Send this or facingDegrees, never both.
                facingDegrees:
                  type: number
                  minimum: 0
                  maximum: 360
                  example: 15
                  description: Direction the front of the house looks out toward, as a compass bearing in degrees clockwise from true north, measured looking OUT from the building. The same convention the feng shui facing endpoints use, so a bearing works unchanged across the two domains. Send this or facing, never both.
                rooms:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - puja
                        - kitchen
                        - master-bedroom
                        - bedroom
                        - living
                        - dining
                        - study
                        - toilet
                        - store
                        - staircase
                        - water-storage
                        - entrance
                        example: kitchen
                        description: What the room is, one of puja, kitchen, master-bedroom, bedroom, living, dining, study, toilet, store, staircase, water-storage, entrance. Case and punctuation are folded, so Master Bedroom and master_bedroom both resolve. Four of the twelve carry a verse and the rest carry convention, and the response says which.
                      direction:
                        type: string
                        enum:
                        - North
                        - Northeast
                        - East
                        - Southeast
                        - South
                        - Southwest
                        - West
                        - Northwest
                        example: Southeast
                        description: Which quarter of the plot the room sits in, if you already know it. Send this or polygon, never both.
                      polygon:
                        type: array
                        items:
                          type: object
                          properties:
                            x:
                              type: number
                              example: 15
                              description: Distance east of the plot origin, in the same unit as the plot. The x axis runs east.
                            y:
                              type: number
                              example: 0
                              description: Distance north of the plot origin, in the same unit as the plot. The y axis runs north.
                          required:
                          - x
                          - y
                        minItems: 3
                        maxItems: 16
                        example:
                        - x: 20
                          y: 2
                        - x: 28
                          y: 2
                        - x: 28
                          y: 12
                        - x: 20
                          y: 12
                        description: The room outline in plot coordinates, 3 to 16 vertices. The quarter is read from the area centroid against thirds of the plot, so an L-shaped room lands where its mass is rather than where its corners are. Send this or direction, never both.
                    required:
                    - type
                  minItems: 1
                  maxItems: 24
                  description: The rooms to check, 1 to 24 of them. Each carries a type and either the quarter it sits in or its outline.
              required:
              - plot
              - rooms
              example:
                plot:
                  width: 30
                  depth: 40
                  unit: feet
                facing: North
                rooms:
                - type: kitchen
                  direction: Southeast
                - type: master-bedroom
                  direction: Southwest
              description: The floor plan to check. Send facing or facingDegrees, never both, and give each room either its quarter or its outline, never both.
