                      familyMember:
                        type: string
                        example: Eldest Daughter
                        description: Family role of the trigram. Read alongside an affliction to know which member of the household a sector points at.
                    required:
                    - number
                    - chinese
                    - english
                    - pinyin
                    - symbol
                    - binary
                    - element
                    - direction
                    - familyMember
                  sectors:
                    type: array
