        name: lang
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 9
          default: 20
          example: 20
          description: Maximum stars to return per page. Range 1 to 9, default 20.
        required: false
        description: Maximum stars to return per page. Range 1 to 9, default 20.
        name: limit
        in: query
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          default: 0
          example: 0
          description: Number of stars to skip for pagination. Default 0.
        required: false
        description: Number of stars to skip for pagination. Default 0.
        name: offset
        in: query
