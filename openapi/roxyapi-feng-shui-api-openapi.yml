  /feng-shui/periods:
    get:
      operationId: listNinePeriods
      tags:
      - Feng Shui
      summary: List the nine periods - San Yuan period table API
      description: The nine twenty year periods of the 180 year San Yuan cycle from 1864 to 2043, each with its ruling star, five phase, palace and the exact Li Chun date it opened, plus which period is in force on a given date. A building takes the period it was completed in and keeps that period plate for life, so this is the table that decides which natal chart a property gets. Period 9 opened on 4 February 2024, which means a building finished in January 2024 is still a Period 8 building.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      - schema:
          type: string
          format: date
          example: '2026-08-23'
          description: Date to resolve the current period for, in YYYY-MM-DD format. Defaults to today in UTC. Useful for asking which period a building was completed in.
        required: false
        description: Date to resolve the current period for, in YYYY-MM-DD format. Defaults to today in UTC. Useful for asking which period a building was completed in.
        name: date
        in: query
      responses:
        '200':
          description: The nine periods with ruling stars and the period in force
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    example: 9
                    description: Number of periods in the cycle. Always nine.
                  cycleStartYear:
                    type: number
                    example: 1864
                    description: First solar year of the recorded 180 year cycle.
                  cycleEndYear:
                    type: number
                    example: 2043
                    description: Last solar year of the recorded cycle. The cycle then repeats, so 2044 opens Period 1 again.
                  date:
                    type: string
                    example: '2026-08-23'
                    description: The date the current period was resolved for. Echoes the date requested, or the current UTC date when it was omitted.
                  currentPeriod:
                    type: number
                    example: 9
                    description: The period in force on that date. Resolved at Li Chun, so a date in January belongs to the previous solar year and can fall in the previous period.
                  periods:
                    type: array
                    items:
                      type: object
                      properties:
                        number:
                          type: number
                          example: 9
                          description: Period number, 1 to 9. A building takes the period it was completed in and keeps that period plate for its whole life, so this is the first input to every natal chart.
                        startYear:
                          type: number
                          example: 2024
                          description: First solar year of the period. The period opens at Li Chun of this year, in early February, not on 1 January.
                        endYear:
                          type: number
                          example: 2043
                          description: Last solar year of the period. The next period opens at Li Chun of the year after.
                        startDate:
                          type: string
                          example: '2024-02-04'
                          description: Exact date the period opened, computed astronomically. Li Chun is commonly quoted as 4 February and falls on the 3rd or the 5th in roughly one year in four, which is what decides whether a building finished in early February belongs to this period or the last.
                        era:
                          type: string
                          example: lower
                          description: 'Which sixty year era the period belongs to: upper, middle or lower, three periods each. Always English, safe to compare against.'
                        eraName:
                          type: string
                          example: Lower Era
                          description: Display name of the era.
                        rulingStar:
                          type: number
                          example: 8
                          description: 'Flying star number, 1 to 9. The number IS the identifier of the star: 8 is always the Eight White Earth star whichever plate it appears on.'
                        rulingStarName:
