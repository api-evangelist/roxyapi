  /feng-shui/flying-stars/natal:
    post:
      operationId: generateFlyingStarChart
      tags:
      - Feng Shui
      summary: Generate flying star natal chart - Xuan Kong Fei Xing API
      description: Cast the Xuan Kong flying star natal chart for a building from its construction period and the direction it faces. Returns all nine palaces with the period star, the mountain star that governs health and relationships and the water star that governs wealth, plus the named formation and a composed reading for every palace, and the classical verdict on how the two prosperous stars landed. Facing is accepted as one of the 24 mountains or as a compass bearing. Built for property analysis tools, floor plan overlays and consultation software.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                period:
                  type: integer
                  minimum: 1
                  maximum: 9
                  example: 9
                  description: Construction period of the building, 1 to 9. This is the twenty year cycle the building was completed in, or last renovated heavily enough to reset, and it is fixed for the life of the building. Periods change at Li Chun in early February, so a building finished in January 2024 is a Period 8 building. Defaults to the period in force now.
                facing:
                  type: string
                  enum:
                  - ren
                  - zi
                  - gui
                  - chou
                  - gen
                  - yin
                  - jia
                  - mao
                  - yi
                  - chen
                  - xun
                  - si
                  - bing
                  - wu
                  - ding
                  - wei
                  - kun
                  - shen
                  - geng
                  - you
                  - xin
                  - xu
                  - qian
                  - hai
                  - N1
                  - N2
                  - N3
                  - NE1
                  - NE2
                  - NE3
                  - E1
                  - E2
                  - E3
                  - SE1
                  - SE2
                  - SE3
                  - S1
                  - S2
                  - S3
                  - SW1
                  - SW2
                  - SW3
                  - W1
                  - W2
                  - W3
                  - NW1
                  - NW2
                  - NW3
                  example: wu
                  description: The mountain the front of the building faces, by id or by compass label such as S2. Send this or facingDegrees, not neither. The facing side is the open, active, public side, which is not always the side with the front door.
                facingDegrees:
                  type:
                  - number
                  - 'null'
                  minimum: 0
                  maximum: 360
                  example: 180
                  description: The compass bearing the front of the building faces, 0 to 360 degrees, measured looking out from inside. Resolved to one of the 24 mountains. Send this or facing, not neither.
      responses:
        '200':
          description: Nine palaces with period, mountain and water stars, readings and structure
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: number
                    example: 9
                    description: The period this chart was built for. Echoes the period requested, or the period in force now when it was omitted.
                  facing:
                    type: object
                    properties:
                      id:
                        type: string
                        example: wu
                        description: Mountain id, the pinyin of the stem, branch or trigram that names it. Always English pinyin, safe to compare against.
                      label:
                        type: string
                        example: S2
                        description: Compass label of the mountain, sector plus position 1 to 3 clockwise. The form a facing is usually quoted in.
                      chinese:
                        type: string
                        example: 午
                        description: Chinese character for the mountain. Data, identical in every language.
                      pinyin:
                        type: string
                        example: Wǔ
                        description: Tone-marked pinyin for the mountain. Data, identical in every language.
                      direction:
                        type: string
                        example: Southeast
                        description: Compass sector, one of North, Northeast, East, Southeast, South, Southwest, West, Northwest. Always English, whatever the lang parameter says, so it stays safe to compare against in code and against the same value on the I-Ching trigram endpoints.
                      yuan:
                        type: string
                        example: heaven
                        description: 'Which of the three dragons the mountain holds inside its sector: earth for the first mountain clockwise, heaven for the middle, human for the last. The heaven and human dragons share a polarity, which is why they share a chart.'
                      polarity:
                        type: string
                        example: yin
                        description: San Yuan polarity of the mountain, yang or yin, which decides whether a plate entering the centre flies forward or in reverse. This is NOT the natural polarity of the stem or branch and the two differ on eight of the 24 mountains.
                      startDegree:
                        type: number
                        example: 172.5
                        description: Start of the 15 degree span, in compass degrees. Wraps past 360 for the two northernmost mountains.
                      endDegree:
                        type: number
                        example: 187.5
                        description: End of the 15 degree span, in compass degrees.
                    required:
                    - id
                    - label
                    - chinese
                    - pinyin
                    - direction
                    - yuan
                    - polarity
                    - startDegree
                    - endDegree
                  sitting:
                    type: object
                    properties:
                      id:
                        type: string
                        example: wu
                        description: Mountain id, the pinyin of the stem, branch or trigram that names it. Always English pinyin, safe to compare against.
                      label:
                        type: string
                        example: S2
                        description: Compass label of the mountain, sector plus position 1 to 3 clockwise. The form a facing is usually quoted in.
                      chinese:
                        type: string
                        example: 午
                        description: Chinese character for the mountain. Data, identical in every language.
                      pinyin:
                        type: string
                        example: Wǔ
                        description: Tone-marked pinyin for the mountain. Data, identical in every language.
                      direction:
                        type: string
                        example: Southeast
                        description: Compass sector, one of North, Northeast, East, Southeast, South, Southwest, West, Northwest. Always English, whatever the lang parameter says, so it stays safe to compare against in code and against the same value on the I-Ching trigram endpoints.
                      yuan:
                        type: string
                        example: heaven
                        description: 'Which of the three dragons the mountain holds inside its sector: earth for the first mountain clockwise, heaven for the middle, human for the last. The heaven and human dragons share a polarity, which is why they share a chart.'
                      polarity:
                        type: string
                        example: yin
                        description: San Yuan polarity of the mountain, yang or yin, which decides whether a plate entering the centre flies forward or in reverse. This is NOT the natural polarity of the stem or branch and the two differ on eight of the 24 mountains.
                      startDegree:
                        type: number
                        example: 172.5
                        description: Start of the 15 degree span, in compass degrees. Wraps past 360 for the two northernmost mountains.
                      endDegree:
                        type: number
                        example: 187.5
                        description: End of the 15 degree span, in compass degrees.
                    required:
                    - id
                    - label
                    - chinese
                    - pinyin
                    - direction
                    - yuan
                    - polarity
                    - startDegree
                    - endDegree
                  facingDegrees:
                    type: number
                    example: 180
                    description: Echo of the bearing sent, when one was sent. Absent when the facing was named as a mountain instead.
                  straddling:
                    type: boolean
                    example: false
                    description: Whether the bearing fell in the outer 3 degrees of its mountain rather than the central 9. A bearing there calls for the substitute gua construction, which is a different chart; this chart is always the down gua one, so a true value means the result needs a specialist rather than this endpoint. Always false when the facing was named as a mountain, since naming a mountain expresses no bearing.
                  mountainCenterStar:
                    type: number
                    example: 8
                    description: 'Flying star number, 1 to 9. The number IS the identifier of the star: 8 is always the Eight White Earth star whichever plate it appears on.'
                  waterCenterStar:
                    type: number
                    example: 8
                    description: 'Flying star number, 1 to 9. The number IS the identifier of the star: 8 is always the Eight White Earth star whichever plate it appears on.'
                  mountainFlight:
                    type: string
                    example: reverse
                    description: Whether the mountain plate flew forward or in reverse, decided by the polarity of the mountain the centre star answers to. Published because it is the step that separates two charts that otherwise look alike.
                  waterFlight:
                    type: string
                    example: forward
                    description: Whether the water plate flew forward or in reverse, decided the same way against the facing mountain.
                  structure:
                    type: object
                    properties:
                      id:
                        type: string
                        example: double-sitting
                        description: 'The classical verdict on the chart: prosperous-mountain-prosperous-water, reversed, double-facing or double-sitting. Always English, safe to switch on.'
                      name:
                        type: string
                        example: Double Star at Sitting
                        description: Display name of the structure, TRANSLATED IN PLACE under the lang parameter. Switch on structure.id, which is the stable machine value in every language. Unlike the star and formation names beside it, this field has no nameLocalized sibling.
                      chinese:
                        type: string
                        example: 雙星到坐
                        description: Chinese name of the structure. Data, identical in every language.
                      meaning:
                        type: string
                        example: Both prosperous stars gather at the back of the building. Good for health, for family and for anyone who works from home, weaker for income arriving from outside.
                        description: What the structure means and what the classical correction for it is.
                    required:
                    - id
                    - name
                    - chinese
                    - meaning
                  palaces:
                    type: array
                    items:
                      type: object
                      properties:
                        palace:
                          type: string
                          example: Southeast
                          description: 'Palace of the Lo Shu grid: one of the eight compass sectors, or Center. Always English, safe to compare against and to key a grid cell on.'
                        base:
                          type: number
                          example: 8
                          description: 'Flying star number, 1 to 9. The number IS the identifier of the star: 8 is always the Eight White Earth star whichever plate it appears on.'
                        period:
                          type: number
                          example: 8
                          description: 'Flying star number, 1 to 9. The number IS the identifier of the star: 8 is always the Eight White Earth star whichever plate it appears on.'
                        mountain:
                          type: number
                          example: 8
                          description: 'Flying star number, 1 to 9. The number IS the identifier of the star: 8 is always the Eight White Earth star whichever plate it appears on.'
                        water:
                          type: number
                          example: 8
                          description: 'Flying star number, 1 to 9. The number IS the identifier of the star: 8 is always the Eight White Earth star whichever plate it appears on.'
                        combination:
                          type: object
                          properties:
                            id:
                              type: string
                              example: 8-9
                              description: Canonical key for the pair, lower number first, so a palace holding mountain 9 and water 8 resolves to the same entry as one holding mountain 8 and water 9.
                            name:
                              type: string
                              example: Prosperity Doubled
                              description: Name of the formation. Always English, whatever the lang parameter says. Use nameLocalized for anything a reader sees.
                            nameLocalized:
                              type: string
                              example: Prosperidad doblada
                              description: Formation name in the requested language, for display only. Present only when lang is set to a language other than English.
                            chinese:
                              type: string
                              example: 八逢紫曜
                              description: Chinese name of the formation. Data, identical in every language.
                            nature:
                              type: string
                              example: auspicious
                              description: Whether the formation helps or harms.
                          required:
                          - id
                          - name
                          - nature
                          description: The named classical formation for this mountain and water pair. Absent for the pairs the tradition does not name, where the composed reading carries the meaning instead.
                        reading:
                          type: string
                          example: 'Fire producing the wealth Earth, and the ruling star of the current period sitting with the one that ruled the last. It reads as celebration attached to money: marriage, birth, a business milestone, and property that appreciates while it is lived in.'
                          description: What this palace means, composed from the two stars and the phase relation between them. Named formations return their own passage; the rest are built from the star pair.
                      required:
                      - palace
                      - base
                      - period
                      - mountain
                      - water
                      - reading
                    description: All nine palaces, centre first and then along the Lo Shu flight path. Each of the nine stars appears exactly once on each plate, which is the property that makes a chart checkable.
                required:
                - period
                - facing
                - sitting
                - straddling
                - mountainCenterStar
                - waterCenterStar
                - mountainFlight
                - waterFlight
                - structure
                - palaces
