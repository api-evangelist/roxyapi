  /feng-shui/bagua:
    get:
      operationId: listBaguaSectors
      tags:
      - Feng Shui
      summary: List Bagua sectors - Feng shui bagua map API
      description: 'The nine palaces of the compass Bagua map: the eight trigram sectors plus the centre, each with the life area it governs, its five phase, its colours, and both its Later Heaven and Earlier Heaven trigrams. This is the compass map aligned to true directions, so career is always North and wealth is always Southeast whichever way the entrance faces. Trigram details are served from the same source as the I-Ching trigram endpoints, so the two agree field for field. Built for floor plan overlays, room-by-room guides and any interface that maps a space onto life areas.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 9
          default: 20
          example: 20
          description: Maximum sectors to return per page. Range 1 to 9, default 20.
        required: false
        description: Maximum sectors to return per page. Range 1 to 9, default 20.
        name: limit
        in: query
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          default: 0
          example: 0
          description: Number of sectors to skip for pagination. Default 0.
        required: false
        description: Number of sectors to skip for pagination. Default 0.
        name: offset
        in: query
      responses:
        '200':
          description: The nine Bagua palaces with life areas, elements, colours and trigrams
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    example: 9
                    description: Number of palaces in the map.
                  limit:
                    type: number
                    example: 20
                    description: Page size applied.
                  offset:
                    type: number
                    example: 0
                    description: Number of entries skipped.
                  sectors:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: wealth
                          description: 'Life area id: career, knowledge, family, wealth, fame, love, children, helpful-people or health. Always English, whatever the lang parameter says, so it stays safe to compare against in code. Use nameLocalized for anything a reader sees.'
                        name:
                          type: string
                          example: Wealth and Abundance
                          description: Display name of the life area. Always English, whatever the lang parameter says. Use nameLocalized for anything a reader sees.
                        nameLocalized:
                          type: string
                          example: Riqueza y abundancia
                          description: Life area name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat name exactly. Never compare against this value.
                        number:
                          type: number
                          example: 4
                          description: Lo Shu number of the palace, 1 to 9. This is the same number the flying stars use, so a chart palace and a Bagua sector line up by it.
                        palace:
                          type: string
                          example: Southeast
                          description: 'Palace of the Lo Shu grid: one of the eight compass sectors, or Center for the ninth. Always English, safe to compare against.'
                        direction:
                          type: string
                          example: Southeast
                          description: Compass sector of the palace, taken from the trigram that sits there. Absent on the centre palace, which has no direction.
                        element:
                          type: string
                          example: Wood
                          description: 'Five phase of this entry: Wood, Fire, Earth, Metal or Water. Always English so it stays safe to compare against and to key styling on. The full cycles live on the Chinese astrology elements endpoint.'
                        colors:
                          type: array
                          items:
                            type: string
                            example: green
                            description: One colour of the phase this sector carries, lower case.
                          example:
                          - green
                          - teal
                          - brown
                          description: Colours of the phase this sector carries, for activating it. Derived from the element rather than assigned per sector, so they cannot disagree with the element beside them.
                        trigram:
                          type: object
                          properties:
                            number:
                              type: number
                              example: 4
                              description: Trigram number, 1 to 8, the same identifier the I-Ching trigram endpoints use. It is a lookup key, not a ranking.
                            chinese:
                              type: string
                              example: 巽
                              description: Chinese character for the trigram. Data, identical in every language.
                            english:
                              type: string
                              example: Wind
                              description: English name of the trigram, byte identical to the value the I-Ching trigram endpoints publish for this number.
                            pinyin:
                              type: string
                              example: Xùn
                              description: Tone-marked pinyin for the trigram. Data, identical in every language.
                            symbol:
                              type: string
                              example: ☴
                              description: Unicode trigram symbol, for rendering a Bagua diagram without an icon set.
                            binary:
                              type: string
                              example: '011'
                              description: Three lines bottom to top, 1 for yang and 0 for yin. The Eight Mansions classification of any sector is decided by which of these three lines differ from your own trigram.
                            element:
                              type: string
                              example: Wood
                              description: 'Five phase of this entry: Wood, Fire, Earth, Metal or Water. Always English so it stays safe to compare against and to key styling on. The full cycles live on the Chinese astrology elements endpoint.'
                            direction:
