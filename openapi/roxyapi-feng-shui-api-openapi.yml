  /feng-shui/eight-mansions:
    post:
      operationId: generateEightMansions
      tags:
      - Feng Shui
      summary: Generate Eight Mansions map - Ba Zhai lucky direction API
      description: 'Build the full Eight Mansions (Ba Zhai) map for a person: all eight compass sectors classified into the four favourable stars, Sheng Chi, Tian Yi, Yan Nian and Fu Wei, and the four unfavourable ones, Huo Hai, Wu Gui, Liu Sha and Jue Ming. Sectors come back ordered best to worst with a composed reading each, plus the ranking that decides which affliction to accept when no favourable sector is reachable. Accepts a Kua number directly or derives one from a birth date and sex. Built for bed and desk placement tools, room-by-room reports and floor plan overlays.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kua:
                  type: number
                  minimum: 1
                  maximum: 9
                  example: 6
                  description: Kua number to build the map for, if you already have one. Send this OR date and gender, not neither. A Kua of 5 is read as the Kua 2 chart, since 5 has no direction of its own.
                date:
                  type: string
                  format: date
                  example: '1985-07-15'
                  description: Birth date in YYYY-MM-DD format, used to derive the Kua when no kua is sent. Requires gender alongside it. A date is read at the start of its day, so a birth date landing exactly on the year boundary is placed in the outgoing year.
                gender:
                  type: string
                  enum:
                  - male
                  - female
                  example: male
                  description: Selects the Kua formula variant. Required when the Kua is being derived from a birth date.
                yearBoundary:
                  type: string
                  enum:
                  - li-chun
                  - lunar-new-year
                  default: li-chun
                  example: li-chun
                  description: Which boundary starts the Chinese year when the Kua is derived from a birth date. Defaults to li-chun, the classical position. Ignored when a kua is sent directly, and echoed back either way.
                facing:
                  type: string
                  enum:
                  - North
                  - Northeast
                  - East
                  - Southeast
                  - South
                  - Southwest
                  - West
                  - Northwest
                  example: Southeast
                  description: Optional compass sector the main door faces, one of North, Northeast, East, Southeast, South, Southwest, West, Northwest. When sent, the response names the star sitting on that sector so a caller can judge an entrance without scanning the whole map.
              description: Send either a kua number, or a date and gender to derive one. Sending neither is a 400.
      responses:
        '200':
          description: Eight classified sectors ordered best to worst, with readings
          content:
            application/json:
              schema:
                type: object
                properties:
                  kua:
                    type: number
                    example: 6
                    description: The Kua number this map was built for.
                  group:
                    type: string
                    example: west
                    description: Life group, east or west. Always English, safe to compare against and to key styling on.
                  trigram:
                    type: object
                    properties:
                      number:
                        type: number
                        example: 4
                        description: Trigram number, 1 to 8, the same identifier the I-Ching trigram endpoints use. It is a lookup key, not a ranking.
                      chinese:
                        type: string
                        example: 巽
                        description: Chinese character for the trigram. Data, identical in every language.
                      english:
                        type: string
                        example: Wind
                        description: English name of the trigram, byte identical to the value the I-Ching trigram endpoints publish for this number.
                      pinyin:
                        type: string
                        example: Xùn
                        description: Tone-marked pinyin for the trigram. Data, identical in every language.
