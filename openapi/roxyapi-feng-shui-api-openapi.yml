                          example: The West sector reads Sheng Chi for Kua 6. This is one of the four favourable sectors for Kua 6, ranked 1 of four. The generating breath, and the strongest of the four favourable sectors. It is the direction to face while working, to seat a main door in, and to put a desk against, because it reads as advancement, new business and the kind of momentum that compounds. Where a household has to choose one sector to get right, this is the one.
                          description: 'Composed reading for this sector: which star it holds, where that star ranks for this Kua, and what the star means in practice.'
                      required:
                      - direction
                      - star
                      - starName
                      - chinese
                      - pinyin
                      - nature
                      - rank
                      - domain
                      - trigram
                      - reading
                    description: All eight sectors, ordered best to worst rather than by compass, because the question this map answers is which sector to use next. Read down the list until you reach one the building actually has.
                  bestSector:
                    type: string
                    example: Southeast
                    description: Compass sector, one of North, Northeast, East, Southeast, South, Southwest, West, Northwest. Always English, whatever the lang parameter says, so it stays safe to compare against in code and against the same value on the I-Ching trigram endpoints.
