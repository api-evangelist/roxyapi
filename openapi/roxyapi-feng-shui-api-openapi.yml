  /feng-shui/afflictions/{year}:
    get:
      operationId: getAnnualAfflictions
      tags:
      - Feng Shui
      summary: Annual afflictions - Tai Sui, San Sha and Five Yellow API
      description: 'Return the four annual feng shui afflictions for a solar year with their exact positions: Tai Sui on the mountain of the year branch, Sui Po on the mountain opposite, the Three Killings across the cardinal span opposite the elemental frame of the year, and the Five Yellow wherever it lands on the annual star plate. Positions come with degree ranges rather than only sector names, because Tai Sui occupies 15 degrees and the neighbouring mountains of the same sector are unaffected. All four move at Li Chun in early February, not at Lunar New Year, and the changeover date is returned. Built for renovation planning, date selection and yearly guidance features.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: integer
          minimum: 1900
          maximum: 2100
          example: 2026
          description: Solar year, 1900 to 2100. The year runs from Li Chun to Li Chun, so a date in January belongs to the previous year here.
        required: true
        description: Solar year, 1900 to 2100. The year runs from Li Chun to Li Chun, so a date in January belongs to the previous year here.
        name: year
        in: path
