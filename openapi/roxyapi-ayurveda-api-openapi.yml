  /ayurveda/doshas/{id}:
    get:
      operationId: getDosha
      tags:
      - Ayurveda
      summary: Get one dosha - Vata pitta kapha profile API
      description: Return one dosha with its elements, qualities, seats, five sub-doshas and three states. Use it to render a dosha card or a glossary entry without pulling the whole catalogue, and read qualityGunas to join it to the twenty qualities.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - vata
          - pitta
          - kapha
          example: vata
          description: Dosha identifier, case-insensitive. One of vata, pitta or kapha.
        required: true
        description: Dosha identifier, case-insensitive. One of vata, pitta or kapha.
        name: id
        in: path
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      responses:
