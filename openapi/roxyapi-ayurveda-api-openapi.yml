  /ayurveda/ritucharya:
    post:
      operationId: getRitucharya
      tags:
      - Ayurveda
      summary: Ayurveda seasonal regimen - Ritucharya and ritu resolution API
      description: Resolve the ritucharya, the Ayurvedic season, for a date from the real solar ingress instants and return the regimen the primary text gives for it. The response carries the season with its exact opening and closing instants, the half of the year the sun is in, where each dosha stands in the seasonal cycle, the taste that grows across the season, and the behaviour items the chapter states. Season boundaries are measured in the tropical zodiac by default, which is what published almanacs use, and the sidereal reading is available as a convention and runs about 24 days later.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AyurvedaRitucharyaRequest'
      responses:
        '200':
          description: The season, its boundaries, and what the chapter states for it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    example: '2026-03-01'
                    description: The date this reading is for, echoing the request.
                  ritu:
                    type: object
                    properties:
                      id:
                        type: string
                        example: vasanta
                        description: The season as a Sanskrit identifier, always English-safe and never translated. One of sisira, vasanta, grisma, varsa, sarad and hemanta, plus pravrt which only the alternate scheme carries.
                      sanskritName:
                        type: string
                        example: vasanta
                        description: The season in the standard diacritic transliteration.
                      devanagari:
                        type: string
                        example: वसन्त
                        description: The season in Devanagari. Data rather than a translation, so it is identical under every language.
                      gloss:
                        type: string
                        example: spring
                        description: What the season is called in the requested language. This is the gloss and it does translate; the identifier above does not.
                      classicalRitu:
                        type: string
                        example: vasanta
                        description: The default-scheme season the classical layer was read from. Equal to the id in the ordinary case, and different under the alternate scheme, whose own verse states no strength cycle, taste cycle or dosha cycle for its seasons.
                      start:
                        type: string
                        example: '2026-02-18T15:51:27.000Z'
                        description: When the season opened, as an ISO 8601 instant in UTC. This is the ingress into the first of its two solar months, computed rather than tabulated, so it is exact to the second.
                      end:
                        type: string
                        example: '2026-04-20T01:39:12.000Z'
                        description: When the season closes, as an ISO 8601 instant in UTC. It is the ingress that opens the next season, so two consecutive calls join without a gap.
                      solarMonths:
                        type: array
                        items:
                          type: object
                          properties:
                            index:
                              type: number
                              example: 11
                              description: Zero-based rasi index, 0 for Aries, so a caller can order the twelve without a name table.
                            id:
                              type: string
                              example: pisces
                              description: The rasi as the lowercase English sign id every other RoxyAPI domain uses.
                            sanskritName:
                              type: string
                              example: Meena
                              description: The solar month under the name a panchang prints for it. Data, identical in every language.
                          required:
                          - index
                          - id
                          - sanskritName
                          description: One of the two solar months the season spans.
                        description: The two solar months the season spans, in order. A solar month is the interval the sun spends inside one rasi, which is why every boundary above is an ingress instant.
                    required:
