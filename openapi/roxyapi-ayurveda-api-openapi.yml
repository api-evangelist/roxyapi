openapi: 3.2.0
info:
  title: Roxy Ayurveda API
  version: 2.0.0
  description: '# RoxyAPI: the Spiritual OS layer for agentic AI


    > **Base URL:** `https://roxyapi.com/api/v2`.'
  x-error-codes:
  - code: validation_error
    status: 400
    meaning: A field is missing or invalid. The body lists every failing field at once in issues, each with its path and the expected shape.
  - code: bad_request
    status: 400
    meaning: The request was rejected as a whole, for example a body that is not valid JSON or a date range that ends before it starts.
  - code: date_out_of_range
    status: 400
    meaning: A date lies outside the span the planetary positions are served for. The error names the supported dates.
  - code: api_key_required
    status: 401
    meaning: No API key was sent.
  - code: invalid_api_key
    status: 401
    meaning: The key sent is malformed or cannot be verified.
  - code: api_key_revoked
    status: 401
    meaning: The key was valid once and has since been revoked from the account page.
  - code: subscription_not_found
    status: 401
    meaning: The key verifies, but the subscription behind it no longer exists.
  - code: subscription_inactive
    status: 401
    meaning: The subscription behind the key is cancelled, expired or suspended, or a trial is past its end date.
  - code: publishable_key_not_allowed_on_mcp
    status: 401
    meaning: A publishable key was used on a Remote MCP server, which takes a secret key.
  - code: invalid_client_ip
    status: 401
    meaning: A keyless request could not be attributed to a caller.
  - code: unauthorized
    status: 401
    meaning: Authentication failed with no more specific reason to give.
  - code: forbidden
    status: 403
    meaning: The key is valid, but this request is not permitted.
  - code: origin_required
    status: 403
    meaning: A publishable key with an origin allowlist was used with no Origin header, as from a server or a native app.
  - code: origin_not_allowed
    status: 403
    meaning: The calling site is not on the origin allowlist of this publishable key.
  - code: not_found
    status: 404
    meaning: Nothing is served at this path, or the identifier in it does not exist. A path miss adds suggestions, the closest real endpoints.
  - code: method_not_allowed
    status: 405
    meaning: The path exists for a different HTTP method. The body lists the accepted methods in allow, as does the Allow header.
  - code: conflict
    status: 409
    meaning: The request cannot be applied in the current state.
  - code: gone
    status: 410
    meaning: The path was removed permanently.
  - code: payload_too_large
    status: 413
    meaning: The request body is larger than the API accepts.
  - code: unsupported_media_type
    status: 415
    meaning: 'A request with a body was sent without Content-Type: application/json.'
  - code: unprocessable_entity
    status: 422
    meaning: Every field is valid, but the combination cannot be computed.
  - code: rate_limit_exceeded
    status: 429
    meaning: The monthly request allowance is used up. Retry-After gives the seconds to the reset.
  - code: rate_limit_per_minute
    status: 429
    meaning: The per-minute limit of the plan was reached. Retry-After gives the seconds to the next minute, and the monthly allowance is not charged.
  - code: rate_limited
    status: 429
    meaning: A rate limit was reached, reported without the plan detail.
  - code: free_tier_exhausted
    status: 429
    meaning: A keyless request has used up its trial allowance.
  - code: internal_error
    status: 500
    meaning: The request failed inside our service. Retry with exponential backoff.
  - code: compute_saturated
    status: 503
    meaning: Heavy calculations are briefly at capacity. Send the same request again after Retry-After seconds.
  - code: error
    status: null
    meaning: A fallback for a status with no more specific code. The status and the error field carry the signal.
  contact:
    name: RoxyAPI Support
    url: https://roxyapi.com/contact
  license:
    name: Proprietary
    url: https://roxyapi.com/policy/terms
servers:
- url: https://roxyapi.com/api/v2
  description: Production API v2
security:
- apiKey: []
tags:
- name: Ayurveda
  description: Ayurveda API for dosha profiles, the dinacharya daily routine and the ritucharya seasonal regimen, with a verse cited on every value.
paths:
  /ayurveda/constitution:
    post:
      operationId: calculateAyurvedicConstitution
      tags:
      - Ayurveda
      summary: Ayurvedic constitution from a birth chart - Dosha profile API
      description: 'Read the Ayurvedic constitution from a sidereal birth chart and return the vata, pitta and kapha shares with a verse behind every factor. Three factors are scored, each one carrying a classical rule that it shows the native humour: the rising sign, the sign the Moon occupies, and the strongest graha by shadbala. The composite that blends them is a RoxyAPI convention rather than a classical one, so its version and its weights ship inside the response, and every response states that this is general wellness and cultural interest only.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AyurvedaConstitutionRequest'
      responses:
        '200':
          description: The constitution, its cited factors, and the graha table behind them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  frame:
                    type: object
                    properties:
                      ayanamsa:
                        type: string
                        example: lahiri
                        description: The sidereal frame the chart was cast in, echoing the request. Always English, so it is safe to compare against.
                      ayanamsaDegrees:
                        type: number
                        example: 23.72820922463809
                        description: The frame offset in degrees at the birth instant, read once and used for both sign factors and for the strength ranking, so the three cannot come from frames a fraction of a degree apart.
                    required:
                    - ayanamsa
                    - ayanamsaDegrees
                    description: The sidereal frame this reading was cast in.
                  lagnaSign:
                    type: string
                    example: leo
                    description: The rising sign, lowercase and always English. It is the best attested of the three factors and carries the heaviest weight.
                  moonSign:
                    type: string
                    example: scorpio
                    description: The sign the Moon occupies, lowercase and always English. It is read through the same sign table as the rising sign, on the warrant of the verse that equates the two.
                  factors:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: lagna-sign
                          description: Which factor this is. One of lagna-sign, moon-sign or strongest-planet. Always English and stable, so it is safe to switch on. There are three and only three, because the two indicators often listed beside them, the lagna lord and the Sun, carry no classical rule that they show the native humour.
                        input:
                          type: string
                          example: leo
                          description: 'What this factor read: a sign id for the two sign factors, or the space-separated grahas that reached the strength cutoff for the third.'
                        doshas:
                          type: array
                          items:
                            type: string
                          example:
                          - pitta
                          description: The humours this factor carries, as the Sanskrit identifiers vata, pitta and kapha. Never translated, so they stay safe to compare against. Where a factor carries more than one they are stored in the standing order and that order means nothing, because the two translations of the source order them differently and their sets are identical.
                        weight:
                          type: number
                          example: 2
                          description: How much of the composite this factor is given. The weights are a RoxyAPI convention and no primary text states them, which is why every one of them is published here rather than kept private.
                        source:
                          type: object
                          properties:
                            text:
                              type: string
                              example: Brihat Jataka
                              description: Title of the work the claim is taken from, as it should be cited.
                            chapter:
                              type: string
                              example: '18'
                              description: Chapter or sthana, as printed in that edition. Use it with the verse to find the passage in any copy.
                            verse:
                              type: string
                              example: note to 20, the Satyacharya extract
                              description: Verse or verse range, printed as the source prints it, so it is a string and not always numeric. Where the claim sits in an appended note or a commentary rather than in a numbered verse, this value is prose, as in "note to 20". Join it to the chapter with a dot only when it is numeric, and otherwise render it after the chapter with a comma, so the pair reads "18, note to 20" rather than "18.note to 20".
                            translation:
                              type:
                              - string
                              - 'null'
                              example: N. Chidambaram Iyer
                              description: The named translator, or null where the English shipped here was written from the Sanskrit because no public-domain translation of that work exists.
                            year:
                              type:
                              - number
                              - 'null'
                              example: 1885
                              description: Publication year of the named translation, or null where no translation is cited. Use it with publicDomain to judge what may be quoted.
                            publicDomain:
                              type: boolean
                              example: true
                              description: Whether the cited translation may be quoted. When false the verse reference is the citation and the translator wording is not reproduced anywhere in this API, so a caller reproducing a source must go to the verse rather than to us.
                            note:
                              type: string
                              example: 'Chapter 18, not 19: the running head on the printed pages reads CH. 19.'
                              description: A recorded disagreement between sources, or a stated limit on what the citation covers. Present only where one exists, and never resolved silently in favour of one reading.
                          required:
                          - text
                          - chapter
                          - verse
                          - translation
                          - year
                          - publicDomain
                          description: Where one claim in this response comes from.
                      required:
                      - id
                      - input
                      - doshas
                      - weight
                      - source
                      description: One cited factor of the reading.
                    description: The three scored factors, in the order they are weighted.
                  composite:
                    type: object
                    properties:
                      vata:
                        type: number
                        example: 20
                        description: Share of vata in whole percent. The three shares always sum to exactly 100, by largest remainder, so a caller can render them as a bar without normalising first.
                      pitta:
                        type: number
                        example: 60
                        description: Share of pitta in whole percent.
                      kapha:
                        type: number
                        example: 20
                        description: Share of kapha in whole percent.
                      dominant:
                        type: string
                        example: pitta
                        description: The humour holding the largest share. A Sanskrit identifier, never translated.
                      secondary:
                        type: string
                        example: vata
                        description: The humour holding the second largest share. Reported whether or not it reached the margin that would put it in the type label.
                      type:
                        type: string
                        example: pitta
                        description: 'The derived label: one humour when it leads clearly, two joined by a hyphen when the second is within the published margin, and sama when all three sit inside that band. Built from Sanskrit identifiers, so it stays the same string in every language.'
                      convention:
                        type: string
                        example: roxyapi/v1
                        description: The version of the blending convention this composite was built under. It is ours and not classical, and it is versioned so a caller comparing two readings taken months apart can tell whether the rule moved.
                      weighting:
                        type: object
                        properties:
                          lagnaSign:
                            type: number
                            example: 2
                            description: Weight given to the rising sign factor.
                          moonSign:
                            type: number
                            example: 1
                            description: Weight given to the Moon sign factor, lower than the rising sign because its classical warrant is the narrower of the two.
                          strongestPlanet:
                            type: number
                            example: 2
                            description: Weight given to the strongest graha factor.
                          strongPlanetThreshold:
                            type: number
                            example: 0.9
                            description: Fraction of the leading shadbala total at which a second graha also counts as strong. The verse licenses a blended result where several planets attain strength and gives no number for several, so this one is ours.
                          dualTypeMargin:
                            type: number
                            example: 10
                            description: Percentage-point gap below which the second humour joins the type label. When all three sit inside it the label is sama.
                        required:
                        - lagnaSign
                        - moonSign
                        - strongestPlanet
                        - strongPlanetThreshold
                        - dualTypeMargin
                        description: Every number behind the blend, published so a caller who disagrees can re-weigh the factors themselves.
                    required:
                    - vata
                    - pitta
                    - kapha
                    - dominant
                    - secondary
                    - type
                    - convention
                    - weighting
                    description: The blended reading. The factors are cited and this is not, which is why it carries a convention label.
                  strengthRanking:
                    type: array
                    items:
                      type: object
                      properties:
                        graha:
                          type: string
                          example: Mars
                          description: Graha name, as a Vedic birth chart returns it.
                        totalVirupas:
                          type: number
                          example: 525.53
                          description: Total shadbala in virupas, the six-fold strength measure. Higher is stronger, and the ranking below is taken from it.
                        rank:
                          type: number
                          example: 1
                          description: Position in the ranking, 1 for the strongest of the seven.
                        strong:
                          type: boolean
                          example: true
                          description: Whether this graha reached the strength cutoff and therefore contributed to the reading. More than one true value is what makes the reading a blend.
                      required:
                      - graha
                      - totalVirupas
                      - rank
                      - strong
                      description: One graha of the strength ranking.
                    description: The seven grahas ranked by shadbala, strongest first. Rahu and Ketu are not ranked, because shadbala is defined over the seven.
                  planetDoshas:
                    type: array
                    items:
                      type: object
                      properties:
                        graha:
                          type: string
                          example: Sun
                          description: Graha name, matching the name a Vedic birth chart uses, so this table joins to a chart with nothing in between.
                        sanskritName:
                          type: string
                          example: sūrya
                          description: The graha name in Sanskrit, in the standard diacritic transliteration.
                        doshas:
                          type: array
                          items:
                            type: string
                          example:
                          - pitta
                          description: The humours the verses give this graha. The Moon and Venus rows carry vata before kapha in both published translations, which is the row material in general circulation most often reverses.
                        dhatu:
                          type: string
                          example: bone
                          description: The bodily constituent this graha rules, in English. Saturn returns a deliberately neutral rendering, because the one Sanskrit word behind it is attested as sinew, tendon, muscle and nerve alike and the two published translations split on it.
                        dhatuSanskrit:
                          type: string
                          example: asthi
                          description: The same constituent in Sanskrit. Read this rather than the English wherever the two translations disagree. These seven are not the standard seven dhatus and three of them will not line up against such a list.
                        doshaSource:
                          type: object
                          properties:
                            text:
                              type: string
                              example: Brihat Jataka
                              description: Title of the work the claim is taken from, as it should be cited.
                            chapter:
                              type: string
                              example: '18'
                              description: Chapter or sthana, as printed in that edition. Use it with the verse to find the passage in any copy.
                            verse:
                              type: string
                              example: note to 20, the Satyacharya extract
                              description: Verse or verse range, printed as the source prints it, so it is a string and not always numeric. Where the claim sits in an appended note or a commentary rather than in a numbered verse, this value is prose, as in "note to 20". Join it to the chapter with a dot only when it is numeric, and otherwise render it after the chapter with a comma, so the pair reads "18, note to 20" rather than "18.note to 20".
                            translation:
                              type:
                              - string
                              - 'null'
                              example: N. Chidambaram Iyer
                              description: The named translator, or null where the English shipped here was written from the Sanskrit because no public-domain translation of that work exists.
                            year:
                              type:
                              - number
                              - 'null'
                              example: 1885
                              description: Publication year of the named translation, or null where no translation is cited. Use it with publicDomain to judge what may be quoted.
                            publicDomain:
                              type: boolean
                              example: true
                              description: Whether the cited translation may be quoted. When false the verse reference is the citation and the translator wording is not reproduced anywhere in this API, so a caller reproducing a source must go to the verse rather than to us.
                            note:
                              type: string
                              example: 'Chapter 18, not 19: the running head on the printed pages reads CH. 19.'
                              description: A recorded disagreement between sources, or a stated limit on what the citation covers. Present only where one exists, and never resolved silently in favour of one reading.
                          required:
                          - text
                          - chapter
                          - verse
                          - translation
                          - year
                          - publicDomain
                          description: Where one claim in this response comes from.
                        dhatuSource:
                          type: object
                          properties:
                            text:
                              type: string
                              example: Brihat Jataka
                              description: Title of the work the claim is taken from, as it should be cited.
                            chapter:
                              type: string
                              example: '18'
                              description: Chapter or sthana, as printed in that edition. Use it with the verse to find the passage in any copy.
                            verse:
                              type: string
                              example: note to 20, the Satyacharya extract
                              description: Verse or verse range, printed as the source prints it, so it is a string and not always numeric. Where the claim sits in an appended note or a commentary rather than in a numbered verse, this value is prose, as in "note to 20". Join it to the chapter with a dot only when it is numeric, and otherwise render it after the chapter with a comma, so the pair reads "18, note to 20" rather than "18.note to 20".
                            translation:
                              type:
                              - string
                              - 'null'
                              example: N. Chidambaram Iyer
                              description: The named translator, or null where the English shipped here was written from the Sanskrit because no public-domain translation of that work exists.
                            year:
                              type:
                              - number
                              - 'null'
                              example: 1885
                              description: Publication year of the named translation, or null where no translation is cited. Use it with publicDomain to judge what may be quoted.
                            publicDomain:
                              type: boolean
                              example: true
                              description: Whether the cited translation may be quoted. When false the verse reference is the citation and the translator wording is not reproduced anywhere in this API, so a caller reproducing a source must go to the verse rather than to us.
                            note:
                              type: string
                              example: 'Chapter 18, not 19: the running head on the printed pages reads CH. 19.'
                              description: A recorded disagreement between sources, or a stated limit on what the citation covers. Present only where one exists, and never resolved silently in favour of one reading.
                          required:
                          - text
                          - chapter
                          - verse
                          - translation
                          - year
                          - publicDomain
                          description: Where one claim in this response comes from.
                      required:
                      - graha
                      - sanskritName
                      - doshas
                      - dhatu
                      - dhatuSanskrit
                      - doshaSource
                      - dhatuSource
                      description: One graha of the informational seven-graha table. Rahu and Ketu are absent because the verses assign a humour to the seven grahas only, and nothing classical supplies one for the nodes.
                    description: The graha to humour and graha to constituent table, as reference. It is informational and does not vary with the request.
                  summary:
                    type: string
                    example: The chart reads pitta, and pitta carries the largest share of it at 60 percent.
                    description: The reading in prose, composed from the factors rather than selected from stock text, and translated in place.
                  conventions:
                    type: object
                    properties:
                      signDoshaScheme:
                        type: string
                        example: satyacharya
                        description: Which sign table the two sign factors were read through. Echoes the request.
                      ayanamsa:
                        type: string
                        example: lahiri
                        description: Which sidereal frame the chart was cast in. Echoes the request, and is repeated here beside the other conventions so one object answers what was chosen.
                    required:
                    - signDoshaScheme
                    - ayanamsa
                    description: The conventions this reading was produced under.
                  meta:
                    type: object
                    properties:
                      disclaimer:
                        type: string
                        example: For general wellness and cultural interest only. This is not medical advice, and it is unrelated to the diagnosis, cure, mitigation, prevention or treatment of any disease or condition. Consult a qualified professional.
                        description: The scope of everything in this response, in the requested language. Present on every response from this API, and intended to be shown to the reader rather than stripped.
                    required:
                    - disclaimer
                    description: Scope of the response.
                required:
                - frame
                - lagnaSign
                - moonSign
                - factors
                - composite
                - strengthRanking
                - planetDoshas
                - summary
                - conventions
                - meta
        '400':
          description: Validation error. `issues[]` lists every failed field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: First issue summary.
                  code:
                    type: string
                    enum:
                    - validation_error
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                  issues:
                    type: array
                    description: Every validation failure. Use this to rebuild a valid request.
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Dot-separated field path, or "(root)" for top-level.
                        message:
                          type: string
                        code:
                          type: string
                          description: Zod issue code (invalid_type, too_small, too_big, invalid_string, ...).
                        expected:
                          type: string
                          description: Expected type for invalid_type.
                        minimum:
                          description: Minimum bound for too_small issues.
                          oneOf:
                          - type: number
                          - type: string
                        maximum:
                          description: Maximum bound for too_big issues.
                          oneOf:
                          - type: number
                          - type: string
                        inclusive:
                          type: boolean
                        format:
                          type: string
                          description: Format name for string issues (regex, email, url, uuid).
                        pattern:
                          type: string
                          description: Regex pattern when format is regex.
                      required:
                      - path
                      - message
                required:
                - error
                - code
                - doc_url
                - issues
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                required:
                - error
                - code
                - doc_url
        '405':
          description: Method not allowed. The path exists but only responds to the methods listed in `allow[]` and the `Allow` response header.
          headers:
            Allow:
              description: Comma-separated list of allowed methods (RFC 9110).
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                    - method_not_allowed
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                  allow:
                    type: array
                    items:
                      type: string
                    description: Allowed HTTP methods for this path. Mirrors the Allow response header.
                  docs:
                    type: string
                    description: Link to the product page for this domain.
                required:
                - error
                - code
                - doc_url
                - allow
        '429':
          description: Monthly rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                required:
                - error
                - code
                - doc_url
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                required:
                - error
                - code
                - doc_url
  /ayurveda/dinacharya:
    post:
      operationId: getDinacharyaSchedule
      tags:
      - Ayurveda
      summary: Dinacharya daily routine - Brahma muhurta and dosha clock API
      description: 'Compute the dinacharya daily routine for one date and one place: sunrise, sunset, the brahma muhurta window, and the six dosha periods of the day and the night. The default division cuts the actual day and the actual night into thirds, which is what the frame chapter states, and the modern clock grid is returned alongside it under its own label so a caller can show either. The brahma muhurta is a fixed window of 96 to 48 minutes before sunrise rather than a share of the night, which is the reading the classical commentary settles on.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AyurvedaDinacharyaRequest'
      responses:
        '200':
          description: The day divided, with the routine the chapter gives.
          content:
            application/json:
