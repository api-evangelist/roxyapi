  /ayurveda/doshas:
    get:
      operationId: listDoshas
      tags:
      - Ayurveda
      summary: List the three doshas - Dosha catalogue API
      description: Return vata, pitta and kapha with the qualities, seats and five sub-doshas each carries, and the three states the seasonal cycle moves them through. Every quality is one of the twenty gunas and every state is described as a position and a quality rather than as a complaint, which is what lets the catalogue join to the tastes and qualities endpoints without a lookup table in between. Each entry carries the verse it comes from, and the second primary text is recorded where it reads the list differently.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 3
          default: 3
          example: 3
          description: 'Maximum items to return per page. Range: 1-3, default 3.'
        required: false
        description: 'Maximum items to return per page. Range: 1-3, default 3.'
        name: limit
        in: query
      - schema:
          type: integer
          minimum: 0
          default: 0
          example: 0
          description: Number of items to skip for pagination. Default 0.
        required: false
        description: Number of items to skip for pagination. Default 0.
        name: offset
        in: query
      responses:
        '200':
          description: The three doshas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    example: 3
                    description: Total number of doshas, which is always three.
                  limit:
                    type: number
                    example: 3
                    description: Maximum doshas returned in this page.
                  offset:
                    type: number
                    example: 0
                    description: Number of doshas skipped before this page.
                  doshas:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: vata
                          description: 'The dosha as a Sanskrit identifier: vata, pitta or kapha. Never translated in any language, because a caller switches on it, and a translated dosha name is a different concept rather than the same one in another language.'
                        sanskritName:
                          type: string
                          example: vāta
                          description: The same name in the standard diacritic transliteration.
                        devanagari:
                          type: string
                          example: वात
                          description: The same name in Devanagari. Data, identical in every language.
                        alsoCalled:
                          type: array
                          items:
                            type: string
                          example:
                          - vāyu
                          - anila
                          - māruta
                          - samīraṇa
                          description: Other names the primary texts use for the same dosha. Data rather than translations, and useful when reading a verse that names one of them instead.
                        element:
                          type: string
                          example: vayu, air
                          description: The single mahabhuta the classical verses give this dosha. Classically each dosha gets one element, not a pair.
                        modernElementPair:
                          type: string
                          example: air with ether
                          description: The two-element pairing in general modern circulation. It carries no classical citation in this API, which is why it travels in its own field instead of inside the cited one.
                        qualities:
                          type: array
                          items:
                            type: string
                          example:
                          - ruksa, dry
                          - laghu, light
                          - sita, cold
                          description: The qualities the frame chapter gives this dosha, each as its Sanskrit word and its gloss. The three sets overlap, so the twenty gunas are not partitioned three ways between them.
                        qualityGunas:
                          type: array
                          items:
                            type: string
                          example:
                          - ruksha
                          - laghu
                          - khara
                          - sukshma
                          - cala
                          description: Identifiers from the twenty gunas for the qualities the guna verse names with the SAME Sanskrit word, so this joins straight to the qualities endpoint. Where the dosha chapter uses a synonym, or a word the guna verse does not carry, the entry is absent rather than mapped by resemblance.
                        seats:
                          type: array
                          items:
                            type: string
                          example:
                          - the colon
                          - the hips
                          - the thighs
                          description: Where the dosha sits, in the requested language.
                        specialSeat:
                          type: string
                          example: the colon
                          description: The seat the chapter singles out above the others.
                        seatsVariant:
                          type: string
                          example: Charaka Sutrasthana 20.8 names the bladder and the feet where this chapter names the ear and the organ of touch.
                          description: How the second primary text reads the same list. The two are recorded side by side and never merged, because the special seat of pitta genuinely differs between them.
                        functions:
                          type: array
                          items:
                            type: string
                          example:
