  /ayurveda/daily:
    get:
      operationId: getDailyAyurvedaReading
      tags:
      - Ayurveda
      summary: Daily Ayurveda reading - Dosha clock and brahma muhurta by location API
      description: 'Get one days Ayurveda reading for a place: sunrise, the brahma muhurta window, the six dosha periods cut from the actual day and night, and the season the date falls in with where each dosha stands in its yearly cycle. It composes the routine and the season routes for one location so a widget needs one call rather than two. The default conventions apply throughout and are echoed; call those two routes directly to choose a different season scheme, zodiac, hemisphere or dosha clock.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      - schema:
          type: string
          format: date
          example: '2026-06-21'
          description: Reading date in YYYY-MM-DD format. Past and future dates are both supported, for editorial scheduling and backfill. Defaults to the current day in the timezone parameter.
        required: false
        description: Reading date in YYYY-MM-DD format. Past and future dates are both supported, for editorial scheduling and backfill. Defaults to the current day in the timezone parameter.
        name: date
        in: query
      - schema:
          type: number
          minimum: -90
          maximum: 90
          example: 51.5074
          description: Latitude in decimal degrees. It sets how long the day and the night actually are, which is what the dosha periods are cut from.
        required: true
        description: Latitude in decimal degrees. It sets how long the day and the night actually are, which is what the dosha periods are cut from.
        name: latitude
        in: query
      - schema:
          type: number
          minimum: -180
          maximum: 180
          example: -0.1278
          description: Longitude in decimal degrees. It sets the clock time of sunrise at this place.
        required: true
        description: Longitude in decimal degrees. It sets the clock time of sunrise at this place.
        name: longitude
        in: query
      - schema:
          type: string
          example: Europe/London
          description: Selects which day counts as current when date is omitted, and which local day sunrise is computed for. Defaults to UTC, so the reading rolls over at 00:00 UTC. Accepts an IANA name (e.g. "Europe/London"), decimal hours (e.g. 5.5 for IST), or a fixed UTC offset (e.g. "-05:00").
        required: false
        description: Selects which day counts as current when date is omitted, and which local day sunrise is computed for. Defaults to UTC, so the reading rolls over at 00:00 UTC. Accepts an IANA name (e.g. "Europe/London"), decimal hours (e.g. 5.5 for IST), or a fixed UTC offset (e.g. "-05:00").
        name: timezone
        in: query
      responses:
        '200':
          description: The day, composed from the routine and the season.
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    example: '2026-06-21'
                    description: The date of this reading. Echoes the date requested, or the current day in the timezone parameter when it was omitted.
                  sunrise:
                    type: string
                    example: '2026-06-21T03:43:12.000Z'
                    description: Sunrise at this place, as an ISO 8601 instant in UTC.
                  sunset:
                    type: string
                    example: '2026-06-21T20:21:30.000Z'
                    description: Sunset at this place, as an ISO 8601 instant in UTC.
                  brahmaMuhurta:
                    type: object
                    properties:
                      start:
                        type: string
                        example: '2026-06-21T02:07:12.000Z'
                        description: When the window opens, 96 minutes before sunrise.
                      end:
                        type: string
                        example: '2026-06-21T02:55:12.000Z'
                        description: When the window closes, 48 minutes before sunrise.
                    required:
                    - start
                    - end
                    description: The pre-dawn window as a fixed offset from sunrise, not a share of the night.
                  doshaPeriods:
