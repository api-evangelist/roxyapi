  /ayurveda/tastes:
    get:
      operationId: listRasas
      tags:
      - Ayurveda
      summary: List the six tastes - Ayurveda rasa and dosha matrix API
      description: Return the six rasas, the tastes of Ayurveda, with the complete eighteen-cell matrix of which taste lowers and raises which dosha, in both directions. The order is the one the root verse gives, which is also the order of strength it states, and it puts bitter before pungent where most modern lists reverse them. The matrix is returned on each taste and again as a per-dosha index, so a caller can read it either way without deriving one from the other.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 6
          default: 6
          example: 6
          description: 'Maximum items to return per page. Range: 1-6, default 6.'
        required: false
        description: 'Maximum items to return per page. Range: 1-6, default 6.'
        name: limit
        in: query
      - schema:
          type: integer
          minimum: 0
          default: 0
          example: 0
          description: Number of items to skip for pagination. Default 0.
        required: false
        description: Number of items to skip for pagination. Default 0.
        name: offset
        in: query
      responses:
        '200':
          description: The six tastes and the matrix.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    example: 6
                    description: Total number of tastes, which is always six.
                  limit:
                    type: number
                    example: 6
                    description: Maximum tastes returned in this page.
                  offset:
                    type: number
                    example: 0
                    description: Number of tastes skipped before this page.
                  strengthOrder:
                    type: array
                    items:
                      type: string
                    example:
                    - madhura
                    - amla
                    - lavana
                    - tikta
                    - katu
                    - kashaya
                    description: The six in the order the verse names them, which the verse then says is the order in which they give strength, most first. The order is a claim rather than a presentation choice, so it is published separately from the page above.
                  rasas:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: madhura
                          description: The taste as a Sanskrit identifier. Never translated, so it stays safe to compare against and to key a lookup on. The six are madhura, amla, lavana, tikta, katu and kashaya.
                        sanskritName:
                          type: string
                          example: madhura
                          description: The same name in the standard diacritic transliteration.
                        devanagari:
                          type: string
                          example: मधुर
                          description: The same name in Devanagari. Data, identical in every language.
                        textForm:
                          type: string
                          example: svādu
                          description: The form the root verse itself uses, where it differs from the identifier. The verse spells the pungent taste one way and the rest of the literature spells it another, and both are carried so a reader checking the Sanskrit does not conclude a row is missing.
                        english:
                          type: string
                          example: sweet
                          description: The taste in the requested language. This is the gloss and it does translate.
                        elements:
                          type: array
                          items:
                            type: string
                          example:
                          - ap, water
                          description: The mahabhutas the taste arises from. Single-sourced, and from an edition that is not public domain, so the reference ships and the wording does not. That edition gives the sweet taste ONE element where material in general circulation gives it a pair.
                        decreases:
                          type: array
                          items:
                            type: string
                          example:
                          - vata
                          - pitta
                          description: The doshas this taste lowers, as Sanskrit identifiers. Each taste lowers exactly three across the three doshas and raises the others, which is the structure that makes the matrix complete.
                        increases:
                          type: array
                          items:
                            type: string
                          example:
                          - kapha
                          description: The doshas this taste raises, as Sanskrit identifiers.
                      required:
                      - id
                      - sanskritName
                      - devanagari
                      - textForm
                      - english
                      - elements
                      - decreases
                      - increases
                      description: One of the six tastes.
                    description: The tastes for this page, in the order the root verse names them.
                  matrix:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        decreasedBy:
                          type: array
                          items:
                            type: string
                          example:
                          - madhura
                          - amla
                          - lavana
                          description: The three tastes that lower this dosha.
                        increasedBy:
                          type: array
                          items:
                            type: string
                          example:
                          - tikta
                          - katu
                          - kashaya
                          description: The three tastes that raise it.
                      required:
                      - decreasedBy
                      - increasedBy
                      example:
                        decreasedBy:
                        - madhura
                        - amla
                        - lavana
                        increasedBy:
                        - tikta
                        - katu
                        - kashaya
                      description: 'What a caller finds under any dosha key: the three tastes that lower it and the three that raise it.'
                    example:
                      vata:
                        decreasedBy:
                        - madhura
                        - amla
                        - lavana
                        increasedBy:
                        - tikta
                        - katu
