components:
  schemas:
    AyurvedaRitucharyaRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          example: '2026-03-01'
          description: The date to resolve, in YYYY-MM-DD format. The season is read at midday UTC on this date, because a season boundary is an instant and a calendar day has to be reduced to one; on a day that carries a boundary, the half the midday falls in is the answer. Within about two months of either end of the supported span, a date whose season opens or closes outside that span answers 400.
        ritucharyaScheme:
          type: string
          enum:
          - sutrasthana-6
          - vimana-8
          default: sutrasthana-6
          example: sutrasthana-6
          description: 'Which six-season division the year is cut into. "sutrasthana-6" is the standard set of sisira, vasanta, grisma, varsa, sarad and hemanta, and is the default. "vimana-8" is the alternate division in which three seasons of extreme character alternate with three of moderate character and pravrt, the season of the first rains, replaces sisira. The alternate is not a relabelling: five of the six boundaries move, and because its verse gives no solar-month boundaries the month allocation is a RoxyAPI convention, stated in the response.'
        rituZodiac:
          type: string
          enum:
          - sayana
          - nirayana
          default: sayana
          example: sayana
          description: Which zodiac the solar-month boundaries are measured in. "sayana" is the tropical reading, which is what published almanacs use for seasons and is the default. "nirayana" is the sidereal reading in the Lahiri frame, which runs about 24 days later. The gap is the size of the ayanamsa, so near a boundary the two answer with different seasons for the same date, which is why the value is echoed in every response.
        hemisphere:
          type: string
          enum:
          - northern
          - southern
          default: northern
          example: northern
          description: 'Which half of the world the season names are stated for. Defaults to "northern", which is the half the primary text describes. It is NEVER inferred from a latitude: a silent flip would change the answer without the caller asking, and no classical text handles the southern case at all. Passing "southern" rotates the six season names by three places, following a modern almanac rather than a verse, and the response says so and states what was not rotated with them.'
      required:
      - date
    AyurvedaConstitutionRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          example: '1990-07-04'
          description: Birth date in YYYY-MM-DD format. It sets the sidereal positions the whole reading is built from, so an approximate date gives an approximate constitution.
        time:
          type: string
          format: time
          example: '10:12:00'
          description: Birth time in 24-hour HH:MM:SS format. The rising sign turns roughly every two hours and carries the heaviest weight of the three factors, so time is the input a reading is most sensitive to.
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 28.6139
          description: Birth latitude in decimal degrees. It sets the local sidereal time behind the rising sign, and it feeds the strength of each graha through the sunrise at that place.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: 77.209
          description: Birth longitude in decimal degrees. It sets the local sidereal time behind the rising sign, together with the latitude.
        timezone:
          anyOf:
          - type: number
            minimum: -14
            maximum: 14
          - type: string
          default: 5.5
          description: Timezone as an IANA name such as "Asia/Kolkata", or as decimal hours from UTC such as 5.5. An IANA name is resolved to the offset in force on the birth date, so a summer-time birth is placed correctly. Defaults to 5.5.
          example: 5.5
        ayanamsa:
          type: string
          enum:
          - kp-newcomb
          - kp-old
          - lahiri
          - raman
          - custom
          default: lahiri
          example: lahiri
          description: Sidereal frame the chart is cast in. "lahiri" is the traditional Vedic standard used by most software and is the default. "raman" sits about 1.45 degrees below it. "kp-newcomb" and "kp-old" are the two Krishnamurti Paddhati frames. "custom" takes your own value in degrees via ayanamsaValue. The frame rotates the whole zodiac, so a graha within 1.45 degrees of a boundary can change rashi when you switch, which moves both sign factors of the reading.
        ayanamsaValue:
          type: number
          example: 24
          description: Custom sidereal frame value in degrees. Required when ayanamsa is "custom" and ignored otherwise. Use it to reconcile exactly against a specific reference program.
        signDoshaScheme:
          type: string
          enum:
          - satyacharya
          - bphs
          default: satyacharya
          example: satyacharya
          description: Which classical sign table the rising sign and the Moon sign are read through. "satyacharya" is the twelve-sign extract appended to Brihat Jataka 18.20, carried in two independent public-domain translations that agree on all twelve rows, and is the default. "bphs" is the Brihat Parasara Hora Sastra rule by elemental triplicity. The two agree exactly on three signs of twelve, overlap in part on seven, and share no humour at all on Scorpio or Sagittarius, so the choice can change the reading outright and is echoed in the response.
      required:
      - date
      - time
      - latitude
      - longitude
    AyurvedaDinacharyaRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          example: '2026-06-21'
          description: The local calendar date, in YYYY-MM-DD format. Sunrise and sunset are computed for this date at the given place, and the whole routine follows from them, so the answer changes through the year at any latitude away from the equator.
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 51.5074
          description: 'Latitude in decimal degrees. It sets how long the day and the night actually are, which is the whole difference between this and a printed timetable: at 51 north in June the day runs about sixteen and a half hours and its thirds are five and a half hours each.'
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: -0.1278
          description: Longitude in decimal degrees. It sets the clock time of sunrise at this place.
        timezone:
          anyOf:
          - type: number
            minimum: -14
            maximum: 14
          - type: string
          default: 0
          description: Timezone as an IANA name such as "Europe/London", or as decimal hours from UTC such as 5.5. An IANA name is resolved to the offset in force on the requested date, and on the clock-hour grid at the local hour each block opens, so on a daylight-saving change every block keeps its printed hour and one that falls in the skipped hour moves forward past it. It decides which local day is meant and, on the clock-hour grid, where the blocks fall. Defaults to 0.
          example: Europe/London
        doshaClock:
          type: string
          enum:
          - sunrise-anchored
          - clock-hours
          default: sunrise-anchored
          example: sunrise-anchored
          description: How the six dosha periods are cut. "sunrise-anchored" divides the actual day and the actual night at this place into thirds, which is the division the frame chapter states, and is the default. "clock-hours" is the modern grid of six four-hour blocks from six in the morning; no classical text assigns clock hours, and the grid is only exact at an equinox near the equator. Both sets are returned whichever is chosen, so a caller can show one and reconcile against the other.
      required:
      - date
      - latitude
      - longitude
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your API key for accessing RoxyAPI. Alternatively, you can pass the API key as a query parameter "api_key".
