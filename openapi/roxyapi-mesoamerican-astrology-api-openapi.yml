                        - number
                        - dayOfTrecena
                        - rulingSign
                        - rulingSignName
                        description: The thirteen day period this day belongs to. The trecena is the unit a daykeeper reads a run of days in, and the sign it opens on is what gives the whole period its character.
                      reading:
                        type: object
                        properties:
                          keynote:
                            type: string
                            example: The nawal Ajaw, called AJPUʼ in the highland daykeeping tradition, is the sun at its height, the completed day and the authority that comes with finishing. The sign itself is read as lord, ruler, sun.
                            description: 'The sign in one composed sentence: its name in both naming traditions, what it is about, and the glyph reading behind it. Composed per request from the sign components rather than stored whole, which is why it stays consistent with every other reading in the response.'
                          numberReading:
                            type: string
                            example: The coefficient 4 has no character recorded for it in the sources this API is built on, so no reading is offered for the number alone. The sign carries the day.
                            description: What the coefficient contributes. Nine of the thirteen carry a recorded character, banded as gentle, indifferent or violent; the other four carry none and this field says so rather than inventing one. The band ids are the source vocabulary, so violent names the days reserved for strong ceremony and defence and is not a warning.
                          numberBand:
                            type: string
                            example: gentle
                            description: 'Machine identifier of the recorded character of the coefficient: gentle, indifferent or violent. ABSENT for coefficients 4, 5, 6 and 10, which have no recorded character in any consulted source. Always English so it stays safe to switch on.'
                          strengths:
                            type: array
                            items:
                              type: string
                            example:
                            - Finishes what was started and lets the result be seen
                            description: What the sign does well, as full sentences rather than keywords.
                          challenges:
                            type: array
                            items:
                              type: string
                            example:
                            - Needs the light on it and dims when the light moves
                            description: Where the same temperament costs the sign something. Each one is the shadow of a strength above rather than an unrelated flaw.
                          guidance:
                            type: string
                            example: Give the credit away once today. A sun that shines only on itself lights nothing.
                            description: The one thing worth doing differently under this sign.
                        required:
                        - keynote
                        - numberReading
                        - strengths
                        - challenges
                        - guidance
                        description: The composed nawal reading for the Tzolkin day.
                    required:
                    - daySign
                    - daySignName
                    - daySignClassic
                    - daySignKiche
                    - number
                    - trecena
                    - reading
                    description: 'The 260 day sacred round: the day sign, its coefficient and the trecena it falls in. This is the cycle a nawal reading is built on.'
                  haab:
                    type: object
                    properties:
                      month:
                        type: string
                        example: kankin
                        description: Machine identifier of the Haab period, always lowercase ASCII. The nineteen ids run pop, wo, sip, sotz, sek, xul, yaxkin, mol, chen, yax, sak, keh, mak, kankin, muwan, pax, kayab, kumku, wayeb.
                      monthName:
                        type: string
                        example: Kʼankʼin
                        description: Display name of the Haab period in the standard orthography. A proper noun carried as data, so it is identical under every lang.
                      monthClassic:
                        type: string
                        example: Kankin
                        description: The sixteenth century Yucatec spelling of the same period, which is the form most printed tables use.
                      day:
                        type: number
                        example: 3
                        description: Day inside the period, 0 to 19, or 0 to 4 in Wayebʼ. Day 0 is a real date and is called the seating of the period, so a Haab month has no day 20. Numbering from 1 instead is the usual way to be one day wrong on every Haab date.
                      dayOfYear:
                        type: number
                        example: 263
                        description: Day of the 365 day Haab year, 0 to 364. The Haab has no leap day at all, so it drifts against the solar year by about a day every four years and there is nothing to correct.
                      reading:
                        type: string
                        example: 'The Haab date is 3 Kʼankʼin, inside a period read this way: The yellow sun, ripening light, where the year turns toward its harvest.'
                        description: Composed reading of the Haab date, which reads differently on the seating day of a period.
                    required:
                    - month
                    - monthName
                    - monthClassic
                    - day
                    - dayOfYear
                    - reading
                    description: 'The 365 day vague year: eighteen periods of twenty days plus the five days of Wayebʼ. This is the agricultural year the Tzolkin runs against.'
                  longCount:
                    type: object
                    properties:
                      formatted:
                        type: string
                        example: 13.0.0.0.0
                        description: The dotted Long Count, most significant position first. This is the spelling every reference converter and every inscription uses.
                      baktun:
                        type: number
                        example: 13
                        description: Baktun, the highest of the five positions. One baktun is 144,000 days.
                      katun:
                        type: number
                        example: 0
                        description: Katun, 0 to 19. One katun is 7,200 days, roughly twenty years.
                      tun:
                        type: number
                        example: 0
                        description: Tun, 0 to 19. One tun is 360 days, which is why this position sits roughly a year apart.
                      winal:
                        type: number
                        example: 0
                        description: 'Winal, 0 to 17 and never 19. This is the one position that is not base twenty: eighteen winal make a tun, which is what keeps the tun near a solar year.'
                      kin:
                        type: number
                        example: 0
                        description: Kin, 0 to 19. One kin is one day.
                      daysSinceEpoch:
                        type: number
                        example: 1872000
                        description: The whole Long Count as a single integer count of days from the epoch. Subtracting two of these is the correct way to measure an interval, and it is the number the Tzolkin, the Haab and the night lord are all derived from.
                      julianDayNumber:
                        type: number
                        example: 2456283
                        description: Julian Day Number of the same day, which is the bridge between this count and any other calendar. Adding the correlation constant to daysSinceEpoch gives exactly this.
                    required:
                    - formatted
                    - baktun
                    - katun
                    - tun
                    - winal
                    - kin
                    - daysSinceEpoch
                    - julianDayNumber
                    description: The linear day count from the mythological start of the era, written in five positions. Unlike the two round calendars this one never repeats, which is what lets an inscription name an absolute date.
                  calendarRound:
                    type: string
                    example: 4 Ajaw 3 Kʼankʼin
                    description: The Tzolkin and Haab dates written together, which is how a Classic inscription names a day. The pair repeats every 18,980 days, a little under 52 years, so a Calendar Round alone is ambiguous beyond one lifetime and the Long Count is what disambiguates it.
                  lordOfNight:
                    type: object
                    properties:
                      label:
                        type: string
                        example: G9
                        description: Which of the nine Lords of the Night governs this day, G1 to G9. The cycle steps forward one per day and closes every nine.
                      reading:
                        type: string
                        example: The night belongs to G9 of the nine, a cycle that turns one step every day and closes every nine. The Maya names for the nine were never recorded, so the cycle is published by its glyph labels alone.
                        description: One line on the night lord, including why the nine carry labels rather than names.
                    required:
                    - label
                    - reading
                    description: The nine day cycle that runs beside the other three. The nine are identified and the cycle is unambiguous, but no source records what the Maya called them, so this API publishes the labels rather than borrowing names from a neighbouring culture.
                  yearBearer:
                    type: object
                    properties:
                      daySign:
                        type: string
                        example: kaban
                        description: Machine identifier of the day sign carrying the Haab year this date falls in. Only four of the twenty can ever carry a year, and which four depends on the school.
                      daySignName:
                        type: string
                        example: Kabʼan
                        description: Display name of the bearing sign. A proper noun carried as data.
                      number:
                        type: number
                        example: 5
                        description: Coefficient of the bearing day, 1 to 13. The coefficient advances by one each Haab year, which is what makes the bearer and the number together repeat only every 52 years.
                      reading:
                        type: string
                        example: The Haab year is carried by 5 Kabʼan, read at the seating of Pop. This is the Classic set, and it is the one highland daykeepers still run today.
                        description: One line on the year bearer that names the school it was read under, because the three schools name three different bearers for the same year.
                    required:
                    - daySign
                    - daySignName
                    - number
                    - reading
                    description: The Tzolkin day that names the Haab year this date falls in, under the requested school.
                  cross:
                    type: array
                    items:
                      type: object
                      properties:
                        position:
                          type: string
                          example: conception
                          description: 'Which point of the cross this is: center, conception, destiny, left or right. Always English so it stays safe to switch on. The arms are published as left and right and carry no gender, because the sources that agree on the SIGNS disagree on which arm is masculine and which feminine.'
                        offsetDays:
                          type: number
                          example: -8
                          description: Days from the birth day to this arm. Negative is before the birth day. Conception is minus eight, destiny plus eight, the left arm plus six and the right arm minus six.
                        daySign:
                          type: string
                          example: chikchan
                          description: Machine identifier of the day sign standing at this point.
                        daySignName:
                          type: string
                          example: Chikchan
                          description: Display name of the sign at this point. A proper noun carried as data.
                        daySignKiche:
                          type: string
                          example: KAN
                          description: Kʼicheʼ name of the same sign, which is the vocabulary a cross is normally read in.
                        number:
                          type: number
                          example: 9
                          description: Coefficient of the day at this point, 1 to 13.
                        reading:
                          type: string
                          example: The conception arm, eight days before the birth day, is 9 Chikchan. It is read as the root the life is drawn from.
                          description: One line on what this point of the cross is read as.
                      required:
                      - position
                      - offsetDays
                      - daySign
                      - daySignName
                      - daySignKiche
                      - number
                      - reading
                    description: 'The Cruz Maya, the five point nawal cross, with source convention. This is a LIVING DAYKEEPER PRACTICE rather than an archaeological reconstruction: no academic source describes a five point cross, and the day offsets here were measured against two independent practitioner calculators that agree. It is published because practitioners use it, and it is labelled because that is what honesty about a source looks like.'
                  summary:
                    type: string
                    example: This day is 4 Ajaw 3 Kʼankʼin, Long Count 13.0.0.0.0. The nawal is Ajaw, the sun at its height, the completed day and the authority that comes with finishing, carried on the coefficient 4.
                    description: One composed sentence placing the day in all three calendars, for a card headline or a chat reply.
                  conventions:
                    type: object
                    properties:
                      correlation:
                        type: string
                        example: gmt-584283
                        description: 'The correlation constant actually applied, whether it was requested or defaulted. Store this beside any Maya date you persist: the same civil date resolves to a different Long Count under each constant, and a date with no correlation recorded cannot be reproduced.'
                      yearBearerSystem:
                        type: string
                        example: classic
                        description: The Year Bearer school actually applied. The three schools name three different bearers for the same Haab year, so a bearer stored without this value cannot be checked against anything.
                    required:
                    - correlation
                    - yearBearerSystem
                    description: The conventions this chart was computed under, echoed so the result is self describing. Store both beside any chart you persist.
