  /mesoamerican-astrology/aztec/tonalpohualli:
    post:
      operationId: calculateTonalpohualli
      tags:
      - Mesoamerican Astrology
      summary: Aztec day sign for a date - Tonalpohualli calculator API
      description: 'Aztec calendar day sign calculator: returns the tonalpohualli day sign, its coefficient 1 to 13 and its trecena for any Gregorian date, with a composed reading. The count is anchored on the recorded day of the fall of Tenochtitlan and runs in step with the Maya count under the default constant, verified on the anchor and on two modern dates. Built for Aztec calendar apps, Mexica day sign features and AI agents answering what is my Aztec sign.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  example: '2012-12-21'
                  description: Date in YYYY-MM-DD format, in the PROLEPTIC GREGORIAN calendar, extended backwards unchanged through the 1582 reform. Years 1 to 4000 are accepted. A reference converter that switches to the Julian calendar below the reform will disagree with a date before 15 October 1582 by ten or eleven days; that is a difference of input convention rather than of arithmetic, and passing the Julian equivalent to such a tool reproduces these values exactly. A single-digit month or day is accepted and zero padded.
              required:
              - date
      responses:
        '200':
          description: The tonalpohualli day for this date.
          content:
            application/json:
              schema:
                type: object
                properties:
                  daySign:
                    type: string
                    example: coatl
                    description: Machine identifier of the tonalpohualli day sign, always lowercase ASCII Nahuatl whatever the lang parameter says, so it stays safe to compare against in code. The twenty ids run cipactli, ehecatl, calli, cuetzpalin, coatl, miquiztli, mazatl, tochtli, atl, itzcuintli, ozomahtli, malinalli, acatl, ocelotl, cuauhtli, cozcacuauhtli, ollin, tecpatl, quiahuitl, xochitl.
                  daySignName:
                    type: string
                    example: Cōātl
                    description: Display name in Nahuatl with the vowel length marks the reference tables print. A proper noun carried as data, so it is identical under every lang.
                  gloss:
                    type: string
                    example: serpent / snake
                    description: What the sign name means, translated in place because it is a common noun. Several English renderings are in circulation for some signs and all of them are given rather than one being picked.
                  direction:
                    type: string
                    example: east
                    description: 'World direction the sign belongs to: east, north, west or south. The twenty run through the four quarters in order, so the direction is a property of the position as much as of the sign.'
                  number:
                    type: number
                    example: 1
                    description: 'The tonalpohualli coefficient, 1 to 13. Structurally the same count as the Maya coefficient and read the same way: a rank it is not.'
                  trecena:
                    type: object
                    properties:
                      number:
                        type: number
                        example: 9
                        description: Which of the twenty thirteen day periods this day falls in, 1 to 20.
                      dayOfTrecena:
                        type: number
                        example: 1
                        description: Position of this day inside its trecena, 1 to 13. Always equal to the coefficient.
                      startSign:
                        type: string
                        example: coatl
                        description: Machine identifier of the day sign the trecena opens on.
                      startSignName:
                        type: string
                        example: Cōātl
                        description: Display name of the sign the trecena opens on. A proper noun carried as data.
                    required:
                    - number
                    - dayOfTrecena
                    - startSign
                    - startSignName
                    description: 'The thirteen day period this day belongs to, named by the sign it opens on. No patron deity is returned: the published patron column carries an unresolved disagreement on two of the twenty rows, and a column that is right for eighteen and guessed for two is worse than none.'
                  keynote:
                    type: string
                    example: The tonalpohualli sign Cōātl is the serpent, the charge that runs the whole length of a living thing. It is read as serpent / snake, and it belongs to the east.
                    description: The sign in one composed sentence. Composed per request from the sign components rather than stored whole.
                  guidance:
                    type: string
                    example: Move what has built up in the body before it picks its own target.
                    description: The one thing worth doing differently under this sign.
                  scope:
                    type: string
                    example: This count returns the day sign, its coefficient and its trecena. The night lord and the solar year are not returned, because the sources consulted for them do not agree closely enough to publish.
                    description: A plain statement of what this family covers and what it deliberately leaves out. Present on every response so nobody has to guess whether a missing field is an outage or a decision.
                  date:
                    type: string
                    example: '1521-08-23'
                    description: Echo of the date the day was resolved from, in proleptic Gregorian.
                  conventions:
                    type: object
                    properties:
                      correlation:
                        type: string
                        example: caso
                        description: 'The correlation this count runs on, anchored on the recorded day 1 Coatl at the fall of Tenochtitlan, 13 August 1521 in the Julian calendar and 23 August 1521 in the proleptic Gregorian calendar this API takes. It is echoed rather than requested because it is not a switch: the anchor is a civil date, so no correlation constant enters the arithmetic, and the published alternatives for this calendar move the solar year alignment rather than the day count. The count was verified to run in step with the Maya count under the default constant, on the anchor and on two modern dates.'
                    required:
                    - correlation
                    description: The conventions this answer was computed under, echoed so the result is self describing.
                required:
                - daySign
                - daySignName
                - gloss
                - direction
                - number
                - trecena
                - keynote
                - guidance
                - scope
                - date
                - conventions
