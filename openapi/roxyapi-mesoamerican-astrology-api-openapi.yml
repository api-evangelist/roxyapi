                        description: Machine identifier of the Tzolkin day sign, always lowercase ASCII Yucatec whatever the lang parameter says, so it stays safe to compare against in code. The twenty ids run imix, ik, akbal, kan, chikchan, kimi, manik, lamat, muluk, ok, chuwen, eb, ben, ix, men, kib, kaban, etznab, kawak, ajaw.
                      daySignName:
                        type: string
                        example: Ajaw
                        description: Display name of the day sign in the standard Maya orthography, where the ejective is written with a modifier letter rather than a typewriter quote. A proper noun carried as data, so it is identical under every lang.
                      daySignClassic:
                        type: string
                        example: Ahau
                        description: The sixteenth century Yucatec spelling of the same sign, which is the form most printed reference tables and older sources use. Useful for matching a name a reader copied out of a book.
                      daySignKiche:
                        type: string
                        example: AJPUʼ
                        description: The Kʼicheʼ name of the same day from the living highland daykeeping tradition, which is the vocabulary a nawal reading in Guatemala uses. A parallel naming tradition rather than a translation, so it is identical under every lang.
                      number:
                        type: number
                        example: 4
                        description: The Tzolkin coefficient, 1 to 13. This is the classical day number that runs alongside the twenty signs; it is not a rank and a 13 is not better than a 1. Nine of the thirteen carry a recorded character, which is returned separately.
                      trecena:
                        type: object
                        properties:
                          number:
                            type: number
                            example: 20
                            description: Which of the twenty thirteen day periods this day falls in, 1 to 20. Trecena 1 opens on 1 Imix.
                          dayOfTrecena:
                            type: number
                            example: 4
                            description: Position of this day inside its trecena, 1 to 13. Always equal to the coefficient, because a trecena is exactly one run of the coefficient.
                          rulingSign:
                            type: string
                            example: kawak
                            description: Machine identifier of the day sign the trecena opens on, which the tradition reads as colouring all thirteen of its days.
                          rulingSignName:
                            type: string
                            example: Kawak
                            description: Display name of the sign the trecena opens on. A proper noun carried as data.
                        required:
                        - number
                        - dayOfTrecena
                        - rulingSign
                        - rulingSignName
                        description: The thirteen day period this day belongs to. The trecena is the unit a daykeeper reads a run of days in, and the sign it opens on is what gives the whole period its character.
                      date:
                        type: string
                        example: '1988-03-02'
                        description: Echo of the second birth date.
                    required:
                    - daySign
                    - daySignName
                    - daySignClassic
                    - daySignKiche
                    - number
                    - trecena
                    - date
                    description: The Tzolkin day the second person was born on.
                  daysApart:
                    type: number
                    example: 47
                    description: How far apart the two days sit in the 260 day round, taken the short way round, so the value never exceeds 130. Two people on the same nawal are 0 apart.
                  components:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: same-trecena
                          description: 'Which tie this row reports: same-sign, same-trecena, same-number, cross-partner or shared-direction. Always English so it stays safe to switch on.'
                        holds:
                          type: boolean
                          example: true
                          description: Whether this tie holds for the pair. Every component is returned whether it holds or not, so a caller can render the misses as well as the hits.
                        weight:
                          type: number
                          example: 20
                          description: Points this tie contributes to the score when it holds, and nothing when it does not. The weights are published rather than hidden precisely because the weighting is ours rather than traditional.
                        reading:
                          type: string
                          example: Both days fall inside the same trecena, so the two lives are coloured by one ruling sign.
                          description: One line on what this tie means. Present ONLY when the tie holds, so a caller can render the hits without filtering and a miss carries no sentence to explain away.
                      required:
                      - id
                      - holds
                      - weight
                    description: The five structural ties, in a fixed order, each either holding or not. Every one of them is a property of the count itself or of the measured daykeeper cross convention; what is ours is only the decision to weigh them together.
                  score:
                    type: number
                    example: 65
                    description: A RoxyAPI COMPOSITE, not a traditional rating. No classical source rates a pair of Tzolkin days, so this number is a floor of 45 plus the weight of every tie that holds, capped at 100. The components above are what is sourced; this is what we built out of them, and it is labelled so that nobody cites it as tradition.
                  verdict:
                    type: string
                    example: workable
                    description: 'Coarse band the composite score falls in: excellent, strong, workable or reserved. Built for badges and filters that should not hard code a threshold against a number whose weighting may be tuned.'
                  summary:
                    type: string
                    example: The pair sets Lamat against Ajaw, 47 days apart in the 260 day count.
                    description: One composed sentence naming both nawals and the distance between them, for a headline above the component list. When no tie holds at all it says so, because that is the common case and a blank component list is not self explanatory.
                  conventions:
                    type: object
                    properties:
                      correlation:
                        type: string
                        example: gmt-584283
                        description: 'The correlation constant actually applied, whether it was requested or defaulted. Store this beside any Maya date you persist: the same civil date resolves to a different Long Count under each constant, and a date with no correlation recorded cannot be reproduced.'
                      directionScheme:
                        type: string
                        example: madrid-codex
                        description: The direction reading actually applied. The two readings sit one quarter turn apart, so a direction stored without this value is ambiguous.
                    required:
                    - correlation
                    - directionScheme
                    description: The conventions this comparison was computed under. The direction scheme is echoed because one of the five ties is read off the world directions, which the two schemes assign differently.
