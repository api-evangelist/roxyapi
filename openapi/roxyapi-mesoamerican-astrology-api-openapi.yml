  /mesoamerican-astrology/mayan/long-count/convert:
    post:
      operationId: convertLongCount
      tags:
      - Mesoamerican Astrology
      summary: Convert a Maya Long Count - Long Count calendar converter API
      description: 'Maya Long Count converter that runs both ways: give it a Gregorian date and it returns the Long Count, give it a dotted Long Count and it returns the date. Every answer carries the Julian Day Number, the elapsed day count and the Calendar Round, and the correlation constant is a typed parameter so a value can be matched against any published inscription reading. Built for epigraphy tools, museum and education apps, and anything that has to place a Maya date on a civil calendar.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  example: '2012-12-21'
                  description: Proleptic Gregorian date to convert INTO a Long Count. Supply this or longCount, never both and never neither.
                longCount:
                  type: string
                  maxLength: 32
                  example: 13.0.0.0.0
                  description: Dotted Long Count to convert INTO a date, written baktun.katun.tun.winal.kin. Each position is bounded by its own base, and the winal counts to 17 rather than to 19 because eighteen winal make a tun, so 9.12.11.18.0 is rejected as a date that does not exist. Supply this or date, never both and never neither.
                correlation:
                  type: string
                  enum:
                  - gmt-584283
                  - martinez-hernandez-584281
                  - astronomical-584285
                  - martin-skidmore-584286
                  default: gmt-584283
                  example: gmt-584283
                  description: 'Which correlation constant ties the day count to a civil date. This is the single choice that shifts every value in the response, so it is a parameter rather than a hidden default, and the resolved value comes back under conventions. "gmt-584283" is the commonly accepted constant and the default, and it is the one the major institutional converter runs on. "martinez-hernandez-584281" sits two days earlier, "astronomical-584285" two days later, and "martin-skidmore-584286" three days later, each shifting the Long Count by exactly its difference in days. Four of the eight published constants are offered: the other four sit tens of thousands of days away and are of historical interest only. The 584281 constant is the Martínez Hernández correlation, after Juan Martínez Hernández.'
              example:
                date: '2012-12-21'
              description: What to convert, and under which correlation. Exactly one of date and longCount is present, which is why the whole body carries one example rather than leaving the per field ones to be read together.
      responses:
        '200':
          description: The converted date.
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    example: '2012-12-21'
                    description: The proleptic Gregorian date, echoed when it was the input and computed when the Long Count was.
                  longCount:
                    type: string
                    example: 13.0.0.0.0
                    description: The dotted Long Count, echoed when it was the input and computed when the date was.
                  daysSinceEpoch:
                    type: number
                    example: 1872000
                    description: The Long Count as one integer count of days from the epoch. Subtracting two of these is the correct way to measure an interval between two Maya dates.
                  julianDayNumber:
                    type: number
                    example: 2456283
                    description: Julian Day Number of the same day, which is the bridge to any other calendar. It is exactly daysSinceEpoch plus the correlation constant.
                  calendarRound:
                    type: string
                    example: 4 Ajaw 3 Kʼankʼin
                    description: The Tzolkin and Haab dates written together, which is how an inscription names a day. The pair repeats every 18,980 days, so it is ambiguous beyond about 52 years and the Long Count is what fixes it.
                  lordOfNight:
                    type: string
                    example: G9
                    description: Which of the nine Lords of the Night governs the day, G1 to G9. The nine carry glyph labels rather than names because no source records what the Maya called them.
                  note:
                    type: string
                    example: This date precedes the Gregorian reform of 15 October 1582. Dates are read as proleptic Gregorian throughout, so a converter that switches to the Julian calendar below the reform will disagree by ten or eleven days on the same input.
                    description: Present ONLY for a date before the Gregorian reform, where the input convention is the usual reason two converters disagree. Absent otherwise, so its presence is itself the signal.
                  conventions:
                    type: object
                    properties:
                      correlation:
                        type: string
                        example: gmt-584283
                        description: 'The correlation constant actually applied, whether it was requested or defaulted. Store this beside any Maya date you persist: the same civil date resolves to a different Long Count under each constant, and a date with no correlation recorded cannot be reproduced.'
                    required:
                    - correlation
                    description: The conventions this conversion was computed under, echoed so the result is self describing.
                required:
                - date
                - longCount
                - daysSinceEpoch
                - julianDayNumber
                - calendarRound
                - lordOfNight
                - conventions
        '400':
          description: Validation error. `issues[]` lists every failed field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: First issue summary.
