  /angel-numbers/lookup:
    get:
      operationId: analyzeNumberSequence
      tags:
      - Angel Numbers
      summary: Analyze Any Number Sequence
      description: Smart angel number analysis that works for ANY number sequence, not just known angel numbers. Automatically classifies the pattern type (repeating, sequential, mirror, master, root, compound), calculates the numerology digit root, checks the database for a known meaning, and provides the foundational digit root interpretation (with full spiritual, love, career, money, and twin flame guidance) as a fallback. An optional context parameter adds a note tailored to where the number was seen. Perfect for synchronicity tracking apps where users enter arbitrary number sequences they encounter.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      - schema:
          type: string
          pattern: ^\d{1,8}$
          example: '1234'
          description: 'Number sequence to analyze (1-8 digits). Can be any number the user has encountered: clock times (1111), addresses (717), receipts (888), license plates (4444), or any repeating pattern.'
        required: true
        description: 'Number sequence to analyze (1-8 digits). Can be any number the user has encountered: clock times (1111), addresses (717), receipts (888), license plates (4444), or any repeating pattern.'
        name: number
        in: query
      - schema:
          type: string
          enum:
          - clock
          - receipt
          - license-plate
          - phone
          - address
          - price
          example: clock
          description: 'Where the number was seen. When supplied, the response adds a contextNote tailoring the reading to the sighting: clock (a glanced time), receipt (a purchase), license-plate (in transit), phone (a call or notification), address (a home or place), price (a total or amount).'
        required: false
        description: 'Where the number was seen. When supplied, the response adds a contextNote tailoring the reading to the sighting: clock (a glanced time), receipt (a purchase), license-plate (in transit), phone (a call or notification), address (a home or place), price (a total or amount).'
        name: context
        in: query
      responses:
        '200':
          description: Complete analysis of the number sequence with pattern classification and meaning
          content:
            application/json:
              schema:
                type: object
                properties:
                  number:
                    type: string
                    example: '1234'
                    description: The number sequence that was analyzed.
                  type:
                    type: string
                    example: sequential
                    description: Pattern classification detected for this number. "repeating" means all same digits. "sequential" means consecutive ascending or descending. "mirror" means palindrome or alternating pattern. "master" means numerology master number. "root" means single digit. "compound" means a multi-digit sequence with no pure pattern (e.g. 911, 1122).
                  digitRoot:
                    type: number
                    example: 1
                    description: Numerology digit root from summing and reducing all digits. Links to foundational single-digit meaning. Master numbers 11, 22, 33 are preserved.
                  digits:
                    type: number
                    example: 4
                    description: Total number of digits in the sequence.
                  uniqueDigits:
                    type: number
                    example: 4
                    description: Count of unique digits. A repeating number like 111 has 1 unique digit; 1234 has 4.
                  isPalindrome:
                    type: boolean
                    example: false
                    description: Whether the number reads the same forwards and backwards (e.g., 1221, 1001).
                  isRepeating:
                    type: boolean
                    example: false
                    description: Whether all digits are identical (e.g., 111, 4444, 777).
                  knownMeaning:
                    type:
                    - object
                    - 'null'
                    properties:
                      title:
                        type: string
                        example: Sequential Progress and Life Simplification
                        description: Title of the matched angel number meaning.
                      coreMessage:
                        type: string
                        example: One step at a time. Simplify your life. Progress is happening in perfect order.
                        description: Core message summary.
                      energy:
                        type: string
                        example: positive
                        description: Energy classification (positive, neutral, cautionary).
                      keywords:
                        type: array
                        items:
                          type: string
                        example:
                        - progress
                        - simplification
                        - step by step
                        - natural order
                        - patience
                        description: Keywords for this angel number.
                      meaning:
                        type: object
                        properties:
                          spiritual:
                            type: string
                            example: Angel number 1234 is a sequential number that carries a message of simplification and steady progress. Just as the numbers naturally progress from 1 to 4, your life is unfolding in a logical, step-by-step manner.
                            description: Spiritual interpretation covering divine guidance, higher purpose, and metaphysical significance.
                          love:
                            type: string
                            example: In love, 1234 encourages you to let relationships develop naturally and organically. Do not rush commitment or force milestones. Each stage of the relationship has its purpose.
                            description: Love and relationship interpretation for singles, couples, and those healing from past relationships.
                          career:
                            type: string
                            example: Professionally, 1234 encourages a methodical, step-by-step approach to career advancement. Break large goals into smaller, manageable steps and complete them one at a time.
                            description: Career and vocation guidance. Money and finances are returned separately in the money field.
                          money:
                            type: string
                            example: 'In money matters, 1234 is the most orderly of sequences: build your finances one step at a time. It favors simplifying, putting things in order, and progressing methodically, a budget, then debts, then savings, then growth, rather than reaching for everything at once.'
                            description: Money, finances, and material abundance guidance, distinct from career.
                          twinFlame:
                            type: string
                            example: For twin flames, 1234 indicates that your journey is progressing in natural, divine order. Each phase of separation, growth, and reunion has its purpose. Do not try to skip ahead or force the timeline.
                            description: Twin flame connection interpretation covering union, separation, and spiritual growth.
                        required:
                        - spiritual
                        - love
                        - career
                        - money
                        - twinFlame
                        description: Detailed interpretations across life areas.
                      biblical:
                        type: string
                        example: The ascending run 1234 has no standing as a number in biblical numerology, though its individual digits carry meaning, one as unity and beginnings, two as witness, three as divine completeness, four as creation and earthly order.
                        description: Biblical and religious perspective, framed honestly.
                      shadow:
                        type: string
                        example: The shadow side of 1234 is the urge to skip steps. The momentum of forward progress can tempt you to rush ahead, leave foundations half-built, or chase the finish before the groundwork is sound.
