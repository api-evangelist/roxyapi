  /angel-numbers/daily:
    post:
      operationId: getDailyAngelNumber
      tags:
      - Angel Numbers
      summary: Daily Angel Number
      description: Get the angel number of the day with full meaning and interpretation. Returns a deterministic angel number based on the current date (or a provided seed date), ensuring all users see the same number for any given day. Includes complete spiritual, love, career, money, and twin flame interpretations plus a biblical perspective and a shadow reading. Perfect for daily guidance features, push notifications, content generation, and angel number widget integrations.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seed:
                  type: string
                  example: user123
                  description: Optional seed for reproducible readings. Same seed + same date = same angel number every time. Pass any unique identifier (userId, email hash, session token). Omit for anonymous daily readings.
                date:
                  type: string
                  format: date
                  example: '2026-03-06'
                  description: Date for the reading in YYYY-MM-DD format. Defaults to today (UTC). Useful for viewing past daily readings or pre-generating future ones.
      responses:
        '200':
          description: Daily angel number with complete interpretation
          content:
            application/json:
              schema:
                type: object
                properties:
                  date:
                    type: string
                    example: '2026-03-05'
                    description: The date used for angel number selection (UTC).
                  seed:
                    type: string
                    example: user123-2026-03-05
                    description: Computed seed used for this reading. Same seed always produces the same angel number.
                  number:
                    type: string
                    example: '444'
                    description: Angel number sequence selected for today. Three or more digit repeating, sequential, or mirror pattern (e.g., 111, 444, 1212).
                  title:
                    type: string
                    example: Angelic Protection, Solid Foundations, and the Signal to Keep Going
                    description: Short descriptive title capturing the core theme and spiritual significance of the daily angel number.
                  coreMessage:
                    type: string
                    example: You are protected and supported. Keep building on the foundations you have laid, because steady effort is moving you toward solid ground.
                    description: One to two sentence summary of the divine message for today. Ideal for push notifications, daily guidance widgets, and quick reference.
                  type:
                    type: string
                    example: repeating
                    description: Pattern classification of the daily angel number. "repeating" means all digits are the same (111, 4444). "sequential" means consecutive digits (1234). "mirror" means palindrome or alternating pattern (1212, 1221).
                  digitRoot:
                    type: number
                    example: 3
                    description: Numerology digit root calculated by summing all digits and reducing to a single digit. Links the daily angel number to its foundational numerology meaning.
                  energy:
                    type: string
                    example: positive
                    description: Overall energy classification. "positive" indicates encouraging, uplifting energy. "neutral" indicates transitional energy. "cautionary" indicates a gentle warning to rebalance or pay attention.
                  meaning:
                    type: object
                    properties:
                      spiritual:
                        type: string
                        example: Among the angel numbers, 444 is the one most closely associated with the presence of angels themselves. It is a sign of being supported and watched over, particularly during a stretch that has tested your sense of security.
                        description: Two to three paragraph spiritual interpretation covering divine guidance, higher purpose, and the metaphysical significance of the angel number selected for this date.
                      love:
                        type: string
                        example: In love, 444 points to foundations rather than fireworks. It favors trust, honesty, loyalty, and consistency, the quiet structural elements that let a relationship last.
                        description: Love and relationship interpretation covering singles, couples, and those healing from past relationships. Includes romantic guidance and partnership advice.
                      career:
                        type: string
                        example: Professionally, 444 reads as permission to move forward from a base you have already built. Progress here comes from consistency and attention to detail rather than dramatic leaps.
                        description: 'Career and vocation guidance: professional opportunities, calling, and practical work advice. Money and finances are returned separately in the money field.'
                      money:
                        type: string
                        example: In money matters, 444 speaks to stability that is built rather than wished for. It signals that financial security is within reach, but reached through patience, discipline, and sound decisions rather than a sudden windfall.
                        description: Money, finances, and material abundance guidance, kept distinct from career and vocation.
                      twinFlame:
                        type: string
                        example: For twin flames, 444 indicates support around the connection, even through a phase of separation. It suggests that both people are being guided toward the stability a lasting union requires, which makes the real work individual.
                        description: Twin flame connection interpretation covering union, separation, and spiritual growth within the twin flame journey.
                    required:
                    - spiritual
                    - love
                    - career
                    - money
                    - twinFlame
                    description: Detailed interpretations across life areas for the daily angel number.
                  biblical:
                    type: string
                    example: 'In the Bible the number 4 is tied to creation and earthly order: the fourth day, when the sun, moon, and stars were set in place, and figures such as the four corners of the earth and the four winds. Angel numbers as personal codes are not a biblical concept, and Scripture does not single out 444.'
                    description: Biblical and religious perspective on the daily sequence, framed honestly.
                  shadow:
                    type: string
                    example: The shadow side of 444 is structure turned rigid. The same drive that builds stability can harden into stubbornness, resistance to change, or a refusal to let chance and spontaneity in.
                    description: Shadow or cautionary reading for the daily sequence. Complements the energy classification.
                  keywords:
                    type: array
                    items:
                      type: string
                    example:
                    - protection
                    - foundation
                    - stability
                    - discipline
                    - reassurance
                    - angelic support
                    - perseverance
                    description: Five to eight keywords capturing the spiritual themes and energy of the daily angel number. Useful for search, filtering, and content generation.
                  affirmation:
                    type: string
                    example: I am supported and protected, and the foundations I am building will hold.
                    description: Positive affirmation aligned with the daily angel number. Use for daily affirmation features, meditation guidance, or spiritual journal prompts.
                  actionSteps:
                    type: array
                    items:
                      type: string
                    example:
                    - Trust that you are supported, and keep building rather than restarting
                    - Strengthen one practical foundation this week, whether finances, health, or home
                    - Address an unstable situation directly instead of working around it
                    description: Three to five specific, actionable steps to take today based on the angel number guidance. Practical spiritual advice for daily life.
                required:
                - date
                - seed
                - number
                - title
                - coreMessage
                - type
                - digitRoot
                - energy
                - meaning
                - biblical
                - shadow
                - keywords
                - affirmation
                - actionSteps
