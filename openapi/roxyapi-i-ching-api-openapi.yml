components:
  schemas:
    BasicTrigram:
      type: object
      properties:
        number:
          type: number
          example: 1
          description: Trigram number (1-8)
        symbol:
          type: string
          example: ☰
          description: Unicode trigram symbol
        chinese:
          type: string
          example: 乾
          description: Chinese name
        english:
          type: string
          example: Heaven
          description: English name
        pinyin:
          type: string
          example: Qián
          description: Pinyin romanization
        binary:
          type: string
          example: '111'
          description: Binary representation (1=Yang solid, 0=Yin broken)
        attribute:
          type: string
          example: Creative
          description: Core attribute/quality
      required:
      - number
      - symbol
      - chinese
      - english
      - pinyin
      - binary
      - attribute
    ChangingLine:
      type: object
      properties:
        position:
          type: number
          example: 1
          description: Line position (1-6, bottom to top). In I-Ching, each hexagram has six lines (yao) read from bottom upward.
        text:
          type: string
          example: The dragon is still hidden below the surface, so it does not act.
          description: The oracle statement for this line. It applies when this specific line comes up changing (old yin or old yang) in a casting, and it speaks in the concrete imagery of the tradition.
        meaning:
          type: string
          example: The first line is the beginning, still underground and unrecognized. Strength is present but untested, and showing it now invites resistance it cannot yet survive. Stay hidden and build.
          description: What the line statement asks of the querent, read from its position in the hexagram (1 is the hidden beginning, 3 is the exposed threshold, 5 is the ruling line, 6 is past the peak) and from whether the line is yin or yang. This is the meaning behind the image, so a consuming agent does not have to invent one.
      required:
      - position
      - text
    Trigram:
      type: object
      properties:
        number:
          type: number
          example: 1
          description: 'Stable identifier for the trigram, 1 to 8. This is our lookup key, not a canonical sequence: the tradition has several orderings (King Wen, Fu Xi, Earlier and Later Heaven) and they disagree, so do not read ranking or precedence into it.'
        symbol:
          type: string
          example: ☰
          description: Unicode trigram symbol (three lines) for visual display in I-Ching interfaces and Bagua diagrams.
        chinese:
          type: string
          example: 乾
          description: Original Chinese character name of the trigram in traditional script.
        english:
          type: string
          example: Heaven
          description: English name representing the natural force or element this trigram embodies.
        pinyin:
          type: string
          example: Qián
          description: Pinyin romanization of the Chinese name with tone marks for correct pronunciation.
        binary:
          type: string
          example: '111'
          description: Three-digit binary representation of the trigram lines (bottom to top). 1 = yang (solid), 0 = yin (broken).
        element:
          type: string
          example: Metal
          description: 'Five element (Wu Xing) correspondence: Metal, Wood, Water, Fire, or Earth. Used in Chinese metaphysics and feng shui analysis.'
        attribute:
          type: string
          example: Creative
          description: Core attribute or quality this trigram represents in I-Ching philosophy (e.g., Creative, Receptive, Arousing).
        familyMember:
          type: string
          example: Father
          description: Family archetype in the Bagua system. Each trigram corresponds to a family role (Father, Mother, First Son, First Daughter, etc.).
        direction:
          type: string
          example: Northwest
          description: Compass direction in the King Wen (Later Heaven) Bagua arrangement. Used in feng shui spatial analysis.
        bodyPart:
          type: string
          example: Head
          description: Body part associated with this trigram in traditional Chinese medicine and I-Ching body mapping.
        animal:
          type: string
          example: Horse
          description: Animal symbol associated with this trigram in classical I-Ching imagery and divination.
        season:
          type: string
          example: Late Autumn
          description: Season or time period associated with this trigram in the annual cycle of Chinese cosmology.
        quality:
          type: string
          example: Strong
          description: Energetic quality describing the dynamic nature of this trigram (e.g., Strong, Devoted, Joyous, Gentle).
        meaning:
          type: string
          example: The Creative force representing pure yang energy, strength, leadership, and the power of initiative.
          description: Concise interpretation of the trigram covering its symbolic meaning, key associations, and guidance for understanding hexagrams containing this trigram.
      required:
      - number
      - symbol
      - chinese
      - english
      - pinyin
      - binary
      - element
      - attribute
      - familyMember
      - direction
      - bodyPart
      - animal
      - season
      - quality
      - meaning
    Hexagram:
      type: object
      properties:
        number:
          type: number
          example: 1
          description: Hexagram number in the traditional King Wen sequence (1-64), the standard ordering used in I-Ching divination for over 3,000 years.
        symbol:
          type: string
          example: ䷀
          description: Unicode hexagram symbol (U+4DC0 block) representing all six lines. Use for visual display in I-Ching apps and divination interfaces.
        chinese:
          type: string
          example: 乾
          description: Original Chinese character name of the hexagram in traditional script.
        english:
          type: string
          example: The Creative
          description: English translation of the hexagram name, conveying the core concept and life situation it represents.
        pinyin:
          type: string
          example: Qián
          description: Pinyin romanization of the Chinese name with tone marks for correct pronunciation.
        binary:
          type: string
          example: '111111'
          description: Binary line pattern (6 digits, bottom to top). 1 = yang (solid line), 0 = yin (broken line). Lines 1-3 form the lower trigram, lines 4-6 form the upper trigram.
        upperTrigram:
          type: string
          example: Heaven
          description: 'Upper trigram (lines 4-6). One of 8 trigrams: Heaven, Earth, Thunder, Wind, Water, Fire, Mountain, Lake.'
        lowerTrigram:
          type: string
          example: Heaven
          description: Lower trigram (lines 1-3). Combines with the upper trigram to form the hexagram and its meaning.
        judgment:
          type: string
          example: Pure creative force is available and it runs from origin to completion without obstruction, so the situation rewards initiative that stays correct and does not slacken. Success here is built by sustained effort held to a straight line, not by a single burst.
          description: The Judgment (Tuan) text, the primary oracle statement of the hexagram offering core guidance and outcome.
        image:
          type: string
          example: 'Heaven above heaven: the same motion repeated without pause and without fatigue. Renew your own strength on your own schedule rather than waiting to be driven by circumstances.'
          description: The Image (Xiang) text, symbolic guidance derived from the trigram combination describing the ideal attitude and action.
        interpretation:
          $ref: '#/components/schemas/Interpretation'
        changingLines:
          type: array
          items:
            $ref: '#/components/schemas/ChangingLine'
          description: Changing line interpretations for all 6 lines
      required:
      - number
      - symbol
      - chinese
      - english
      - pinyin
      - binary
      - upperTrigram
      - lowerTrigram
      - judgment
      - image
      - interpretation
      - changingLines
    Interpretation:
      type: object
      properties:
        general:
          type: string
          example: This hexagram represents the primal power of creation and the energy of pure initiative.
          description: General life situation interpretation of this hexagram.
        love:
          type: string
          example: A time of strong attraction and passionate connection. Take the initiative in expressing your feelings.
          description: Love and relationship guidance from this hexagram.
        career:
          type: string
          example: Exceptional opportunities for advancement and recognition. Your creative ideas are at their peak.
          description: Career and professional life interpretation.
        decision:
          type: string
          example: The time is right for bold action. Trust your instincts and move forward with confidence.
          description: Decision-making guidance for whether to act, wait, retreat, or advance based on this hexagram.
        advice:
          type: string
          example: 'Be like the heavens: consistent, powerful, and untiring. Make yourself strong through steady effort.'
          description: Practical wisdom and actionable advice from this hexagram for daily life application.
      required:
      - general
      - love
      - career
      - decision
      - advice
    BasicHexagram:
      type: object
      properties:
        number:
          type: number
          example: 1
          description: Hexagram number in King Wen sequence (1-64).
        symbol:
          type: string
          example: ䷀
          description: Unicode hexagram symbol for display.
        chinese:
          type: string
          example: 乾
          description: Original Chinese name of the hexagram.
        english:
          type: string
          example: The Creative
          description: English translation of the hexagram name.
        pinyin:
          type: string
          example: Qián
          description: Pinyin romanization of the Chinese name with tone marks.
        upperTrigram:
          type: string
          example: Heaven
          description: 'Upper trigram (lines 4-6). One of 8 trigrams: Heaven, Earth, Thunder, Wind, Water, Fire, Mountain, Lake.'
        lowerTrigram:
          type: string
          example: Heaven
          description: Lower trigram (lines 1-3). Combines with upper trigram to form the hexagram.
      required:
      - number
      - symbol
      - chinese
      - english
      - pinyin
      - upperTrigram
      - lowerTrigram
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your API key for accessing RoxyAPI. Alternatively, you can pass the API key as a query parameter "api_key".
