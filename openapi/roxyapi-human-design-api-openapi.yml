                          example: Choque
                          description: Gate keynote name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        ichingHexagram:
                          type: object
                          properties:
                            number:
                              type: number
                              example: 51
                              description: I-Ching hexagram number, identical to the gate number it corresponds to.
                            english:
                              type: string
                              example: The Arousing
                              description: English name of the corresponding I-Ching hexagram.
                          required:
