                          description: The gland, organ, or system this center corresponds to in the body.
                        gates:
                          type: array
                          items:
                            type: number
                          example:
                          - 5
                          - 14
                          - 34
                          description: Active gate numbers that sit in this center.
                      required:
                      - id
                      - name
                      - defined
                      - motor
                      - awareness
                      - theme
                      - notSelfQuestion
                      - biology
                      - gates
                    description: All nine centers with their defined state and active gates.
                  definedCount:
