  /human-design/variables:
    post:
      operationId: calculateVariables
      tags:
      - Human Design
      summary: Calculate Human Design Variables - The four arrows and Color, Tone, Base…
      description: 'Calculate the four Human Design Variable arrows for a birth moment: Determination and Environment on the design side, Perspective and Motivation on the personality side. Each arrow returns its Color, Tone, and Base numbers from the hexagram-line substructure, the left or right direction set by the Tone, and the sourced Color and direction labels. This is the advanced Rave Variables and Primary Health System layer beneath Type, Strategy, Authority, and Profile. Color, Tone, and Base shift with tiny differences in birth time, so each arrow carries a confidence flag that turns false near a Color or Tone boundary, and a precise birth time is essential. Built for Human Design apps offering PHS, diet, environment, and Rave Psychology readings.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  example: '1990-07-15'
                  description: Birth date in YYYY-MM-DD format. The anchor for both the Personality activations at birth and the Design activations 88 degrees of solar arc earlier.
                time:
                  type: string
                  format: time
                  example: '13:00:00'
                  description: 'Birth time in 24-hour HH:MM:SS format. Precision matters: the profile lines and gate boundaries shift with the exact minute of birth.'
                timezone:
                  anyOf:
                  - type: number
                    minimum: -14
                    maximum: 14
                  - type: string
                  description: 'IANA name (e.g. "America/New_York", "Europe/London", "UTC"), decimal hours (e.g. -5 for EST, 1 for CET), or a fixed UTC offset (e.g. "-05:00", "+01:00"). Prefer the IANA name: it is resolved to the DST-correct offset for the birth date, while a fixed offset or decimal is taken literally and will be wrong if it does not match the daylight-saving state on that date. Invalid timezones return 400 with a validation error.'
                  example: America/New_York
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  default: 0
                  example: 0
                  description: Birth latitude in decimal degrees. Optional and does not affect the bodygraph, which depends only on ecliptic longitudes. Defaults to 0.
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  default: 0
                  example: 0
                  description: Birth longitude in decimal degrees. Optional and does not affect the bodygraph. Defaults to 0.
                nodeType:
                  type: string
                  enum:
                  - mean
                  - 'true'
                  default: 'true'
                  example: 'true'
                  description: 'Lunar node convention. "mean" is the smoothed average node, which always moves retrograde; "true" is the osculating node, which tracks the real perturbed node, oscillates up to about 1.5 degrees either side of the mean on a 173-day cycle, and can briefly turn direct. Neither is more correct and they almost always fall in the same sign. Applies to the North and South Node activations. True is what professional Human Design software uses (HumanDesign.ai, Total Human Design) and is the value RoxyAPI verifies against, so leave it unset for a standard chart. It matters only when a node sits on a gate boundary, where the choice moves a node gate. Because a gate can be half of a channel, that can change the completed channels and, with them, whether a center reads defined or open, plus the definition, authority, profile or type. A chart where only one center disagrees is the usual shape, since the type and profile often survive unchanged. If another calculator disagrees on any of those, it is almost certainly using the mean node: pass "mean" to match it. Defaults to "true".'
              required:
              - date
              - time
              - timezone
      responses:
        '200':
          description: The four Variable arrows with substructure numbers, labels, and confidence flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  arrows:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          example: determination
                          description: Stable arrow identifier. One of determination, environment, perspective, motivation.
                        name:
                          type: string
                          example: Determination
                          description: Arrow name. Determination is the top-left arrow governing the Primary Health System and digestion, Environment the bottom-left arrow, Perspective the bottom-right arrow also called View, and Motivation the top-right arrow. Always English, whatever the lang parameter says. Use nameLocalized for anything a reader sees.
                        nameLocalized:
                          type: string
                          example: Determinación
                          description: Arrow name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        layer:
                          type: string
                          example: Primary Health System
                          description: Which half of the advanced layer the arrow belongs to. Primary Health System covers the body-side Determination and Environment arrows, Rave Psychology covers the mind-side Perspective and Motivation arrows. Always English, whatever the lang parameter says, so it stays safe to compare against in code. Use layerLocalized for anything a reader sees.
                        layerLocalized:
                          type: string
                          example: Sistema de Salud Primario
                          description: Layer name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        position:
                          type: string
                          example: Top left
                          description: Position of the arrow at the head of the bodygraph. One of Top left, Bottom left, Top right, Bottom right. Always English, whatever the lang parameter says, so it stays safe to compare against in code. Use positionLocalized for anything a reader sees.
                        positionLocalized:
                          type: string
                          example: Superior izquierda
                          description: Arrow position name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        activation:
                          type: object
                          properties:
                            planet:
                              type: string
                              example: Sun
                              description: Activating body whose substructure feeds this arrow. Determination and Motivation come from the Sun, Environment and Perspective from the North Node. Always English, whatever the lang parameter says, so it stays safe to compare against in code and to key a glyph table on. Use planetLocalized for anything a reader sees.
                            planetLocalized:
                              type: string
                              example: Sol
                              description: Activating body name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                            side:
                              type: string
                              example: design
                              description: Chart side of the activation. Determination and Environment come from the design side, Perspective and Motivation from the personality side. Always English, whatever the lang parameter says, so it stays safe to compare against in code.
                          required:
                          - planet
                          - side
                          description: The single activation, body and chart side, that this arrow is derived from.
                        color:
                          type: number
                          example: 4
                          description: Color number from 1 to 6, the substructure level one octave finer than the line. Color selects the arrow theme, for example the determination family or the motivation.
                        tone:
                          type: number
                          example: 1
                          description: 'Tone number from 1 to 6, the substructure level beneath Color. Tone sets the arrow direction: tones 1 to 3 face left, tones 4 to 6 face right.'
                        base:
                          type: number
                          example: 4
                          description: Base number from 1 to 5, the finest published subdivision of the wheel. Returned for completeness but treated as informational, since it is finer than most birth times can resolve.
                        direction:
                          type: string
                          example: left
                          description: Arrow direction derived from the Tone. left for tones 1 to 3, right for tones 4 to 6.
                        colorLabel:
                          type: string
                          example: Touch
                          description: Name of the Color theme for this arrow, for example a determination family such as Touch, an environment such as Mountains, a perspective such as Personal, or a motivation such as Hope. Always English, whatever the lang parameter says. Use colorLabelLocalized for anything a reader sees.
                        colorLabelLocalized:
                          type: string
                          example: Tacto
                          description: Color theme name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        directionLabel:
                          type: string
                          example: Active
                          description: Keynote of the arrow direction for this arrow, for example Active or Passive for Determination, Focused or Peripheral for Perspective. Always English, whatever the lang parameter says. Use directionLabelLocalized for anything a reader sees.
                        directionLabelLocalized:
                          type: string
                          example: Activo
                          description: Arrow direction keynote in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        description:
                          type: string
                          example: The top left arrow, fed by the design Sun and Earth. It describes how the body is built to take in and break down nourishment, sensation, and information, and it sets the cognitive potential that rests on that intake.
                          description: What this arrow is and what it governs.
                        layerDescription:
                          type: string
                          example: 'The body-side half of Variable, covering the Determination and Environment arrows. It addresses the form: the conditions under which the vehicle digests nourishment, and the place in which it meets least resistance.'
                          description: What the layer this arrow belongs to governs, the body side or the mind side.
                        colorMeaning:
                          type: string
                          example: Touch. Intake governed by contact and physical circumstance. What the body handles, and the state of the space it eats in, decide whether nourishment is absorbed or refused.
                          description: Meaning of the Color for THIS arrow. The same Color number means something different under Determination than under Motivation, so this is the reading of colorLabel in context, not a generic gloss.
                        toneMeaning:
                          type: string
                          example: Security. The tonal architecture rests on a baseline of safety. What is sound, familiar, and survivable registers first, and everything built above it stands on that footing.
                          description: 'Meaning of the Tone. The six Tones are shared across all four arrows: the arrow does not change the Tone, it changes what the Tone qualifies.'
                        directionMeaning:
                          type: string
                          example: Active. Intake is filtered on the way in. The body engages nourishment and information with focus and structure, and works best under specific, deliberate conditions rather than open-ended variety.
                          description: Meaning of the left or right direction for THIS arrow, the reading of directionLabel.
                        baseName:
                          type: string
                          example: Progressive
                          description: 'Name of the Base. Informational only: the Base is finer than any civil birth time can resolve. Always English, whatever the lang parameter says. Use baseNameLocalized for anything a reader sees.'
                        baseNameLocalized:
                          type: string
                          example: Progresivo
                          description: Base name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        cognition:
                          type: object
                          properties:
                            label:
                              type: string
                              example: Smell
                              description: 'Name of the Cognition, the strongest sense. One of six read off the Determination Tone: Smell, Taste, Outer Vision, Inner Vision, Feeling, Touch. Always English, whatever the lang parameter says, so it stays safe to compare against in code. Use labelLocalized for anything a reader sees.'
                            labelLocalized:
                              type: string
                              example: Olfato
                              description: Cognition name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                            description:
                              type: string
                              example: Smell. Immediate, pre-verbal recognition through the nose. The body reads safety and suitability in an instant, and does best taking in one source at a time rather than a crowded field.
                              description: How this Cognition discriminates what is correct for the body, and the conditions that sharpen it. Renderable as the Cognition paragraph of a Variables or Primary Health System report.
                          required:
                          - label
                          - description
                          description: 'Cognition, the strongest sense, read off the Determination Tone. Present on the determination arrow ONLY: no authority supports reading Cognition from the other three arrows, so it is omitted rather than invented.'
                        confident:
                          type: boolean
                          example: true
                          description: Whether this arrow is far enough from a Color or Tone boundary to be reliable. When false the activation sits on a knife edge where the Color label or the arrow direction could flip with a more precise birth time, and the arrow should not be presented as fact.
                      required:
                      - key
                      - name
                      - layer
                      - position
                      - activation
                      - color
                      - tone
                      - base
                      - direction
                      - colorLabel
                      - directionLabel
                      - description
                      - layerDescription
                      - colorMeaning
                      - toneMeaning
                      - directionMeaning
                      - baseName
                      - confident
                    description: 'The four Variable arrows: Determination and Environment from the design side, Perspective and Motivation from the personality side. Together they form the Rave Variables / Primary Health System layer that sits beneath Type, Strategy, Authority, and Profile.'
                  confident:
                    type: boolean
                    example: true
                    description: True only when all four arrows are confident. A single knife-edge arrow makes the whole configuration uncertain.
                  confidenceMarginDeg:
                    type: number
                    example: 0.00274
                    description: Boundary margin in degrees of ecliptic longitude used for the per-arrow confidence flag, the solar arc over a few minutes of clock time. An activation within this distance of a Color or Tone boundary is flagged low-confidence.
                  baseDescription:
                    type: string
                    example: 'The finest substructure layer: one of five facets of the Personality Crystal, and the entry point for the imprint Tone and Color build on. Fixed across incarnation, and finer than any civil birth time resolves, so it is informational only.'
                    description: 'What the Base layer is. Returned once at the top level rather than repeated on every arrow, since the Base layer is the same concept for all four. No per-Base meaning is returned: every one in circulation traces back to a single origin, so it fails the two-source bar this package holds.'
                required:
                - arrows
                - confident
                - confidenceMarginDeg
                - baseDescription
