                  description: 'IANA name (e.g. "America/New_York", "Europe/London", "UTC"), decimal hours (e.g. -5 for EST, 1 for CET), or a fixed UTC offset (e.g. "-05:00", "+01:00"). Prefer the IANA name: it is resolved to the DST-correct offset for the birth date, while a fixed offset or decimal is taken literally and will be wrong if it does not match the daylight-saving state on that date. Invalid timezones return 400 with a validation error.'
                  example: America/New_York
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  default: 0
                  example: 0
                  description: Birth latitude in decimal degrees. Optional and does not affect the bodygraph, which depends only on ecliptic longitudes. Defaults to 0.
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  default: 0
                  example: 0
                  description: Birth longitude in decimal degrees. Optional and does not affect the bodygraph. Defaults to 0.
                nodeType:
                  type: string
                  enum:
                  - mean
                  - 'true'
                  default: 'true'
                  example: 'true'
                  description: 'Lunar node convention. "mean" is the smoothed average node, which always moves retrograde; "true" is the osculating node, which tracks the real perturbed node, oscillates up to about 1.5 degrees either side of the mean on a 173-day cycle, and can briefly turn direct. Neither is more correct and they almost always fall in the same sign. Applies to the North and South Node activations. True is what professional Human Design software uses (HumanDesign.ai, Total Human Design) and is the value RoxyAPI verifies against, so leave it unset for a standard chart. It matters only when a node sits on a gate boundary, where the choice moves a node gate. Because a gate can be half of a channel, that can change the completed channels and, with them, whether a center reads defined or open, plus the definition, authority, profile or type. A chart where only one center disagrees is the usual shape, since the type and profile often survive unchanged. If another calculator disagrees on any of those, it is almost certainly using the mean node: pass "mean" to match it. Defaults to "true".'
              required:
              - date
              - time
              - timezone
      responses:
        '200':
          description: All nine centers with defined state, flags, theme, and active gates
          content:
            application/json:
              schema:
                type: object
                properties:
                  centers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: sacral
                          description: Center identifier. One of head, ajna, throat, g, heart, sacral, solar-plexus, spleen, root.
                        name:
                          type: string
                          example: Sacral
                          description: Display name of the center. Always English, whatever the lang parameter says, so it stays safe to compare against in code. Use nameLocalized for anything a reader sees.
                        nameLocalized:
                          type: string
                          example: Sacro
                          description: Center name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        defined:
                          type: boolean
                          example: true
                          description: Whether the center is defined. A defined center is a consistent source of energy or awareness; an undefined center is open and conditioned by others.
                        motor:
                          type: boolean
                          example: true
                          description: Whether this is a motor center (energy source). The four motors are Heart, Sacral, Solar Plexus, and Root.
                        awareness:
                          type: boolean
                          example: false
                          description: Whether this is an awareness center. The three awareness centers are Ajna, Solar Plexus, and Spleen.
                        theme:
                          type: string
                          example: Sustainable life force and work energy. A reliable gut response that guides what to engage with.
                          description: Theme text describing the center in its current defined or undefined state.
                        notSelfQuestion:
                          type: string
                          example: Is all this talking and doing an attempt to attract attention?
                          description: The conditioning trap of this center when it is open. Returned on every center so a consumer can surface it the moment `defined` is false, which is where the not-self operates.
                        biology:
                          type: string
