openapi: 3.2.0
info:
  title: Roxy Human Design API
  version: 2.0.0
  description: '# RoxyAPI: AI-Native Insight Infrastructure


    > **Base URL:** `https://roxyapi.com/api/v2`

    > All endpoint paths below are relative to this base URL.'
  contact:
    name: RoxyAPI Support
    url: https://roxyapi.com/contact
  license:
    name: Proprietary
    url: https://roxyapi.com/policy/terms
servers:
- url: /api/v2
  description: Production API v2
security:
- apiKey: []
tags:
- name: Human Design
  description: 'Generate the full Human Design bodygraph from a birth moment: type, strategy, inner authority, profile, definition, incarnation cross, the nine centers, defined channels, and all 26 gate activations, plus two-person connection charts and small-group Penta analysis. Planetary positions verified against NASA JPL Horizons, the Design side solved on the exact 88 degree solar arc. One key, Remote MCP, typed SDKs.'
paths:
  /human-design/bodygraph:
    post:
      operationId: generateBodygraph
      tags:
      - Human Design
      summary: Generate full Human Design bodygraph - Type, authority, profile, centers…
      description: Generate a complete Human Design bodygraph from a birth date, time, and timezone. Returns the energy type, strategy, inner authority, signature, not-self theme, profile, definition, incarnation cross, all nine centers with defined state and active gates, the defined channels, and all 26 planetary activations across the Personality and Design sides. The single endpoint for a full chart in one call, built for Human Design apps, readings, and coaching tools.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  example: '1990-07-15'
                  description: Birth date in YYYY-MM-DD format. The anchor for both the Personality activations at birth and the Design activations 88 degrees of solar arc earlier.
                time:
                  type: string
                  format: time
                  example: '13:00:00'
                  description: 'Birth time in 24-hour HH:MM:SS format. Precision matters: the profile lines and gate boundaries shift with the exact minute of birth.'
                timezone:
                  anyOf:
                  - type: number
                    minimum: -14
                    maximum: 14
                  - type: string
                  description: 'IANA name (e.g. "America/New_York", "Europe/London", "UTC"), decimal hours (e.g. -5 for EST, 1 for CET), or a fixed UTC offset (e.g. "-05:00", "+01:00"). Prefer the IANA name: it is resolved to the DST-correct offset for the birth date, while a fixed offset or decimal is taken literally and will be wrong if it does not match the daylight-saving state on that date. Invalid timezones return 400 with a validation error.'
                  example: America/New_York
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  default: 0
                  example: 0
                  description: Birth latitude in decimal degrees. Optional and does not affect the bodygraph, which depends only on ecliptic longitudes. Defaults to 0.
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  default: 0
                  example: 0
                  description: Birth longitude in decimal degrees. Optional and does not affect the bodygraph. Defaults to 0.
                nodeType:
                  type: string
                  enum:
                  - mean
                  - 'true'
                  default: 'true'
                  example: 'true'
                  description: 'Lunar node convention. "mean" is the smoothed average node, which always moves retrograde; "true" is the osculating node, which tracks the real perturbed node, oscillates up to about 1.5 degrees either side of the mean on a 173-day cycle, and can briefly turn direct. Neither is more correct and they almost always fall in the same sign. Applies to the North and South Node activations. True is what professional Human Design software uses (HumanDesign.ai, Total Human Design) and is the value RoxyAPI verifies against, so leave it unset for a standard chart. It matters only when a node sits on a gate boundary, where the choice moves a node gate. Because a gate can be half of a channel, that can change the completed channels and, with them, whether a center reads defined or open, plus the definition, authority, profile or type. A chart where only one center disagrees is the usual shape, since the type and profile often survive unchanged. If another calculator disagrees on any of those, it is almost certainly using the mean node: pass "mean" to match it. Defaults to "true".'
              required:
              - date
              - time
              - timezone
      responses:
        '200':
          description: Complete bodygraph with type, authority, profile, centers, channels, and gates
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: Manifestor
                    description: Human Design energy type. One of Manifestor, Generator, Manifesting Generator, Projector, Reflector. Always English, whatever the lang parameter says, so it stays safe to compare against in code. Use typeLocalized for anything a reader sees.
                  typeLocalized:
                    type: string
                    example: Manifestador
                    description: Energy type name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                  typeDescription:
                    type: string
                    example: An initiating, impactful aura built to start things and set them in motion. Informing others before acting clears resistance and brings peace.
                    description: What the aura of this type does and how it is designed to engage life. The grounding text for the type label, so a consuming agent does not have to supply the meaning itself.
                  aura:
                    type: string
                    example: Closed and repelling. The field pushes outward and deflects influence, so a Manifestor is felt before anything is said, and others tend to brace against energy they cannot read.
                    description: 'The aura mechanic of the type: how the energy field itself operates, for example open and enveloping, or closed and repelling.'
                  strategy:
                    type: string
                    example: Inform
                    description: The aura strategy for engaging life correctly for this type. Always English, whatever the lang parameter says. Use strategyLocalized for anything a reader sees.
                  strategyLocalized:
                    type: string
                    example: Informar
                    description: Strategy name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                  strategyDescription:
                    type: string
                    example: 'Inform everyone an action will affect, before taking it. This is not asking permission and not seeking approval: it removes the surprise that provokes resistance, which is what turns anger into peace.'
                    description: How to actually apply the strategy. The strategy field alone is a bare label such as Respond or Inform; this is the operating instruction behind it.
                  authority:
                    type: string
                    example: Emotional
                    description: Inner authority for decision making. One of Emotional, Sacral, Splenic, Ego, Self-Projected, Mental, Lunar. Always English, whatever the lang parameter says, so it stays safe to compare against in code. Use authorityLocalized for anything a reader sees.
                  authorityLocalized:
                    type: string
                    example: Emocional
                    description: Inner authority name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                  authorityDescription:
                    type: string
                    example: 'Decisions are made across an emotional wave rather than inside a moment. The defined Solar Plexus moves on its own rhythm between hope and pain, so no single moment carries the truth: clarity is what remains once the wave has run its course and settled toward neutral. The trap is committing at the peak, where enthusiasm reads as certainty, or at the trough, where gloom reads as insight, and treating any pressure to answer now as a reason to skip the wait.'
                    description: How the decision is made, the timing it requires, and the characteristic trap. Inner authority is the most actionable output of a Human Design chart, so this is the field to lean on when grounding a reading.
                  signature:
                    type: string
                    example: Peace
                    description: The signature feeling of living in alignment with the type. Always English, whatever the lang parameter says. Use signatureLocalized for anything a reader sees.
                  signatureLocalized:
                    type: string
                    example: Paz
                    description: Signature theme name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                  notSelf:
                    type: string
                    example: Anger
                    description: The not-self theme, the recurring feeling that signals being out of alignment. Always English, whatever the lang parameter says. Use notSelfLocalized for anything a reader sees.
                  notSelfLocalized:
                    type: string
                    example: Ira
                    description: Not-self theme name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                  profile:
                    type: string
                    example: 5/1
                    description: Profile in conscious/unconscious form from the Personality Sun line over the Design Sun line.
                  profileKeynotes:
                    type: object
                    properties:
                      personalityLine:
                        type: number
                        example: 5
                        description: Line number 1 to 6 of the conscious Personality Sun, the first digit of the profile.
                      designLine:
                        type: number
                        example: 1
                        description: Line number 1 to 6 of the unconscious Design Sun, the second digit of the profile.
                      personality:
                        type: string
                        example: 'Heretic: a universalizing, practical force others project expectations onto.'
                        description: Keynote of the conscious Personality line. The half of the life role the person is aware of and can speak to.
                      design:
                        type: string
                        example: 'Investigator: builds a secure foundation through study before acting.'
                        description: Keynote of the unconscious Design line. The half of the life role others see operating in the body, which the person does not directly experience.
                    required:
                    - personalityLine
                    - designLine
                    - personality
                    - design
                    description: The two line keynotes the profile is built from, conscious over unconscious, so the profile is readable without a separate lookup.
                  profileDescription:
                    type: string
                    example: 'Heretic over Investigator. A conscious projection field leads others to assume a solution is already at hand, and the unconscious first line quietly supplies the foundation that can actually answer. Reputation is both the currency and the risk: with real preparation the practical solution lands far beyond the personal, and without it the same projection curdles into blame.'
                    description: 'Meaning of the combined profile. A profile is not the sum of its two lines: 6/2 has its own meaning that neither the line 6 nor the line 2 keynote carries alone.'
                  definition:
                    type: string
                    example: Split
                    description: Definition type from the number of connected components among defined centers. One of None, Single, Split, Triple Split, Quadruple Split. Always English, whatever the lang parameter says, so it stays safe to compare against in code. Use definitionLocalized for anything a reader sees.
                  definitionLocalized:
                    type: string
                    example: Dividida
                    description: Definition type name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                  definitionDescription:
                    type: string
                    example: The defined centers fall into two groups with no channel between them, so energy is consistent inside each group and does not cross the divide. The gap is bridged by the gates other people carry, which is why particular company can make thinking suddenly feel joined up, and why that company is easily mistaken for completion rather than recognized as a temporary bridge. What the configuration needs is time for the two areas to synthesize and awareness of who is bridging them, not a rushed decision taken while the halves are still speaking separately.
                    description: How energy flows through the defined centers in this configuration, and what the configuration needs. For a split, this is where the bridging gates of other people matter.
                  sides:
                    type: object
                    additionalProperties:
                      type: string
                      example: 'The conscious side, printed in black and calculated at the moment of birth. These activations are the mind and the sense of self: what the person recognizes as their own and can describe to someone else.'
                      description: What this chart side is and what it governs, localized by the lang query parameter. Render it as the legend beside the personality or design column of a bodygraph.
                    example:
                      personality: The conscious side, printed in black and calculated at the moment of birth.
                      design: The unconscious side, printed in red and calculated 88 degrees of solar arc before birth.
                    description: 'What the two chart sides are: personality is the conscious mind side, design is the unconscious body side computed 88 degrees of solar arc before birth. Returned once at the top level rather than repeated across all 26 activations.'
                  incarnationCross:
                    type: object
                    properties:
                      gates:
                        type: array
                        items:
                          type: number
                        example:
                        - 51
                        - 57
                        - 61
                        - 62
                        description: 'The four cardinal gates of the cross: Personality Sun, Personality Earth, Design Sun, Design Earth.'
                      angle:
                        type: string
                        example: Left Angle
                        description: Cross angle. One of Right Angle, Juxtaposition, Left Angle. Always English, whatever the lang parameter says. Use angleLocalized for anything a reader sees.
                      angleLocalized:
                        type: string
                        example: Ángulo Izquierdo
                        description: Cross angle name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                      angleCode:
                        type: string
                        example: LAX
                        description: Short code for the angle. One of RAX, JXT, LAX.
                      name:
                        type: string
                        example: Left Angle Cross of the Clarion
                        description: Canonical published name of the incarnation cross, determined by the Personality Sun gate and the angle. Falls back to a name composed from the angle and the four gates if no canonical name exists.
                      description:
                        type: string
                        example: Shock delivered to whoever is ready for it. The reaction is often outrage, and underneath it is a change that was waiting for something to force it, which is why the shock needs a receiver.
                        description: 'The life theme of the cross, synthesized from its four gates and the orientation the angle gives them. The same Sun gate under a different angle is a genuinely different theme: Right Angle is personal destiny, Left Angle is worked out through other people, Juxtaposition is a fixed fate.'
                    required:
                    - gates
                    - angle
                    - angleCode
                    - name
                    description: The incarnation cross built from the four cardinal gates and the profile angle.
                  centers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: sacral
                          description: Center identifier. One of head, ajna, throat, g, heart, sacral, solar-plexus, spleen, root.
                        name:
                          type: string
                          example: Sacral
                          description: Display name of the center. Always English, whatever the lang parameter says, so it stays safe to compare against in code. Use nameLocalized for anything a reader sees.
                        nameLocalized:
                          type: string
                          example: Sacro
                          description: Center name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        defined:
                          type: boolean
                          example: true
                          description: Whether the center is defined. A defined center is a consistent source of energy or awareness; an undefined center is open and conditioned by others.
                        motor:
                          type: boolean
                          example: true
                          description: Whether this is a motor center (energy source). The four motors are Heart, Sacral, Solar Plexus, and Root.
                        awareness:
                          type: boolean
                          example: false
                          description: Whether this is an awareness center. The three awareness centers are Ajna, Solar Plexus, and Spleen.
                        theme:
                          type: string
                          example: Sustainable life force and work energy. A reliable gut response that guides what to engage with.
                          description: Theme text describing the center in its current defined or undefined state.
                        notSelfQuestion:
                          type: string
                          example: Is all this talking and doing an attempt to attract attention?
                          description: The conditioning trap of this center when it is open. Returned on every center so a consumer can surface it the moment `defined` is false, which is where the not-self operates.
                        biology:
                          type: string
                          example: The adrenal glands.
                          description: The gland, organ, or system this center corresponds to in the body.
                        gates:
                          type: array
                          items:
                            type: number
                          example:
                          - 5
                          - 14
                          - 34
                          description: Active gate numbers that sit in this center.
                      required:
                      - id
                      - name
                      - defined
                      - motor
                      - awareness
                      - theme
                      - notSelfQuestion
                      - biology
                      - gates
                    description: All nine centers with their defined state and active gates.
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        gateA:
                          type: number
                          example: 20
                          description: First gate of the channel.
                        gateB:
                          type: number
                          example: 34
                          description: Second gate of the channel.
                        name:
                          type: string
                          example: Charisma
                          description: Name of the defined channel. Always English, whatever the lang parameter says. Use nameLocalized for anything a reader sees.
                        nameLocalized:
                          type: string
                          example: Carisma
                          description: Channel name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        circuit:
                          type: string
                          example: Individual
                          description: Circuit family of the channel. One of Individual, Collective, Tribal. Always English, whatever the lang parameter says. Use circuitLocalized for anything a reader sees.
                        circuitLocalized:
                          type: string
                          example: Individual
                          description: Circuit family name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        centers:
                          type: array
                          items:
                            type: string
                          example:
                          - throat
                          - sacral
                          description: The two centers this channel connects and defines.
                        description:
                          type: string
                          example: Sacral power is pushed straight to the Throat, so awareness in the present moment becomes action with almost no pause between them. The energy stays healthy only while it is busy with work it loves.
                          description: What this channel wires between its two centers and the nature of the energy it carries.
                        circuitDescription:
                          type: string
                          example: Empowerment through mutation, carried by 15 channels. The knowing here cannot be explained or handed over, only lived, and it changes other people by exposure rather than instruction. It arrives as a pulse, never on demand.
                          description: What the circuit family of this channel governs.
                      required:
                      - gateA
                      - gateB
                      - name
                      - circuit
                      - centers
                      - description
                      - circuitDescription
                    description: The defined channels where both gates are activated.
                  gates:
                    type: array
                    items:
                      type: object
                      properties:
                        planet:
                          type: string
                          example: Sun
                          description: Activating body. One of Sun, Earth, Moon, North Node, South Node, Mercury, Venus, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto. Always English, whatever the lang parameter says, so it stays safe to compare against in code and to key a glyph table on. Use planetLocalized for anything a reader sees.
                        planetLocalized:
                          type: string
                          example: Sol
                          description: Activating body name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        side:
                          type: string
                          example: personality
                          description: Chart side. personality is the conscious birth-moment activation, design is the unconscious activation 88 degrees of solar arc before birth.
                        gate:
                          type: number
                          example: 51
                          description: Human Design gate number from 1 to 64 that this activation falls in.
                        line:
                          type: number
                          example: 5
                          description: Line number from 1 to 6 within the gate, setting the line keynote and the profile.
                        gateName:
                          type: string
                          example: Shock
                          description: Human Design keynote name of the gate, describing its bodygraph function. Always English, whatever the lang parameter says. Use gateNameLocalized for anything a reader sees.
                        gateNameLocalized:
                          type: string
                          example: Choque
                          description: Gate keynote name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        gateDescription:
                          type: string
                          example: Willpower that shocks and competes. Sitting in the heart center, it moves first and startles, and that shock is what initiates others into a deeper connection with spirit.
                          description: 'Bodygraph function of the gate: what it does in the center it sits in and the channel it forms. This is NOT the meaning of the I-Ching hexagram that shares its number. They share a number, not a definition.'
                        lineMeaning:
                          type: string
                          example: The group turns to this line when everything breaks. It reads the shape of the shock and rides it, and savoring the victory is what leaves it exposed to the next one.
                          description: 'Meaning of this gate at this specific line, one of 384. The finest interpretive layer in the chart and the one that makes a reading specific rather than generic. This is not the six abstract line archetypes: gate 41 line 3 carries its own meaning that neither the gate keynote nor the line-3 archetype holds alone.'
                        planetDescription:
                          type: string
                          example: The dominant activation. With the Earth it carries roughly 70 percent of the imprint on the chart. The Personality Sun gate is the conscious life theme, the Design Sun is the radiance the body broadcasts before a word is spoken.
                          description: What this planetary activation contributes in Human Design specifically, which is not its meaning in western astrology.
                        ichingHexagram:
                          type: object
                          properties:
                            number:
                              type: number
                              example: 51
                              description: I-Ching hexagram number, identical to the gate number it corresponds to.
                            english:
                              type: string
                              example: The Arousing
                              description: English name of the corresponding I-Ching hexagram.
                          required:
                          - number
                          - english
                          description: Cross-reference to the I-Ching hexagram that shares this gate number.
                      required:
                      - planet
                      - side
                      - gate
                      - line
                      - gateName
                      - gateDescription
                      - lineMeaning
                      - planetDescription
                      - ichingHexagram
                    description: All 26 activations, 13 Personality and 13 Design.
                required:
                - type
                - typeDescription
                - aura
                - strategy
                - strategyDescription
                - authority
                - authorityDescription
                - signature
                - notSelf
                - profile
                - profileKeynotes
                - profileDescription
                - definition
                - definitionDescription
                - sides
                - incarnationCross
                - centers
                - channels
                - gates
        '400':
          description: Validation error. `issues[]` lists every failed field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: First issue summary.
                  code:
                    type: string
                    enum:
                    - validation_error
                  issues:
                    type: array
                    description: Every validation failure. Use this to rebuild a valid request.
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Dot-separated field path, or "(root)" for top-level.
                        message:
                          type: string
                        code:
                          type: string
                          description: Zod issue code (invalid_type, too_small, too_big, invalid_string, ...).
                        expected:
                          type: string
                          description: Expected type for invalid_type.
                        minimum:
                          description: Minimum bound for too_small issues.
                          oneOf:
                          - type: number
                          - type: string
                        maximum:
                          description: Maximum bound for too_big issues.
                          oneOf:
                          - type: number
                          - type: string
                        inclusive:
                          type: boolean
                        format:
                          type: string
                          description: Format name for string issues (regex, email, url, uuid).
                        pattern:
                          type: string
                          description: Regex pattern when format is regex.
                      required:
                      - path
                      - message
                required:
                - error
                - code
                - issues
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                required:
                - error
                - code
        '405':
          description: Method not allowed. The path exists but only responds to the methods listed in `allow[]` and the `Allow` response header.
          headers:
            Allow:
              description: Comma-separated list of allowed methods (RFC 9110).
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                    - method_not_allowed
                  allow:
                    type: array
                    items:
                      type: string
                    description: Allowed HTTP methods for this path. Mirrors the Allow response header.
                  docs:
                    type: string
                    description: Link to the product page for this domain.
                required:
                - error
                - code
                - allow
        '429':
          description: Monthly rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                required:
                - error
                - code
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                required:
                - error
                - code
  /human-design/connection:
    post:
      operationId: calculateConnection
      tags:
      - Human Design
      summary: Calculate Human Design connection chart - Two-person composite bodygraph…
      description: Calculate a Human Design connection chart by overlaying two bodygraphs. For each of the 36 channels the dynamic between the two people is classified as electromagnetic, dominance, compromise, or companionship, the four mechanics of how two designs meet. Also returns the nine centers as defined or open in the combined bodygraph with which person defines each, the combined definition, and a count of each dynamic. Built for relationship, dating, and coaching tools.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                personA:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                      example: '1990-07-15'
