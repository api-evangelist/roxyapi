  /astrology/transits/monthly:
    post:
      tags:
      - Western Astrology
      summary: Monthly Transits - Tropical sign ingresses for an entire month
      operationId: getMonthlyTropicalTransits
      description: 'Get every tropical sign change for a given month, for all 14 Western bodies: the Sun through Pluto, both lunar nodes, Chiron and Black Moon Lilith. Returns the starting sign of each body on the first of the month and then each ingress with its exact date and time in your timezone. Omit year and month to get the month in progress, so a published transit calendar stays current without a redeploy. Essential for transit calendars, monthly forecast copy, retrograde and ingress tracking, and newsletter automation. Monthly transit API, planetary ingress calendar, sign change dates, tropical transit table. Verified against NASA JPL Horizons, with the four cardinal ingresses cross-checked against published equinox and solstice times.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                year:
                  type: integer
                  minimum: 1900
                  maximum: 2100
                  example: 2026
                  description: Year for the monthly transit table (1900-2100). Defaults to the current year (UTC).
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  example: 3
                  description: Month number (1-12). Defaults to the current month (UTC).
                timezone:
                  anyOf:
                  - type: number
                    minimum: -14
                    maximum: 14
                  - type: string
                  default: 0
                  description: Timezone offset from UTC in hours. Ingress dates and times are reported in this zone, which is what makes a published calendar read correctly for its audience. Defaults to 0 (UTC).
                  example: -5
                nodeType:
                  type: string
                  enum:
                  - mean
                  - 'true'
                  default: 'true'
                  example: 'true'
                  description: Lunar node convention. "mean" is the smoothed average node, which always moves retrograde; "true" is the osculating node, which tracks the real perturbed node, oscillates up to about 1.5 degrees either side of the mean on a 173-day cycle, and can briefly turn direct. Neither is more correct and they almost always fall in the same sign. Applies to the North and South Node. True is the osculating node and the default, because it is what most Western chart software reports; mean is the smoothed node preferred by several evolutionary schools, so pass "mean" to match one. Nothing else in the chart changes, and the two agree on the sign except when the node sits within about 1.8 degrees of a cusp. Defaults to "true".
      responses:
        '200':
          description: Monthly transit table calculated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  year:
                    type: number
                    example: 2026
                    description: Year of the table. Echoes the year requested, or the current UTC year when it was omitted.
                  month:
                    type: number
                    example: 3
                    description: Month of the table. Echoes the month requested, or the current UTC month when it was omitted.
                  timezone:
                    type: number
                    example: -5
                    description: Timezone the ingress dates and times are reported in. Echoes the request.
                  startingPositions:
                    type: array
                    items:
                      type: object
                      properties:
                        planet:
                          type: string
                          example: Sun
                          description: Body name, canonical English.
                        planetLocalized:
                          type: string
                          example: Sol
                          description: Body name in the requested language.
                        sign:
                          type: string
                          example: Aquarius
                          description: Tropical sign the body occupies at the start of the month.
                        signLocalized:
                          type: string
                          example: Acuario
                          description: Sign in the requested language.
                        longitude:
                          type: number
                          example: 311.4823
                          description: Tropical ecliptic longitude in degrees at 00:00 UTC on the first of the month.
                      required:
                      - planet
                      - sign
                      - longitude
                    description: Where every body stands as the month opens, so a calendar can show the run-in as well as the changes.
                  transitEvents:
                    type: array
                    items:
                      type: object
                      properties:
                        planet:
                          type: string
                          example: Venus
                          description: Body that changes sign during the month. One of the 14 Western bodies. Always canonical English whatever the lang parameter says, so it stays safe to compare against in code. Use planetLocalized for anything a reader sees.
                        planetLocalized:
                          type: string
                          example: Venus
                          description: Body name in the requested language. Present only when lang is supplied.
                        fromSign:
                          type: string
                          example: Aquarius
                          description: Tropical sign the body leaves. Canonical English.
                        fromSignLocalized:
                          type: string
                          example: Acuario
                          description: Sign left, in the requested language. Present only when lang is supplied.
                        toSign:
                          type: string
                          example: Pisces
                          description: Tropical sign the body enters. Canonical English.
                        toSignLocalized:
                          type: string
                          example: Piscis
                          description: Sign entered, in the requested language. Present only when lang is supplied.
                        date:
                          type: string
                          example: '2026-03-02'
                          description: Date of the ingress in the requested timezone (YYYY-MM-DD).
                        time:
                          type: string
                          example: 00:56
                          description: Time of the ingress in the requested timezone (HH:MM).
                        datetime:
                          type: string
                          example: 2026-03-02T00:56
                          description: Combined ingress timestamp in the requested timezone.
                        isRetrograde:
                          type: boolean
                          example: false
                          description: Whether the body was retrograde at the moment it crossed. A retrograde ingress is the body re-entering a sign it already left, which is why the same body can appear more than once in a month.
                      required:
                      - planet
                      - fromSign
                      - toSign
                      - date
                      - time
                      - datetime
                      - isRetrograde
                    description: Every sign change in the month, in chronological order across all bodies. Empty only for a month in which nothing changes sign, which cannot happen while the Moon is included.
                required:
                - year
                - month
                - timezone
                - startingPositions
                - transitEvents
