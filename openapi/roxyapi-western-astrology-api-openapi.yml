  /astrology/planetary-returns:
    post:
      operationId: generatePlanetaryReturn
      tags:
      - Western Astrology
      summary: Planetary Return Chart - Saturn return, Jupiter return, and inner planet cycles
      description: Generate a planetary return chart for Mercury, Venus, Mars, Jupiter, or Saturn. A planetary return occurs when a transiting planet conjuncts its natal longitude, marking the beginning of a new cycle. Saturn return (~29 years) is the most significant life milestone in Western astrology. Jupiter return (~12 years) signals expansion and growth phases. Mars return (~2 years) resets energy and drive. Returns full tropical zodiac chart with all planetary positions, house cusps, and aspects. Planetary return chart API, Saturn return calculator, Jupiter return chart, Mars return forecast.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            example:
              birthDate: '1990-07-15'
              birthTime: '14:30:00'
              planet: Jupiter
              approximateDate: '2024-08-15'
              latitude: 40.7128
              longitude: -74.006
              timezone: -5
              houseSystem: placidus
            schema:
              type: object
              properties:
                birthDate:
                  type: string
                  format: date
                  example: '1990-07-15'
                  description: Original birth date in YYYY-MM-DD format. Used to determine the natal longitude of the selected planet.
                birthTime:
                  type: string
                  format: time
                  example: '14:30:00'
                  description: Original birth time in 24-hour HH:MM:SS format. Determines exact natal planet position for return timing.
                planet:
                  type: string
                  enum:
                  - Mercury
                  - Venus
                  - Mars
                  - Jupiter
                  - Saturn
                  example: Jupiter
                  description: Planet for the return calculation. Supports Mercury (~88 days), Venus (~225 days), Mars (~687 days), Jupiter (~12 years), and Saturn (~29 years). Saturn return is a major life milestone in Western astrology.
                approximateDate:
                  type: string
                  format: date
                  example: '2026-08-15'
                  description: Approximate date near the expected planetary return (YYYY-MM-DD). Provide a date within the expected return window. The algorithm searches from this starting point.
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  example: 40.7128
                  description: Latitude of the return location in decimal degrees (-90 to 90). Affects house cusps and Ascendant of the return chart.
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  example: -74.006
                  description: Longitude of the return location in decimal degrees (-180 to 180).
                timezone:
                  anyOf:
                  - type: number
                    minimum: -14
                    maximum: 14
                  - type: string
                  description: Decimal hours from UTC OR IANA name (e.g. "America/New_York"). IANA resolved to the DST-correct offset for the birthDate. Output datetime is adjusted to this timezone.
                  example: -5
                houseSystem:
                  type: string
                  enum:
                  - placidus
                  - whole-sign
                  - equal
                  - koch
                  default: placidus
                  example: placidus
                  description: House system for the return chart. Placidus (default), Whole Sign, Equal, or Koch.
              required:
              - birthDate
              - birthTime
              - planet
              - approximateDate
              - latitude
              - longitude
              - timezone
