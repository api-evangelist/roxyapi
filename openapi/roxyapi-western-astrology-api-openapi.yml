  /astrology/parallels/monthly:
    post:
      operationId: getMonthlyDeclinationParallels
      tags:
      - Western Astrology
      summary: Monthly Parallels - Declination contacts for an entire month
      description: 'Get every parallel and contraparallel of declination that perfects during a given month, across the 13 non-lunar Western bodies: the Sun and Mercury through Pluto, both lunar nodes, Chiron and Black Moon Lilith. A parallel is two bodies at the same declination and reads much like a conjunction; a contraparallel is equal and opposite declinations and reads much like an opposition. Neither depends on zodiacal distance, so they surface connections an aspect table cannot show, which is why traditional and modern practitioners read them alongside aspects. Declinations are geocentric, matching what an ephemeris publishes. Returns the exact date and time of closest approach in your timezone with both declinations. The Moon is excluded because its declination swings the full range every month and would bury the slow pairs. Omit year and month to get the month in progress, so a published calendar stays current without a redeploy. Essential for declination work, out-of-bounds tracking, monthly forecast copy, and electional timing. Monthly parallel calendar API, declination aspects, contraparallel ephemeris. Verified against NASA JPL Horizons.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                year:
                  type: integer
                  minimum: 1900
                  maximum: 2100
                  example: 2026
                  description: Year for the declination calendar (1900-2100). Defaults to the current year (UTC).
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  example: 3
                  description: Month number (1-12). Defaults to the current month (UTC).
                timezone:
                  anyOf:
                  - type: number
                    minimum: -14
                    maximum: 14
                  - type: string
                  default: 0
                  description: Timezone offset from UTC in hours. Event dates and times are reported in this zone, which is what makes a published calendar read correctly for its audience. Defaults to 0 (UTC).
                  example: -5
                orb:
                  type: number
                  minimum: 0.1
                  maximum: 3
                  default: 1.5
                  example: 1.5
                  description: How far from exact still counts, in degrees. The traditional orb for a declination contact is tighter than for a zodiacal aspect because declination changes slowly. Defaults to 1.5.
                nodeType:
                  type: string
                  enum:
                  - mean
                  - 'true'
                  default: 'true'
                  example: 'true'
                  description: Lunar node convention. "mean" is the smoothed average node, which always moves retrograde; "true" is the osculating node, which tracks the real perturbed node, oscillates up to about 1.5 degrees either side of the mean on a 173-day cycle, and can briefly turn direct. Neither is more correct and they almost always fall in the same sign. Applies to the North and South Node. True is the osculating node and the default, because it is what most Western chart software reports; mean is the smoothed node preferred by several evolutionary schools, so pass "mean" to match one. Nothing else in the chart changes, and the two agree on the sign except when the node sits within about 1.8 degrees of a cusp. Defaults to "true".
      responses:
        '200':
          description: Monthly declination calendar calculated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  year:
                    type: number
                    example: 2026
                    description: Year of the calendar. Echoes the year requested, or the current UTC year when it was omitted.
                  month:
                    type: number
                    example: 3
                    description: Month of the calendar. Echoes the month requested, or the current UTC month when it was omitted.
                  timezone:
                    type: number
                    example: -5
                    description: Timezone the event dates and times are reported in. Echoes the request.
                  orb:
                    type: number
                    example: 1.5
                    description: Orb in degrees that was applied. Echoes the request.
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        planet1:
                          type: string
                          example: Venus
                          description: First body in the contact. Always canonical English whatever the lang parameter says, so it stays safe to compare against in code. Use planet1Localized for anything a reader sees.
                        planet1Localized:
                          type: string
                          example: Venus
                          description: First body in the requested language. Present only when lang is supplied.
                        planet2:
                          type: string
                          example: Saturn
                          description: Second body in the contact. Always canonical English.
                        planet2Localized:
                          type: string
                          example: Saturno
                          description: Second body in the requested language. Present only when lang is supplied.
                        type:
                          type: string
                          enum:
                          - parallel
                          - contraparallel
                          example: parallel
                          description: parallel means both bodies stand at the same declination, the same distance north or south of the celestial equator, and reads much like a conjunction. contraparallel means equal and opposite declinations, one as far north as the other is south, and reads much like an opposition. Neither depends on how far apart the two bodies are along the zodiac, which is what makes them worth tracking alongside ordinary aspects.
                        date:
                          type: string
                          example: '2026-03-14'
                          description: Date the contact is closest to exact, in the requested timezone (YYYY-MM-DD).
                        time:
                          type: string
                          example: 09:42
                          description: Time the contact is closest to exact, in the requested timezone (HH:MM).
                        datetime:
                          type: string
                          example: 2026-03-14T09:42
                          description: Combined timestamp of closest approach, in the requested timezone.
                        orb:
                          type: number
                          example: 0.01
                          description: Distance from exact in degrees at the reported instant. Effectively zero for a contact that perfects inside the month, and larger only where the pair turns before reaching exact.
                        declination1:
                          type: number
                          example: -12.4183
                          description: Geocentric declination of the first body at the reported instant, in degrees. Positive is north of the celestial equator, negative south.
                        declination2:
                          type: number
                          example: -12.4102
                          description: Geocentric declination of the second body at the reported instant, in degrees.
                      required:
                      - planet1
                      - planet2
                      - type
                      - date
                      - time
                      - datetime
                      - orb
                      - declination1
                      - declination2
                    description: Every declination contact in the month, in chronological order across all body pairs.
                required:
                - year
                - month
                - timezone
                - orb
                - events
