    AsteroidsRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          example: '1990-07-15'
          description: Birth date in YYYY-MM-DD format. Determines planetary positions for the specific calendar day.
        time:
          type: string
          format: time
          example: '14:30:00'
          description: Birth time in 24-hour HH:MM:SS format. Determines the Ascendant (rising sign) and house cusps. Use 12:00:00 if unknown.
        latitude:
          type: number
          minimum: -90
          maximum: 90
          example: 40.7128
          description: Birth location latitude in decimal degrees (-90 to 90). Positive = North, negative = South.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          example: -74.006
          description: Birth location longitude in decimal degrees (-180 to 180). Positive = East, negative = West.
        timezone:
          anyOf:
          - type: number
            minimum: -14
            maximum: 14
          - type: string
          description: 'Timezone: IANA name (e.g. "America/New_York", "Europe/London") OR decimal hours from UTC (e.g. -5 for EST, 1 for CET). IANA strings are resolved to the DST-correct offset for the given date, so you can pass `cities[0].timezone` from /location/search directly.'
          example: -5
        nodeType:
          type: string
          enum:
          - mean
          - 'true'
          default: 'true'
          example: 'true'
          description: Lunar node convention. "mean" is the smoothed average node, which always moves retrograde; "true" is the osculating node, which tracks the real perturbed node, oscillates up to about 1.5 degrees either side of the mean on a 173-day cycle, and can briefly turn direct. Neither is more correct and they almost always fall in the same sign. Applies to the North and South Node. True is the osculating node and the default, because it is what most Western chart software reports; mean is the smoothed node preferred by several evolutionary schools, so pass "mean" to match one. Nothing else in the chart changes, and the two agree on the sign except when the node sits within about 1.8 degrees of a cusp. Defaults to "true".
        houseSystem:
          type: string
          enum:
          - placidus
          - whole-sign
          - equal
          - koch
          default: placidus
          example: placidus
          description: House system used to assign each asteroid to a natal house. Placidus (default), Whole Sign, Equal, or Koch. Above the polar circle, quadrant systems fall back to Whole Sign and the echoed houseSystem reports the system actually used.
      required:
      - date
      - time
      - latitude
      - longitude
      - timezone
    RelocationPlanet:
      type: object
      properties:
        name:
          type: string
          enum:
          - Sun
          - Moon
          - Mercury
          - Venus
          - Mars
          - Jupiter
          - Saturn
          - Uranus
          - Neptune
          - Pluto
          - North Node
          - South Node
          - Chiron
          - Black Moon Lilith
          example: Sun
          description: Body name. One of the 10 classical planets (Sun, Moon, Mercury, Venus, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto), the lunar nodes (North Node, South Node), Chiron, or Black Moon Lilith (the mean lunar apogee). The nodes follow the request `nodeType`, which defaults to the true (osculating) node; pass "mean" for the smoothed node. The two differ by up to about 1.8 degrees and no other body is affected.
        longitude:
          type: number
          minimum: 0
          maximum: 360
          example: 112.45
          description: Tropical ecliptic longitude in degrees (0-360). Primary coordinate for zodiac sign and aspect calculations.
        latitude:
          type: number
