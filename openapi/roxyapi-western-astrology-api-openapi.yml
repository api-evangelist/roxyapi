            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  example: '2025-12-18'
                  description: Target date for planetary positions in YYYY-MM-DD format. Use current date for transit positions, or any historical/future date for research. Planets move daily, so this date determines their zodiac positions.
                time:
                  type: string
                  format: time
                  example: '12:00:00'
                  description: Time in 24-hour HH:MM:SS format for precise calculations. Moon moves ~13° per day, so time matters for accurate lunar position. Use 12:00:00 (noon) as default if exact time not needed.
                nodeType:
                  type: string
                  enum:
                  - mean
                  - 'true'
                  default: 'true'
                  example: 'true'
                  description: Lunar node convention. "mean" is the smoothed average node, which always moves retrograde; "true" is the osculating node, which tracks the real perturbed node, oscillates up to about 1.5 degrees either side of the mean on a 173-day cycle, and can briefly turn direct. Neither is more correct and they almost always fall in the same sign. Applies to the North and South Node. True is the osculating node and the default, because it is what most Western chart software reports; mean is the smoothed node preferred by several evolutionary schools, so pass "mean" to match one. Nothing else in the chart changes, and the two agree on the sign except when the node sits within about 1.8 degrees of a cusp. Defaults to "true".
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                  example: 40.7128
                  description: Observer latitude in decimal degrees (-90 to 90). While planetary longitudes are geocentric (same worldwide), this is needed for house calculations if extending functionality. For basic ephemeris, use 0 as default.
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                  example: -74.006
                  description: Observer longitude in decimal degrees (-180 to 180). Used for precise local time conversion. For basic planetary positions, this has minimal impact but ensures accuracy.
                timezone:
                  anyOf:
                  - type: number
                    minimum: -14
                    maximum: 14
                  - type: string
                  description: Decimal hours from UTC (e.g. -5 for EST, 5.5 for IST, 9 for JST, 5.75 for NPT) OR IANA name (e.g. "America/New_York"). IANA resolved to the DST-correct offset for the chart date.
                  example: -5
              required:
              - date
              - time
              - latitude
              - longitude
              - timezone
      responses:
        '200':
          description: Planetary positions calculated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  planets:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          example: Sun
                          description: Planet name (Sun, Moon, Mercury, Venus, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto, North Node, South Node, Chiron, Black Moon Lilith). The lunar nodes are the mean node; software using the true node may show node positions up to 1.75 degrees different.
                        longitude:
                          type: number
                          example: 267.45
                          description: Tropical ecliptic longitude in degrees (0-360).
                        latitude:
                          type: number
                          example: 0.01
                          description: Ecliptic latitude in degrees.
                        sign:
                          type: string
                          example: Sagittarius
                          description: Tropical zodiac sign this planet occupies.
                        degree:
                          type: number
                          example: 27.45
                          description: Degree within the zodiac sign (0-29.999).
                        speed:
                          type: number
                          example: 0.9571
                          description: Daily motion in degrees per day. Negative values indicate retrograde.
                        isRetrograde:
                          type: boolean
                          example: false
                          description: Whether the planet is in apparent retrograde motion.
                        symbol:
                          type: string
                          example: ☉
                          description: Unicode astronomical symbol for this planet.
                        tagline:
                          type: string
                          example: Self-awareness & ego
                          description: Short tagline summarizing what this planet governs.
                        description:
                          type: string
                          example: The Sun represents your core identity, ego, and conscious will. It governs vitality, self-expression, and life purpose.
                          description: Brief description of this planet in astrological context.
                        keywords:
