                    description: Yearly health, energy, and wellness outlook.
                  finance:
                    type: string
                    example: Mars forms a semi-sextile to Neptune in May. Your second house is where earnings and belongings get counted, and their worth gets decided. Put the drive beside the pull toward what is not literal and neither reads the same afterwards. The two have almost nothing in common, and the mismatch registers as a small steady irritation.
                    description: Yearly financial outlook.
