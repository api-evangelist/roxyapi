      type: object
      properties:
        birthDetails:
          type: object
          properties:
            date:
              type: string
              example: '1990-07-15'
              description: Birth date used for this chart (YYYY-MM-DD).
            time:
              type: string
              example: '14:30:00'
              description: Birth time used for this chart (HH:MM:SS, 24-hour).
            latitude:
              type: number
              example: 40.7128
              description: Birth latitude in decimal degrees.
            longitude:
              type: number
              example: -74.006
              description: Birth longitude in decimal degrees.
            timezone:
              type: number
              example: -5
              description: Timezone offset from UTC in decimal hours.
          required:
          - date
          - time
          - latitude
          - longitude
          - timezone
          description: Birth details echoed back from the request. Confirms the input used for this chart calculation.
        planets:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Sun
                description: Planet or point name (Sun, Moon, Mercury, Venus, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto, North Node, South Node, Chiron, Black Moon Lilith). Always English, whatever the lang parameter says, so it stays safe to compare against in code. Use nameLocalized for anything a reader sees. The lunar nodes are the mean node; software using the true node may show node positions up to 1.75 degrees different.
              nameLocalized:
                type: string
                example: Sol
                description: Planet or point name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
              longitude:
                type: number
                example: 112.45
                description: Tropical ecliptic longitude in degrees (0-360).
              latitude:
                type: number
                example: 0.01
                description: Ecliptic latitude in degrees.
              sign:
                type: string
                example: Cancer
                description: Tropical zodiac sign this planet occupies. Always English, whatever the lang parameter says, so it stays safe to compare against in code. Use signLocalized for anything a reader sees.
              signLocalized:
                type: string
                example: Cáncer
                description: Zodiac sign name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
              degree:
                type: number
                example: 22.45
                description: Degree within the zodiac sign (0-29.999).
              house:
                type: number
                example: 7
                description: House placement (1-12) based on the selected house system.
              speed:
                type: number
                example: 0.9571
                description: Daily motion in degrees per day. Negative values indicate retrograde.
              isRetrograde:
                type: boolean
                example: false
                description: Whether the planet is in retrograde motion.
              dignity:
                type: string
                enum:
                - domicile
                - exaltation
                - detriment
                - fall
                - peregrine
                example: domicile
                description: 'Essential dignity of this body in the sign it occupies: domicile (the sign it rules, its strongest placement), exaltation (honoured and amplified), detriment (opposite its rulership, where it struggles), fall (opposite its exaltation, where it is weakened), or peregrine (in none of its own dignity signs). Absent for the lunar nodes, Chiron and Black Moon Lilith, which rule no sign and therefore hold no dignity at all, so an absent field and peregrine are different answers. Derived by sign only, so triplicity, bounds and face are not considered. Always English, whatever the lang parameter says, so it stays safe to compare against in code. The four dignity signs behind it are published per body by GET /planet-meanings/{id}.'
              interpretation:
                type: object
                properties:
                  summary:
                    type: string
                    description: One-sentence interpretation of this planet in its sign and house placement.
                    example: Your Sun in Cancer in The Seventh House reveals how you express self-awareness and ego in the realm of partnerships.
                  detailed:
                    type: string
                    description: Multi-sentence detailed interpretation with personality insights.
                    example: Sun represents self-awareness and ego. In Cancer, this energy becomes nurturing, protective, emotionally intelligent...
                  keywords:
                    type: array
                    items:
                      type: string
                    description: Key personality traits and themes for this placement.
                    example:
                    - Nurturing
                    - Protective
                    - Emotional
                    - Intuitive
                    - Home-oriented
                required:
                - summary
                - detailed
                - keywords
                description: Planet-in-sign-in-house interpretation. Narrative analysis of what this placement means in the natal chart.
            required:
            - name
            - longitude
            - latitude
            - sign
            - degree
            - house
            - speed
            - isRetrograde
          description: All 14 celestial bodies (10 classical planets, lunar nodes, Chiron, Black Moon Lilith) with zodiac signs, house placements, and interpretations.
        houses:
          type: array
          items:
            type: object
            properties:
              number:
                type: number
                example: 1
                description: House number (1-12).
              longitude:
                type: number
                example: 45.32
                description: Ecliptic longitude of this house cusp (0-360).
              sign:
                type: string
                example: Taurus
                description: Zodiac sign on this house cusp. Always English, whatever the lang parameter says. Use signLocalized for anything a reader sees.
              signLocalized:
                type: string
                example: Tauro
                description: Zodiac sign name on this cusp in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
              degree:
                type: number
                example: 15.32
                description: Degree within the zodiac sign (0-29.999).
            required:
            - number
            - longitude
            - sign
            - degree
          description: All 12 house cusps with zodiac positions. House cusps divide the chart into life areas.
        houseSystem:
          type: string
          example: placidus
          description: House system used for this chart (placidus, whole-sign, equal, or koch).
        aspects:
          type: array
          items:
            type: object
            properties:
              planet1:
                type: string
                example: Sun
                description: First planet in the aspect pair. Always English, whatever the lang parameter says. Use planet1Localized for anything a reader sees.
              planet1Localized:
                type: string
                example: Sol
                description: First planet name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
              planet2:
                type: string
                example: Moon
                description: Second planet in the aspect pair. Always English, whatever the lang parameter says. Use planet2Localized for anything a reader sees.
              planet2Localized:
                type: string
                example: Luna
                description: Second planet name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
              type:
                type: string
                example: TRINE
                description: Aspect type (CONJUNCTION, OPPOSITION, TRINE, SQUARE, SEXTILE, etc.). Always English, whatever the lang parameter says. Use typeLocalized for anything a reader sees.
              typeLocalized:
                type: string
                example: Trígono
                description: Aspect type name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
              angle:
                type: number
                example: 120
                description: Exact angle of this aspect type in degrees.
              orb:
                type: number
                example: 2.5
                description: Distance from exact aspect in degrees. Tighter orb means stronger influence.
              isApplying:
                type: boolean
                example: true
                description: Whether the aspect is applying (growing stronger) or separating (fading).
              strength:
                type: number
                example: 75
                description: Aspect strength percentage (0-100) based on orb tightness.
              interpretation:
                type: string
                example: harmonious
                description: 'Aspect nature: harmonious, challenging, or neutral. Always English, whatever the lang parameter says, because it is an identifier to compare and style on. Read aspectInterpretation for the sentence a reader sees.'
              aspectInterpretation:
                type: object
                properties:
                  summary:
                    type: string
                    example: Your Sun forms a very strong conjunction (0) with Jupiter, currently separating (weakening). This neutral aspect creates Planets and points that form a conjunction are energies that are united. They are blended; therefore...
                    description: 'One-sentence read of THIS pair: which two bodies, how tight the aspect is, whether it is applying or separating, and how it is classified. Translated in place, so it arrives in the requested language.'
                  keywords:
                    type: array
                    items:
                      type: string
                    example:
                    - blend
                    - difficult
                    - unite
                    - united
                    description: Themes this aspect activates between the two bodies. Translated in place, so they arrive in the requested language.
                required:
                - summary
                - keywords
                description: Narrative interpretation of this aspect for this chart. The reference description of the aspect TYPE is not repeated per row, use GET or POST /astrology/aspects for that card.
            required:
            - planet1
            - planet2
            - type
            - angle
            - orb
            - isApplying
            - strength
            - interpretation
            - aspectInterpretation
          description: All planetary aspects found in this chart with orbs, strength, and interpretation.
        patterns:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - GRAND_TRINE
                - KITE
                - T_SQUARE
                - GRAND_CROSS
                - YOD
                - MYSTIC_RECTANGLE
                - STELLIUM
                example: GRAND_TRINE
                description: Pattern kind identifier. GRAND_TRINE (3 trines, harmonious flow), KITE (Grand Trine with a focal outlet planet), T_SQUARE (opposition with squared apex, growth engine), GRAND_CROSS (4 planets in 2 oppositions and 4 squares, peak tension), YOD (Finger of Fate, fated adjustment), MYSTIC_RECTANGLE (oppositions softened by trines and sextiles), STELLIUM (3+ planets clustered in a sign or 10-degree arc).
              name:
                type: string
                example: Grand Trine
                description: Human-readable name of the configuration as used in astrological literature.
              planets:
                type: array
                items:
                  type: string
                example:
                - Sun
                - Moon
                - Mars
                description: Participating bodies in canonical order. For Kite, T-Square, and Yod the apex planet appears first.
              apex:
                type: string
                example: Mars
                description: Focal planet for Kite, T-Square, and Yod patterns. Receives the released energy of the configuration and is the recommended integration point.
              element:
                type: string
                enum:
                - fire
                - earth
                - air
                - water
                example: water
                description: Dominant element when the pattern is element-coherent (Grand Trine, Kite). Reported lowercase. Absent for patterns whose meaning does not pivot on element.
              modality:
                type: string
                enum:
                - cardinal
                - fixed
                - mutable
                example: cardinal
                description: Dominant modality for tension-based patterns (T-Square, Grand Cross). Cardinal initiates, Fixed sustains, Mutable adapts.
              dissociate:
                type: boolean
                example: false
                description: True if the pattern is out-of-sign (one or more planets in a neighboring element or modality). Dissociate patterns are still valid but operate with weakened thematic coherence.
              tightness:
                type: number
                minimum: 0
                maximum: 100
                example: 78
                description: Tightness score (0-100) derived from the average orb tightness across all defining aspects. Higher means closer to exact and stronger thematic expression.
              interpretation:
                type: string
                example: Grand Trine in Water signs binds Sun, Moon, and Mars in flowing harmony, gifts that come easily but ask to be activated.
                description: Concise one-line interpretation naming the participating planets and theme. Localized to the requested language via the lang query parameter (defaults to English).
              interpretationKey:
                type: string
                example: aspectPattern.grandTrine
                description: Stable template identifier used to render the interpretation. Useful for clients that wish to swap in a custom narrative template while preserving the structured variables.
              interpretationVars:
                type: object
                additionalProperties:
                  type: string
                  example: Water
                  description: 'One value interpolated into the interpretation template, keyed by the placeholder name it fills. Which keys are present depends on the pattern: a Grand Trine carries an element plus three planets, a T-Square carries an apex.'
                example:
                  element: Water
                  planet1: Sun
                  planet2: Moon
                  planet3: Mars
                description: Variables that were interpolated into the interpretation template. Names already resolved to the requested language where appropriate.
            required:
            - kind
            - name
            - planets
            - tightness
            - interpretation
            - interpretationKey
            - interpretationVars
          description: Detected multi-planet aspect configurations (Grand Trine, Kite, T-Square, Grand Cross, Yod, Mystic Rectangle, Stellium). Grand Cross suppresses contained T-Squares, Kite suppresses underlying Grand Trine.
        aspectsInterpretation:
          type: object
          properties:
            summary:
              type: string
              description: Narrative summary of the overall aspect pattern in this chart.
              example: 'Your chart contains 15 aspects: 8 harmonious, 5 challenging, and 2 neutral. This creates a harmonious overall pattern.'
            dominant:
              type: string
              example: harmonious
              description: Whether the chart is predominantly harmonious, challenging, or balanced.
            harmonious:
              type: number
              example: 8
              description: Count of harmonious aspects (trine, sextile).
            challenging:
              type: number
              example: 5
              description: Count of challenging aspects (square, opposition).
            neutral:
              type: number
              example: 2
              description: Count of neutral aspects (conjunction).
          required:
          - summary
          - dominant
          - harmonious
          - challenging
          - neutral
          description: Aspect pattern analysis showing the balance of harmonious vs challenging energies in the chart.
        ascendant:
          type: object
          properties:
            sign:
              type: string
              example: Taurus
              description: Zodiac sign on the Ascendant (rising sign). Always English, whatever the lang parameter says. Use signLocalized for anything a reader sees.
            signLocalized:
              type: string
              example: Tauro
              description: Ascendant sign name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
            degree:
              type: number
              example: 15.32
              description: Degree within the Ascendant sign (0-29.999).
            longitude:
              type: number
              example: 45.32
              description: Absolute ecliptic longitude of the Ascendant (0-360).
          required:
          - sign
          - degree
          - longitude
          description: Ascendant (rising sign). The eastern horizon at birth, defining outward personality and physical appearance.
        midheaven:
          type: object
          properties:
            sign:
              type: string
              example: Aquarius
              description: Zodiac sign on the Midheaven (MC). Always English, whatever the lang parameter says. Use signLocalized for anything a reader sees.
            signLocalized:
              type: string
              example: Acuario
              description: Midheaven sign name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
            degree:
              type: number
              example: 8.76
              description: Degree within the Midheaven sign (0-29.999).
            longitude:
              type: number
              example: 308.76
              description: Absolute ecliptic longitude of the Midheaven (0-360).
          required:
          - sign
          - degree
          - longitude
          description: Midheaven (MC). The highest point of the ecliptic at birth, representing career direction and public image.
        partOfFortune:
          type: object
          properties:
            sign:
              type: string
              example: Aries
              description: Zodiac sign holding the Part of Fortune.
            degree:
              type: number
              minimum: 0
              maximum: 30
              example: 27.24
              description: Degree within the Part of Fortune sign (0-29.999).
            longitude:
              type: number
              minimum: 0
              maximum: 360
              example: 27.24
              description: Absolute ecliptic longitude of the Part of Fortune (0-360).
            house:
              type: integer
              minimum: 1
              maximum: 12
              example: 8
              description: 'House containing this point, resolved against the same cusps as `planets[].house` and using the requested house system. Read this field rather than inferring a house from the sign: the two disagree whenever a house spans more than one sign, which is most of the time outside Whole Sign.'
            sect:
              type: string
              enum:
              - day
              - night
              example: night
              description: Chart sect used for the calculation. Day (diurnal) when the Sun is above the horizon, night (nocturnal) when below. Day charts use Ascendant plus Moon minus Sun, night charts use Ascendant plus Sun minus Moon.
            signLocalized:
              type: string
              example: Leo
              description: Part of Fortune sign name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
          required:
          - sign
          - degree
          - longitude
          - house
          - sect
          description: Part of Fortune (Lot of Fortune). A point derived from the Ascendant and the two luminaries that marks an area of ease, vitality, and material wellbeing in the chart.
        vertex:
          type: object
          properties:
            sign:
              type: string
              example: Virgo
              description: Zodiac sign holding the Vertex.
            degree:
              type: number
              minimum: 0
              maximum: 30
              example: 12.9
              description: Degree within the Vertex sign (0-29.999).
            longitude:
              type: number
              minimum: 0
              maximum: 360
              example: 162.9
              description: Absolute ecliptic longitude of the Vertex (0-360).
            house:
              type: integer
              minimum: 1
              maximum: 12
              example: 6
              description: 'House containing this point, resolved against the same cusps as `planets[].house` and using the requested house system. Read this field rather than inferring a house from the sign: the two disagree whenever a house spans more than one sign, which is most of the time outside Whole Sign.'
            signLocalized:
              type: string
              example: Cáncer
              description: Vertex sign name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
          required:
          - sign
          - degree
          - longitude
          - house
          description: Vertex. The western intersection of the prime vertical with the ecliptic, often read as a point of fated encounters and turning-point relationships. The opposite point is the Anti-Vertex.
        summary:
          type: object
          properties:
            dominantElement:
              type: string
              example: Water
              description: Most represented element in the chart (Fire, Earth, Air, Water). Always English, whatever the lang parameter says. Use dominantElementLocalized for anything a reader sees.
            dominantElementLocalized:
              type: string
              example: Agua
              description: Element name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
            dominantModality:
              type: string
              example: Cardinal
              description: Most represented modality in the chart (Cardinal, Fixed, Mutable). Always English, whatever the lang parameter says. Use dominantModalityLocalized for anything a reader sees.
            dominantModalityLocalized:
              type: string
              example: Cardinal
              description: Modality name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
            retrogradePlanets:
              type: array
              items:
                type: string
              example:
              - Mercury
              - Saturn
              description: Planets in retrograde motion at the time of birth. Always English, whatever the lang parameter says. Use retrogradePlanetsLocalized for anything a reader sees.
            retrogradePlanetsLocalized:
              type: array
              items:
                type: string
              example:
              - Mercurio
              - Saturno
              description: The same retrograde bodies in the requested language, for display only. Index aligned with retrogradePlanets, so entry n of one names entry n of the other. Present only when lang is set to a language other than English, since in English it would repeat retrogradePlanets exactly.
            elementDistribution:
              type: object
              additionalProperties:
                type: number
                example: 3
                description: Number of planets placed in this element (Fire, Earth, Air, Water). Read the four counts together to spot an emphasis or a missing element.
              example:
                Fire: 2
                Earth: 3
                Air: 1
                Water: 4
              description: Count of planets in each element. Shows elemental emphasis in the personality.
            modalityDistribution:
              type: object
              additionalProperties:
                type: number
                example: 4
                description: Number of planets placed in this modality (Cardinal, Fixed, Mutable). The largest count is the dominant operating mode.
              example:
                Cardinal: 4
                Fixed: 3
                Mutable: 3
              description: Count of planets in each modality. Shows the dominant operating mode.
          required:
          - dominantElement
          - dominantModality
          - retrogradePlanets
          - elementDistribution
          - modalityDistribution
          description: Chart summary with dominant element, modality, retrograde planets, and distribution analysis.
      required:
      - birthDetails
      - planets
      - houses
      - houseSystem
      - aspects
      - aspectsInterpretation
      - ascendant
      - midheaven
      - partOfFortune
      - vertex
      - summary
    LilithResponse:
      type: object
      properties:
        birthDetails:
          type: object
          properties:
            date:
              type: string
              format: date
              example: '1990-07-15'
              description: Birth date in YYYY-MM-DD format. Determines planetary positions for the specific calendar day.
            time:
              type: string
              format: time
              example: '14:30:00'
              description: Birth time in 24-hour HH:MM:SS format. Determines the Ascendant (rising sign) and house cusps. Use 12:00:00 if unknown.
            latitude:
              type: number
              minimum: -90
              maximum: 90
              example: 40.7128
              description: Birth location latitude in decimal degrees (-90 to 90). Positive = North, negative = South.
            longitude:
              type: number
              minimum: -180
              maximum: 180
              example: -74.006
              description: Birth location longitude in decimal degrees (-180 to 180). Positive = East, negative = West.
            timezone:
              type: number
              minimum: -12
              maximum: 14
              example: -5
              description: 'Timezone offset from UTC in decimal hours. Examples: New York = -5, London = 0, India = 5.5, Tokyo = 9.'
          required:
          - date
          - time
          - latitude
          - longitude
          - timezone
          description: Echo of the birth moment and place used to compute both Lilith variants.
        houseSystem:
          type: string
          enum:
          - placidus
          - whole-sign
          - equal
          - koch
          example: placidus
          description: House system applied when placing each variant in a house.
        lilith:
          type: array
          items:
            type: object
            properties:
              variant:
                type: string
                enum:
                - mean
                - 'true'
                example: mean
                description: Which lunar apogee this entry describes. The mean variant is the smoothed average apogee; the true variant is the instantaneous osculating apogee. Always one of these two English literals, whatever the lang parameter says, so it stays safe to compare against in code. Use variantLocalized for anything a reader sees.
              variantLocalized:
                type: string
                example: media
                description: Apogee variant label in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
              longitude:
                type: number
                minimum: 0
                maximum: 360
                example: 140.58
                description: Absolute tropical ecliptic longitude of the apogee in degrees (0 to 360).
              latitude:
                type: number
                example: -0.66
                description: Ecliptic latitude in degrees, the projection of the apogee off the ecliptic plane. Reaches up to about 5 degrees because the lunar orbit is inclined.
              sign:
                type: string
                example: Leo
                description: Tropical zodiac sign the apogee falls in, naming where the suppressed instinct lives.
              degree:
                type: number
                minimum: 0
                maximum: 30
                example: 20.58
                description: Degree of the apogee within its zodiac sign (0 to 29.999).
              house:
                type: integer
                minimum: 1
                maximum: 12
                example: 7
                description: House placement (1 to 12) in the selected house system, the area of life where the Lilith theme plays out.
              speed:
                type: number
                example: 0.1108
                description: Daily motion in degrees per day. The mean apogee is always positive (direct); the true apogee can be negative (retrograde).
              isRetrograde:
                type: boolean
                example: false
                description: Whether the apogee is moving backward. Always false for the mean apogee; the true apogee turns retrograde when the osculating ellipse swings the apogee direction backward.
              interpretation:
                type: string
                example: Your mean Black Moon Lilith in Leo marks where you meet the wild, untamed, and unapologetic in yourself, the instincts you were taught to suppress and the line past which you refuse to be tamed or shamed.
                description: Plain language meaning of this Lilith variant in its sign, suitable for chart reports and AI agents. Localized to the requested language.
              note:
                type: string
                example: The mean apogee is the smoothed average position, steadier and the most widely used for psychological reading.
                description: Short explanation of how this variant is defined and how it differs from the other, localized to the requested language.
            required:
            - variant
            - longitude
            - latitude
            - sign
            - degree
            - house
            - speed
            - isRetrograde
            - interpretation
            - note
          description: Both Black Moon Lilith variants, the mean lunar apogee first and the true (osculating) apogee second.
        summary:
          type: string
          example: 'Black Moon Lilith for 1961-08-04: mean apogee in Leo and true osculating apogee in Leo, each with sign, degree, house, and interpretation.'
          description: Short overview of both variants for previews and report intros.
      required:
      - birthDetails
      - houseSystem
      - lilith
      - summary
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your API key for accessing RoxyAPI. Alternatively, you can pass the API key as a query parameter "api_key".
externalDocs:
  description: Complete API Documentation with Examples
  url: https://roxyapi.com/docs
