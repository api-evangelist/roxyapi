  /astrology/horoscope/{sign}/daily:
    get:
      operationId: getDailyHoroscope
      tags:
      - Western Astrology
      summary: Daily horoscope by zodiac sign - Transit-based editorial columns
      description: A publish-ready column for any zodiac sign, built from the dated transits over it and returned with those events for fact-checking. The reading names the aspects, sign ingresses, lunations and retrograde stations driving it and reads each into the whole-sign houses of that sign, so every sign gets different content rather than one blurb reused twelve times. Alongside the column come overview, love, career, health, finance and advice, the active transits, Moon sign and phase, an energy rating, lucky number and color, and compatible signs. No language model is involved, so a given sign and date always returns the same text and a piece scheduled months ahead is the piece that runs. Content rolls over at midnight, by default UTC. Pass date for editorial scheduling, or timezone to roll over on a local clock. Available in eight languages. Daily horoscope API, zodiac forecast, sun sign horoscope, astrology prediction.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - aries
          - taurus
          - gemini
          - cancer
          - leo
          - virgo
          - libra
          - scorpio
          - sagittarius
          - capricorn
          - aquarius
          - pisces
          description: Zodiac sign, case-insensitive (e.g., aries, Aries, ARIES all work).
          example: aries
        required: true
        description: Zodiac sign, case-insensitive (e.g., aries, Aries, ARIES all work).
        name: sign
        in: path
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      - schema:
          type: string
          format: date
          example: '2026-04-03'
          description: Forecast date in YYYY-MM-DD format. Past and future dates are both supported, for editorial scheduling and backfill. Defaults to the current period in the timezone parameter.
        required: false
        description: Forecast date in YYYY-MM-DD format. Past and future dates are both supported, for editorial scheduling and backfill. Defaults to the current period in the timezone parameter.
        name: date
        in: query
      - schema:
          type: string
          example: America/New_York
          description: Selects which period counts as current when date is omitted. Defaults to UTC, so the forecast rolls over at 00:00 UTC on each day. Pass the timezone of the end user to roll over on their local clock instead. Ignored when date is set. Accepts an IANA name (e.g. "America/New_York"), decimal hours (e.g. 5.5 for IST), or a fixed UTC offset (e.g. "-05:00").
        required: false
        description: Selects which period counts as current when date is omitted. Defaults to UTC, so the forecast rolls over at 00:00 UTC on each day. Pass the timezone of the end user to roll over on their local clock instead. Ignored when date is set. Accepts an IANA name (e.g. "America/New_York"), decimal hours (e.g. 5.5 for IST), or a fixed UTC offset (e.g. "-05:00").
        name: timezone
        in: query
      responses:
        '200':
          description: Daily horoscope retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  sign:
                    type: string
                    example: Aries
                    description: Zodiac sign for this horoscope.
                  date:
                    type: string
                    example: '2026-04-03'
                    description: Date of this daily horoscope (YYYY-MM-DD).
                  overview:
                    type: string
                    example: Saturn teaches Aries through focused effort today. What feels heavy now becomes your greatest strength later. Trust the process of mastery and keep showing up.
                    description: General daily overview based on Moon house activation and planetary transits. Unique per sign based on whole-sign house positions.
                  love:
                    type: string
                    example: Venus in your sixth house shows love through acts of service. Small gestures of care mean more than grand declarations. Health-focused activities with a partner strengthen your bond.
                    description: Love and relationship forecast. Based on Venus house position relative to this sign, providing unique guidance per sign.
                  career:
                    type: string
                    example: Take responsibility seriously at work. Hard work brings lasting results, even when progress feels invisible. Your reliability earns respect.
                    description: Career and professional outlook. Based on Mars house position relative to this sign, with Saturn and Jupiter influences.
                  health:
                    type: string
                    example: The Sun in your fifth house connects vitality with joy and self-expression. Physical play, creative movement, and laughter are the best medicine today.
                    description: Health, energy, and wellness guidance for the day.
                  finance:
                    type: string
                    example: Jupiter in your fifth house brings financial luck through creative ventures and speculative risks. Hobbies could become income sources.
                    description: Financial outlook and money-related guidance.
                  advice:
                    type: string
                    example: Mercury in your fourth house turns attention to family conversations and household planning. Important discussions about home life go well.
                    description: Actionable daily advice based on the dominant transit energy.
                  column:
                    type: string
                    example: Mercury trines Jupiter today. Your twelfth house of solitude and inner reflection takes the weight of it. The working mind is set against the impulse to expand here. A talent that costs nothing tends to get spent on nothing in particular. Alongside that, the Sun forms a semi-square to Uranus today, sitting in your first house. Between the will and the break in the pattern, the difference is the whole story. Acting early is what this angle rewards, since the cost of waiting compounds quietly. Start with a plain account of what is actually wanted. Your first house of identity and self-expression is held by Neptune in Aries, and the first impression gets made before anything has been explained. If only one thing gets done, make it the quiet hour taken deliberately rather than stolen.
                    description: 'The full column for this period, ready to run as one piece, with paragraphs separated by a blank line. Names the events driving it and the dates they fall on, read into the whole-sign houses of this sign. Typically 120 to 180 words. The six section fields are the same reading split by topic, so render either shape and never both. Deterministic: the same sign and period always returns the same column.'
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - aspect
                          - sign-ingress
                          - retrograde-station
                          - lunar-phase
                          - eclipse
                          - solar-season
                          example: aspect
                          description: Kind of event. aspect is an exact angle between two moving bodies, sign-ingress a body entering a new sign, retrograde-station a body turning retrograde or direct, lunar-phase one of the four quarters, eclipse a solar or lunar eclipse, and solar-season the Sun entering a sign.
                        at:
                          type: string
                          example: '2026-04-03T11:27:57Z'
                          description: Exact instant the event perfects, UTC, to the second. Verifiable against NASA JPL Horizons for a position event and against the US Naval Observatory for a lunar phase or eclipse.
                        bodies:
                          type: array
                          items:
                            type: string
                          example:
                          - Mercury
                          - Jupiter
                          description: Bodies involved, canonical English regardless of the requested language so the value stays safe to switch on. Two entries for an aspect, faster body first. One entry for an ingress, a station, a lunar phase, or an eclipse.
                        aspect:
                          type: string
                          example: trine
                          description: 'Angle formed, on aspect events only: conjunction, sextile, square, trine, opposition, semi-sextile, quincunx, semi-square, or sesquiquadrate.'
                        sign:
                          type: string
                          example: libra
                          description: Sign the event falls in, lowercase, where it has exactly one. Absent for an aspect whose two bodies stand in different signs.
                        house:
                          type: integer
                          minimum: 1
                          maximum: 12
                          example: 12
                          description: Whole-sign house the event falls in, counted from the queried sign, 1 to 12. This is what turns one global sky event into a statement about this reader.
                        through:
                          type: string
                          example: '2026-04-11T02:28:12Z'
                          description: 'End of the window this event holds open, UTC, given only where a bounded window is a real fact about it: the orb span of an aspect, the sign span of an ingress or a season, the retrograde span of a station. Absent for a lunar phase or an eclipse, which are instants and not spans.'
                      required:
                      - type
                      - at
                      - bodies
                      - house
                    example:
                    - type: aspect
                      at: '2026-04-03T11:27:57Z'
                      bodies:
                      - Mercury
                      - Jupiter
                      aspect: trine
                      house: 12
                      through: '2026-04-11T02:28:12Z'
                    - type: aspect
                      at: '2026-04-03T15:18:11Z'
                      bodies:
                      - Sun
                      - Uranus
                      aspect: semi-square
                      house: 1
                      through: '2026-04-05T18:24:14Z'
                    description: The dated astronomical events this reading is built on, earliest first. Every field in every row can be checked against an independent authority, so a column can be fact-checked before it is published. Empty on a period in which nothing exact happens, where the reading falls back to the standing positions instead.
                  luckyNumber:
                    type: number
                    example: 8
                    description: Lucky number for the day, 1 to 9, from the traditional planetary number correspondence applied to the planet that governs this sign today. Not a random draw and not a function of the date.
                  luckyColor:
                    type: string
                    example: Red
                    description: Lucky color for the day, drawn from the three colors of the sign element and selected by the planet governing the reading.
                  compatibleSigns:
                    type: array
                    items:
                      type: string
                    example:
                    - Leo
