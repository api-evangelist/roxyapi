        timezone:
          type: number
          example: 0
          description: Timezone offset from UTC in hours used for this calculation.
        transitPlanets:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Sun
                description: Planet name (Sun, Moon, Mercury, Venus, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto, North Node, South Node, Chiron, Black Moon Lilith). Always English, whatever the lang parameter says, so it stays safe to compare against in code. Use nameLocalized for anything a reader sees. The lunar nodes are the mean node; software using the true node may show node positions up to 1.75 degrees different.
              nameLocalized:
                type: string
                example: Sol
                description: Planet name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
              longitude:
                type: number
                example: 267.45
                description: Tropical ecliptic longitude in degrees (0-360). Primary coordinate for sign and aspect calculation.
              latitude:
                type: number
                example: 0.01
                description: Ecliptic latitude in degrees. Near zero for most planets except Moon and Pluto.
              sign:
                type: string
                example: Sagittarius
                description: Tropical zodiac sign the planet currently occupies. Changes when longitude crosses a 30-degree boundary. Always English, whatever the lang parameter says. Use signLocalized for anything a reader sees.
              signLocalized:
                type: string
                example: Sagitario
                description: Zodiac sign name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
              degree:
                type: number
                example: 27.45
                description: Degree within the current zodiac sign (0-29.999). Indicates how far into the sign the planet has progressed.
              speed:
                type: number
                example: 0.9571
                description: Daily motion in degrees per day. Negative values indicate retrograde motion.
              isRetrograde:
                type: boolean
                example: false
                description: Whether the planet is currently in apparent retrograde motion. Retrograde transits are considered more introspective and revisionary.
            required:
            - name
            - longitude
            - latitude
            - sign
            - degree
            - speed
            - isRetrograde
          description: Current positions of all 14 celestial bodies (10 classical planets, lunar nodes, Chiron, Black Moon Lilith) in the tropical zodiac. Use for daily transit tracking, horoscope generation, and aspect monitoring.
        transitAspects:
          type: array
          items:
            type: object
            properties:
              transitPlanet:
                type: string
                example: Sun
                description: Transiting planet forming the aspect. Always English, whatever the lang parameter says. Use transitPlanetLocalized for anything a reader sees.
              transitPlanetLocalized:
                type: string
                example: Sol
                description: Transiting planet name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
              natalPlanet:
                type: string
                example: Mars
                description: Natal planet being aspected. Always English, whatever the lang parameter says. Use natalPlanetLocalized for anything a reader sees.
              natalPlanetLocalized:
                type: string
                example: Marte
                description: Natal planet name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
              type:
                type: string
                example: CONJUNCTION
                description: Aspect type (CONJUNCTION, OPPOSITION, TRINE, SQUARE, SEXTILE, etc.). Always English, whatever the lang parameter says. Use typeLocalized for anything a reader sees.
              typeLocalized:
                type: string
                example: Conjunción
                description: Aspect type name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
              angle:
                type: number
                example: 0
                description: Exact angle of this aspect type in degrees.
              orb:
                type: number
                example: 1.2
                description: Distance from exact aspect in degrees. Tighter orb = stronger influence.
              isApplying:
                type: boolean
                example: true
                description: Whether the transiting planet is moving toward exactitude (applying) or away from it (separating). Applying aspects grow stronger.
              strength:
                type: number
                example: 88
                description: Aspect strength percentage (0-100) based on orb tightness, where 100 is exact.
              nature:
                type: string
                example: neutral
                description: 'Aspect nature: harmonious (trine, sextile), challenging (square, opposition), or neutral (conjunction).'
              interpretation:
                type: object
                properties:
                  summary:
                    type: string
                    example: Sun activates your natal Mars neutrally
                    description: Narrative interpretation of what this transit aspect means and how it manifests.
                  timing:
                    type: string
                    example: Active for a few days
                    description: 'How long this transit influence lasts, localized. The bucket follows the speed of the transiting body: a few hours for the Moon, a few days for the Sun, Mercury, Venus and Mars, one to two weeks for Jupiter, several weeks for Saturn, and an extended period for Uranus, Neptune and Pluto.'
                  impact:
