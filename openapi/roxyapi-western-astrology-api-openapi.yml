      summary: Transit Aspects - Detailed transit-to-natal aspect analysis with interpretations
      description: Calculate all transit-to-natal aspects with detailed interpretations, strength ratings, and timing guidance. Compares current (or future) planetary positions against your natal chart to identify active transits. Returns aspect type, orb, applying/separating status, narrative interpretation, impact rating, and practical guidance for each transit. Supports planet and aspect-type filtering. More detailed than the /transits endpoint, adding AI-friendly interpretation fields. Transit aspects API, transit-to-natal analysis, predictive astrology, personalized transit forecast.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                natalChart:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                      example: '1990-07-15'
                      description: Birth date in YYYY-MM-DD format. Determines planetary positions for the specific calendar day.
                    time:
                      type: string
                      format: time
                      example: '14:30:00'
                      description: Birth time in 24-hour HH:MM:SS format. Determines the Ascendant (rising sign) and house cusps. Use 12:00:00 if unknown.
                    latitude:
                      type: number
                      minimum: -90
                      maximum: 90
                      example: 40.7128
                      description: Birth location latitude in decimal degrees (-90 to 90). Positive = North, negative = South.
                    longitude:
                      type: number
                      minimum: -180
                      maximum: 180
                      example: -74.006
                      description: Birth location longitude in decimal degrees (-180 to 180). Positive = East, negative = West.
                    timezone:
                      anyOf:
                      - type: number
                        minimum: -14
                        maximum: 14
                      - type: string
                      description: 'Timezone: IANA name (e.g. "America/New_York", "Europe/London") OR decimal hours from UTC (e.g. -5 for EST, 1 for CET). IANA strings are resolved to the DST-correct offset for the given date, so you can pass `cities[0].timezone` from /location/search directly.'
                      example: -5
                    nodeType:
                      type: string
                      enum:
                      - mean
                      - 'true'
                      default: 'true'
                      example: 'true'
                      description: Lunar node convention. "mean" is the smoothed average node, which always moves retrograde; "true" is the osculating node, which tracks the real perturbed node, oscillates up to about 1.5 degrees either side of the mean on a 173-day cycle, and can briefly turn direct. Neither is more correct and they almost always fall in the same sign. Applies to the North and South Node. True is the osculating node and the default, because it is what most Western chart software reports; mean is the smoothed node preferred by several evolutionary schools, so pass "mean" to match one. Nothing else in the chart changes, and the two agree on the sign except when the node sits within about 1.8 degrees of a cusp. Defaults to "true".
                  required:
                  - date
                  - time
                  - latitude
                  - longitude
                  - timezone
                  description: Natal chart birth details (date, time, location, timezone). Used to calculate natal planetary positions that transits are compared against.
                transitDate:
                  type: string
                  format: date
                  example: '2026-02-03'
                  description: Transit date in YYYY-MM-DD format. Defaults to current date if omitted. Use future dates for predictive transit analysis.
                transitTime:
                  type: string
                  format: time
                  example: '12:00:00'
                  description: Transit time in HH:MM:SS format. Defaults to 12:00:00 (noon) if omitted.
                planets:
                  type: array
                  items:
                    type: string
                    enum:
                    - Sun
                    - Moon
                    - Mercury
                    - Venus
                    - Mars
                    - Jupiter
                    - Saturn
                    - Uranus
                    - Neptune
                    - Pluto
                    - North Node
                    - South Node
                    - Chiron
                    - Black Moon Lilith
                  example:
                  - Jupiter
                  - Saturn
                  - Pluto
                  description: Filter to specific transiting planets. Omit to include all planets. Useful for focusing on slow-moving outer planet transits (Saturn, Jupiter, Pluto).
                aspectTypes:
                  type: array
                  items:
                    type: string
                    enum:
                    - CONJUNCTION
                    - OPPOSITION
                    - TRINE
                    - SQUARE
                    - SEXTILE
                    - SEMI_SEXTILE
                    - QUINCUNX
                    - SEMI_SQUARE
                    - SESQUIQUADRATE
                  example:
                  - CONJUNCTION
                  - OPPOSITION
                  - TRINE
                  - SQUARE
                  description: Filter to specific aspect types (conjunction, opposition, trine, square, sextile, etc.). Omit to include all aspect types.
                minStrength:
                  type: number
                  minimum: 0
                  maximum: 100
                  example: 50
                  description: Minimum aspect strength threshold (0-100). Higher values return only tighter, more potent aspects. Useful for filtering out wide-orb aspects.
                houseSystem:
                  type: string
                  enum:
                  - placidus
                  - whole-sign
                  - equal
                  - koch
                  default: placidus
                  example: placidus
                  description: House system used to divide the natal chart into 12 houses. Every house number in the response is read against these natal cusps, for the natal bodies and the transiting bodies alike. Placidus (default) is time sensitive and the most widely used in Western astrology. Whole Sign assigns one sign per house. Equal divides into 30 degree segments from the Ascendant. Koch emphasizes higher latitudes. Quadrant systems fall back to Whole Sign above the polar circle.
              required:
              - natalChart
      responses:
        '200':
          description: Transit aspects calculated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  transitDate:
                    type: string
                    example: '2026-02-03 12:00:00'
                    description: Date and time of the transit calculation.
                  houseSystem:
                    type: string
                    enum:
                    - placidus
                    - whole-sign
                    - equal
                    - koch
                    example: placidus
                    description: House system actually used for the natal cusps behind every house number in this response. Differs from the requested system only above the polar circle, where quadrant systems fall back to Whole Sign.
                  houses:
                    type: array
                    items:
                      type: object
                      properties:
                        number:
                          type: integer
                          minimum: 1
                          maximum: 12
                          example: 1
                          description: House number (1-12). Each house governs specific life themes in Western astrology.
                        longitude:
                          type: number
                          minimum: 0
                          maximum: 360
                          example: 45.32
                          description: Ecliptic longitude of this house cusp in degrees (0-360).
                        sign:
