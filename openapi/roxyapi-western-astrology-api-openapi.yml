                year:
                  type: integer
                  minimum: 1900
                  maximum: 2100
                  example: 2026
                  description: Year to scan for node passages (1900-2100).
                timezone:
                  anyOf:
                  - type: number
                    minimum: -14
                    maximum: 14
                  - type: string
                  default: 0
                  description: Timezone offset from UTC in hours. Crossing dates and times are reported in this zone. Defaults to 0 (UTC).
                  example: -5
              required:
              - year
      responses:
        '200':
          description: Node passages calculated successfully
          content:
            application/json:
              schema:
                type: object
