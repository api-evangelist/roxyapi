                    type: string
                    example: Neptune turns retrograde in July, so the effect shows in your first house of identity and self-expression. Translated into something doable, this comes to a plain account of what is actually wanted.
                    description: The single takeaway for the year, drawn from the event that leads it rather than stated in general terms.
                  column:
                    type: string
                    example: 'One thing outranks the rest here: Neptune leaves Pisces in January, reaching your twelfth house. A move this rare resets the terms of an area instead of shading them. Running with that, a solar eclipse falls in Aquarius in February, at the level of your eleventh house of friendships and future goals. A ring of light stays visible all the way around the covered disc. Acceleration is the whole signature here, and what gets accelerated is whatever was already moving. If one thing gets done in your eleventh house, make it the request put to the people who can actually answer it. A second thread runs through this, and Saturn meets Neptune in February, in your first house of identity and self-expression, where the first impression gets made before anything has been explained. Put the limit beside the pull toward what is not literal and neither reads the same afterwards. Fusion is the whole point, and what starts here starts with both of them behind it. Start with a plain account of what is actually wanted.


                      After that, the Sun leaves Pisces in March, with your twelfth house of solitude and inner reflection taking it. A season opens at this point, and it is the frame everything else gets read against. There is more, and it is that Saturn sextiles Pluto in March, sitting in your first house. An opportunity left alone at this angle does not turn into a problem, it simply expires. Next to that, Mars meets Neptune in April, and it registers in your first house. Objectivity is scarce at this angle, because neither half stands far enough back to be looked at.


                      Inside your first house, Neptune turns retrograde in July. Forward motion is not what this stretch is for, and forcing it spends the effort twice. In the same stretch, Uranus sextiles Neptune in July. That reaches your third house, where messages travel, and the short trip matters more than the long one. Visibility is the difference between this angle and an easier one, and the offer is on show. The useful move is toward the thing written out plainly and sent to the person who can act on it. Underneath that, Jupiter trines Neptune in July, and it registers in your fifth house of romance, creativity, and joy. Support of this kind arrives quietly and gets mistaken for the ordinary state of things. Going without the risk taken in the open instead of rehearsed in private costs more in your fifth house than it saves anywhere else.


                      Partway through that, Neptune sextiles Pluto in July, played out in your first house. The opening is real and it closes again unless somebody uses it. While that is still running, Saturn turns retrograde in July, arriving in your first house. Watch your fifth house for this one, because a solar eclipse falls in Leo in August. The disc is covered completely.


                      Because Mars trines Neptune in October, your fifth house is the part that moves. The ease here is real and largely unearned, which is why it so often goes unused. A second thread runs through this, and Saturn turns direct in December, at the level of your first house. Motion resumes from where it actually stopped, which is rarely where it was meant to have reached. Inside your first house, Neptune turns direct in December. What was held gets released here, though the backlog clears more slowly than the turn suggests. What is fixed here is Venus in Capricorn, landing in your tenth house of career and public image, over affection, taste, money spent on pleasure, and the terms people agree to. Get to the quiet hour taken deliberately rather than stolen, and the rest of your twelfth house follows.'
                    description: 'The full column for this period, ready to run as one piece, with paragraphs separated by a blank line. Names the events driving it and the dates they fall on, read into the whole-sign houses of this sign. Typically 600 to 900 words. The six section fields are the same reading split by topic, so render either shape and never both. Deterministic: the same sign and period always returns the same column.'
