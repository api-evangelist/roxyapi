  /astrology/aspects/monthly:
    post:
      operationId: getMonthlyTropicalAspects
      tags:
      - Western Astrology
      summary: Monthly Aspects - Tropical aspect calendar for an entire month
      description: 'Get every planetary aspect that perfects during a given month, across the 13 non-lunar Western bodies: the Sun and Mercury through Pluto, both lunar nodes, Chiron and Black Moon Lilith. Detects nine aspects, five major (conjunction, sextile, square, trine, opposition) and four minor (semi-sextile, semi-square, sesquiquadrate, quincunx), each with its own traditional orb, and returns the exact date and time of closest approach in your timezone along with the nature of the aspect. Calculated on tropical longitudes. The Moon is excluded because it forms hundreds of aspects a month and belongs in a daily view rather than a monthly one. Omit year and month to get the month in progress, so a published calendar stays current without a redeploy. Essential for monthly forecast copy, transit calendars, electional timing, and newsletter automation. Monthly aspect calendar API, exact aspect times, planetary aspect ephemeris, transit timing. Verified against NASA JPL Horizons.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                year:
                  type: integer
                  minimum: 1900
                  maximum: 2100
                  example: 2026
                  description: Year for the aspect calendar (1900-2100). Defaults to the current year (UTC).
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  example: 3
                  description: Month number (1-12). Defaults to the current month (UTC).
                timezone:
                  anyOf:
                  - type: number
                    minimum: -14
                    maximum: 14
                  - type: string
                  default: 0
                  description: Timezone offset from UTC in hours. Event dates and times are reported in this zone, which is what makes a published calendar read correctly for its audience. Defaults to 0 (UTC).
                  example: -5
                nodeType:
                  type: string
                  enum:
                  - mean
                  - 'true'
                  default: 'true'
                  example: 'true'
                  description: Lunar node convention. "mean" is the smoothed average node, which always moves retrograde; "true" is the osculating node, which tracks the real perturbed node, oscillates up to about 1.5 degrees either side of the mean on a 173-day cycle, and can briefly turn direct. Neither is more correct and they almost always fall in the same sign. Applies to the North and South Node. True is the osculating node and the default, because it is what most Western chart software reports; mean is the smoothed node preferred by several evolutionary schools, so pass "mean" to match one. Nothing else in the chart changes, and the two agree on the sign except when the node sits within about 1.8 degrees of a cusp. Defaults to "true".
      responses:
        '200':
          description: Monthly aspect calendar calculated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  year:
                    type: number
                    example: 2026
                    description: Year of the calendar. Echoes the year requested, or the current UTC year when it was omitted.
                  month:
                    type: number
                    example: 3
                    description: Month of the calendar. Echoes the month requested, or the current UTC month when it was omitted.
                  timezone:
                    type: number
                    example: -5
                    description: Timezone the event dates and times are reported in. Echoes the request.
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        planet1:
                          type: string
                          example: Mars
                          description: First body forming the aspect. Always canonical English whatever the lang parameter says, so it stays safe to compare against in code. Use planet1Localized for anything a reader sees.
                        planet1Localized:
                          type: string
                          example: Marte
                          description: First body in the requested language. Present only when lang is supplied.
                        planet2:
                          type: string
                          example: Saturn
                          description: Second body forming the aspect. Always canonical English.
                        planet2Localized:
                          type: string
                          example: Saturno
                          description: Second body in the requested language. Present only when lang is supplied.
                        aspect:
                          type: string
                          example: square
                          description: Aspect type, canonical English. One of conjunction (0 deg), semi-sextile (30 deg), semi-square (45 deg), sextile (60 deg), square (90 deg), trine (120 deg), sesquiquadrate (135 deg), quincunx (150 deg), opposition (180 deg).
                        aspectLocalized:
                          type: string
                          example: Cuadratura
                          description: Aspect name in the requested language. Present only when lang is supplied.
                        nature:
                          type: string
                          example: challenging
                          description: Whether the aspect is harmonious, challenging or neutral. Canonical English, so a calendar can colour or filter on it directly. natureLocalized carries the reader-facing form.
                        natureLocalized:
                          type: string
                          example: desafiante
                          description: Nature in the requested language. Present only when lang is supplied.
                        date:
                          type: string
                          example: '2026-03-15'
                          description: Date the aspect is closest to exact, in the requested timezone (YYYY-MM-DD).
                        time:
                          type: string
                          example: '14:32'
                          description: Time the aspect is closest to exact, in the requested timezone (HH:MM).
                        datetime:
                          type: string
                          example: 2026-03-15T14:32
                          description: Combined timestamp of closest approach, in the requested timezone.
                        orb:
                          type: number
                          example: 0.02
                          description: Distance from exact in degrees at the reported instant. Effectively zero for an aspect that perfects inside the month, and larger only where the pair turns before reaching exact.
                        separation:
                          type: number
                          example: 89.98
                          description: Actual angular separation between the two bodies in degrees at the reported instant, measured the short way round the circle.
                        planet1Longitude:
                          type: number
                          example: 15.4821
                          description: Tropical ecliptic longitude of the first body at the reported instant.
                        planet2Longitude:
                          type: number
                          example: 105.4632
                          description: Tropical ecliptic longitude of the second body at the reported instant.
                      required:
                      - planet1
                      - planet2
                      - aspect
                      - nature
                      - date
                      - time
                      - datetime
                      - orb
                      - separation
                      - planet1Longitude
                      - planet2Longitude
                    description: Every aspect event in the month, in chronological order across all body pairs.
