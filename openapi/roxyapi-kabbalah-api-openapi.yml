  /kabbalah/birth-profile:
    post:
      operationId: generateBirthProfile
      tags:
      - Kabbalah
      summary: Generate a birth profile - Hebrew birthday and birth angel API
      description: Return the Hebrew date of a birth, the Hebrew birthday that follows it, the three birth names of the Renaissance angel tradition and the sephirah of the birth day, from one birth moment. The Hebrew date is computed from the published calendar algorithm rather than looked up, the sunset boundary is a typed request field because it depends on where you were, and the two rival ways of dating the first name are a typed convention the response echoes. Built for Jewish culture and education apps, birth angel features and any product that wants the Hebrew birthday on the same key as the rest of its readings.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  example: '1990-06-15'
                  description: Birth date in YYYY-MM-DD, proleptic Gregorian. Dates before the 1582 reform are read on the same proleptic reckoning rather than switched to the Julian calendar.
                time:
                  type: string
                  format: time
                  example: '14:30:00'
                  description: Birth time in HH:MM:SS local to the timezone field. Defaults to noon when omitted, which is stated because the name read from the hour changes every twenty minutes and a defaulted time cannot be precise.
                timezone:
                  anyOf:
                  - type: number
                    minimum: -14
                    maximum: 14
                  - type: string
                  description: 'IANA name (e.g. "America/New_York", "Europe/London", "UTC"), decimal hours (e.g. -5 for EST, 1 for CET), or a fixed UTC offset (e.g. "-05:00", "+01:00"). Prefer the IANA name: it is resolved to the offset in force at the birth date and time, historical daylight-saving rules included, while a fixed offset or decimal is taken literally and will be wrong if it does not match the daylight-saving state at that moment. On a transition day a time in the repeated hour is read as its first occurrence and a time in the skipped hour is moved forward past the gap. Invalid timezones return 400 with a validation error.'
                  example: America/New_York
                angelDating:
                  type: string
                  enum:
                  - solar-longitude
                  - lenain-blocks
                  default: solar-longitude
                  example: solar-longitude
                  description: How the name of the day is found. Use solar-longitude for the exact five degree arc the Sun stood in at the birth moment, or lenain-blocks for the fixed civil calendar of five day periods. The Sun does not move at a constant rate, so the two drift apart by up to about three days by early August and were never reconciled.
                yearStart:
                  type: string
                  enum:
                  - march-21
                  - march-20
                  default: march-21
                  example: march-21
                  description: 'Which date the civil wheel of five day periods opens on. Both are conventions rather than facts: the equinox itself moves inside a window that covers both days, and it fell on 20 March in 2026. march-21 is the pinned published wheel and march-20 is that wheel shifted one day. Ignored when angelDating is solar-longitude.'
                leapDayPolicy:
                  type: string
                  enum:
                  - extend-previous
                  - next-angel
                  default: extend-previous
                  example: extend-previous
                  description: 'Where 29 February falls. The civil wheel was built for a 365 day year and has no slot for it, so published tables differ: extend-previous reads the day as part of the period ending 28 February, next-angel reads it as the opening of the period starting 1 March. Ignored when angelDating is solar-longitude.'
                afterSunset:
                  type: boolean
                  default: false
                  example: false
                  description: Set true when the moment falls after nightfall, which advances the Hebrew date by one day because the Hebrew day begins in the evening. It is a caller assertion rather than a computation, since sunset depends on a place and this conversion takes none.
              required:
              - date
              - timezone
      responses:
        '200':
          description: The Hebrew date, the birthday, the three names and the sephirah.
          content:
            application/json:
              schema:
                type: object
                properties:
                  birthData:
                    type: object
                    properties:
                      date:
                        type: string
                        example: '1990-06-15'
                        description: Echo of the birth date.
                      time:
                        type: string
                        example: '14:30:00'
                        description: The birth time used, which is noon when none was sent.
                      timezone:
                        type: number
                        example: 5.5
                        description: The timezone resolved to a decimal offset in hours. An IANA name sent on the request is resolved against the birth date, so a summer birth carries its summer offset.
                    required:
                    - date
                    - time
                    - timezone
                    description: The birth moment this answer was computed from.
                  hebrewDate:
                    type: object
                    properties:
                      year:
                        type: number
                        example: 5750
                        description: Hebrew year.
                      month:
                        type: string
                        example: Sivan
                        description: Hebrew month name. A leap year carries Adar I and Adar II in place of Adar, which is why the name is returned rather than only a number.
                      monthNumber:
                        type: number
                        example: 3
                        description: Month number in the published algorithm order, Nisan first. Adar II is 13.
                      day:
                        type: number
                        example: 22
                        description: Day of the Hebrew month, 1 to 30.
                      leapYear:
                        type: boolean
                        example: false
                        description: True in the seven years of each nineteen that carry a second Adar.
                      hebrew:
                        type: string
                        example: כ״ב בסיוון תש״נ
                        description: The date written the way it is printed, with the day and the year in Hebrew letters. Data, identical in every language.
                      afterSunset:
                        type: boolean
                        example: false
                        description: Echo of the sunset flag. The Hebrew day begins in the evening, so a moment after nightfall already belongs to the next date and this says whether that was applied.
                    required:
                    - year
                    - month
                    - monthNumber
                    - day
                    - leapYear
                    - hebrew
                    - afterSunset
                    description: The Hebrew date of the birth.
                  hebrewBirthday:
                    type: object
                    properties:
                      date:
                        type:
                        - string
                        - 'null'
                        example: '2026-06-08'
                        description: The next Gregorian date the Hebrew birthday falls on, or null when that Hebrew date does not exist in the year it would fall in.
                      hebrewYear:
                        type: number
                        example: 5786
                        description: The Hebrew year the anniversary was looked for in.
                      note:
                        type: string
                        example: That Hebrew date does not exist in the target year, so no anniversary is returned. Which day it moves to is a matter of practice and differs between communities.
                        description: Present only when the date is null, saying why. Absent otherwise, so a caller can branch on presence.
                    required:
                    - date
                    - hebrewYear
                    description: The next Hebrew birthday. Three Hebrew dates are missing from some years, and where the anniversary moves to is a matter of community practice rather than arithmetic, so the field is null with a note rather than a guess.
                  angels:
                    type: array
                    items:
                      type: object
                      properties:
                        role:
                          type: string
                          example: body
                          description: 'What this name is read from: body and character both come from the day of birth by two different cycles, and spirit comes from the hour. Always English, so it stays safe to compare against in code.'
                        number:
                          type: number
                          example: 27
                          description: Index of the name, 1 to 72.
                        name:
                          type: string
                          example: ירתאל
                          description: The name in Hebrew. Data, identical in every language.
                        romanization:
                          type: string
                          example: IRThAL
                          description: Latin transcription of the Hebrew, from the one mechanical letter map.
                        traditionalName:
                          type: string
                          example: Ierathel
                          description: The Latin spelling the published tables print, which is the searchable name.
                        choir:
                          type: string
                          example: Dominions
                          description: The angelic choir the name belongs to under the published Renaissance table.
                        window:
                          type: string
                          example: 130 to 135 degrees of ecliptic longitude, Leo 10 to Leo 15
                          description: 'The window that selected this name, in the terms of its own cycle: an arc of longitude, a span of civil days, or a twenty minute interval of the clock.'
                        reading:
                          type: string
                          example: The name governing the day of birth. In this lineage it is the first of three, and the tradition reads it as the one attached to the physical circumstances a person is born into.
                          description: What the tradition says this name is read for, in the requested language.
                      required:
                      - role
                      - number
                      - name
                      - romanization
                      - traditionalName
                      - choir
                      - window
                      - reading
                    description: 'The three names: two read from the day of birth by two different cycles, and one from the hour. All three are described, never invoked.'
                  sephirah:
                    type: object
                    properties:
                      id:
                        type: string
                        example: netzach
                        description: Machine identifier of the sephirah of the birth day.
                      number:
                        type:
                        - number
                        - 'null'
                        example: 7
                        description: Its position in the emanation, 1 to 10.
                      english:
                        type: string
                        example: Endurance
                        description: The English gloss of the name, in the requested language.
                      hebrew:
                        type: string
                        example: נֶצַח
                        description: The name in Hebrew. Data, identical in every language.
                      romanization:
                        type: string
                        example: NTzCh
                        description: Latin transcription of the Hebrew, from the mechanical letter map.
                      meaning:
                        type: string
                        example: Endurance, the impulse that keeps going after the first enthusiasm has gone. It sits low on the right hand pillar, close to where things actually get done.
                        description: What the emanation is said to hold, in the requested language.
                    required:
                    - id
                    - number
                    - english
                    - hebrew
                    - romanization
                    - meaning
                    description: The sephirah reached from the value of the Hebrew date written in letters. A numerical convention rather than a classical rule, offered as a way into the tree.
                  conventions:
                    type: object
                    properties:
                      angelDating:
                        type: string
                        example: solar-longitude
                        description: Which construction dated the name of the day.
                      yearStart:
                        type: string
                        example: march-21
                        description: Where the civil wheel opened. Reported even under solar-longitude, where it selects nothing, so a stored response records every input.
                      leapDayPolicy:
                        type: string
                        example: extend-previous
                        description: Where 29 February was read as falling.
                      afterSunset:
                        type: boolean
                        example: false
                        description: Whether the Hebrew date was advanced for nightfall.
                    required:
                    - angelDating
                    - yearStart
                    - leapDayPolicy
                    - afterSunset
                    description: The conventions this answer was computed under, echoed so it can be reproduced.
                required:
                - birthData
                - hebrewDate
                - hebrewBirthday
                - angels
                - sephirah
                - conventions
