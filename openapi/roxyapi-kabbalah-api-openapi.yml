                          type: array
                          items:
                            type: string
                          example:
                          - chesed
                          - gevurah
                          - tiferet
                          - netzach
                          - hod
                          - yesod
                          description: Which sephirot fall in this world under the Hermetic mapping, the one the world field on each sephirah uses.
                        sephirotAlternate:
                          type: array
                          items:
                            type: string
                          example:
                          - chesed
                          - gevurah
                          - tiferet
                          - netzach
                          - hod
                          - yesod
                          description: Which sephirot fall in this world under the second mapping in circulation. The two agree on Formation and Action and differ at the top, and neither is suppressed.
                      required:
                      - id
