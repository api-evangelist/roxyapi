                      rule:
                        type: string
                        example: 'Longest match first: every two letter group the table prints is read as one Hebrew letter before the single letters are tried.'
                        description: Why this spelling was chosen over the others.
                    required:
                    - hebrew
                    - romanization
                    - rule
                  values:
                    type: object
                    properties:
                      standard:
                        type: number
                        example: 505
                        description: Mispar hechrachi, the standard reading, where every letter takes its ordinary value and a final form scores as its base letter.
                      large:
                        type: number
                        example: 505
                        description: Mispar gadol under the reading the misparGadol convention selected, which is why the convention comes back on the response.
                      small:
                        type: number
                        example: 10
                        description: Mispar katan, where each letter value has its trailing zeros truncated, so yod is 1 and qof is 1.
                      preceding:
                        type: number
                        example: 1590
                        description: Mispar kidmi, where each letter scores the sum of every standard value up to and including itself, so tav is 1495.
                    required:
                    - standard
                    - large
                    - small
                    - preceding
                    description: The four readings a name profile leads with. Call the gematria endpoint for the full set and for the substitution transformations.
                  letters:
                    type: array
                    items:
                      type: object
                      properties:
                        glyph:
                          type: string
                          example: ש
                          description: The letter as it stands in the chosen spelling.
                        letterId:
                          type: string
                          example: shin
                          description: Machine identifier of the letter.
                        name:
                          type: string
                          example: Shin
                          description: Display name of the letter.
                        isFinal:
                          type: boolean
                          example: false
                          description: True when the glyph is the word final form.
                        value:
                          type: number
                          example: 300
                          description: What this letter contributed.
                      required:
                      - glyph
                      - letterId
                      - name
                      - isFinal
                      - value
                    description: The per letter breakdown of the chosen spelling.
                  sephirah:
                    type: object
                    properties:
                      id:
                        type: string
                        example: malkuth
                        description: Machine identifier of the sephirah the reduced value points at.
                      number:
                        type:
                        - number
                        - 'null'
                        example: 10
                        description: Its position in the emanation, 1 to 10.
                      english:
                        type: string
                        example: Kingdom
                        description: The English gloss of the name, in the requested language.
                      hebrew:
                        type: string
                        example: מַלְכוּת
                        description: The name in Hebrew. Data, identical in every language.
                      reduced:
                        type: number
                        example: 10
                        description: The standard value reduced by repeated digit sum, stopping at ten so all ten emanations stay reachable.
                      meaning:
                        type: string
                        example: Kingdom, the emanation that receives. It holds no light of its own in the classical reading, and its whole character is what it does with what arrives.
                        description: What the emanation is said to hold, in the requested language.
                      reading:
                        type: string
                        example: Reducing the standard value of שרה gives 10, which points at Kingdom on the tree.
                        description: The composed sentence that places the name on the tree, in the requested language. It states plainly that the reduction is a numerical convention rather than a classical rule.
                    required:
                    - id
                    - number
                    - english
                    - hebrew
                    - reduced
                    - meaning
                    - reading
                    description: Where the name lands on the tree. The reduction is a numerical convention, not a rule from any text, and the reading says so.
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: shalom
                          description: Machine identifier of the entry, an ASCII romanization.
                        hebrew:
                          type: string
                          example: שלום
                          description: The word in Hebrew. Data, identical in every language.
                        romanization:
                          type: string
                          example: ShLVM
                          description: Latin transcription of the Hebrew beside it, from the same mechanical letter map.
                        meaning:
                          type: string
                          example: peace
                          description: What the word means, in the requested language.
                        value:
                          type: number
                          example: 376
                          description: Its value under the standard reading, which is why it matched.
                        note:
                          type: string
                          example: Peace and the name Esau share a value, which the sources treat as a deliberate pairing.
                          description: What the tradition says about the equality, in the requested language.
                        sources:
                          type: array
                          items:
                            type: string
                          example:
                          - https://www.sefaria.org/Noam_Elimelekh%2C_Additions%2C_Likutei_Shoshana.61.1
                          description: Where the value is attested. Every entry in the lexicon carries at least two independent sources, which is why the list is short rather than long.
                      required:
                      - id
                      - hebrew
                      - romanization
                      - meaning
                      - value
                      - note
                      - sources
                    description: Curated words whose standard value equals the name. Empty when nothing matches, which is the ordinary case.
                  conventions:
