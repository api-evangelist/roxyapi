  /kabbalah/compatibility:
    post:
      operationId: calculateNameCompatibility
      tags:
      - Kabbalah
      summary: Compare two names - gematria name compatibility API with every component…
      description: Score two names against each other in gematria and return both profiles, the ciphers they agree on, and a composite with every component and its maximum published beside it. Equal value under the standard reading is the one relation the classical method actually works with and it carries the largest weight; the rest of the composite is ours and the response says so, so a caller can recompute or ignore it. Built for name compatibility features, relationship content and any product that wants a number it can show the arithmetic for.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: Sarah
                  description: First name in Latin script. Send firstNameHebrew instead to control the spelling.
                firstNameHebrew:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: שרה
                  description: First name already in Hebrew, which skips the transliteration step.
                secondName:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: David
                  description: Second name in Latin script. Send secondNameHebrew instead to control the spelling.
                secondNameHebrew:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: דוד
                  description: Second name already in Hebrew, which skips the transliteration step.
                transliteration:
                  type: string
                  enum:
                  - letter-map-mathers
                  - letter-map-modern
                  default: letter-map-mathers
                  example: letter-map-mathers
                  description: 'How a Latin name is written in Hebrew before it is scored. Two members. letter-map-mathers is the 1887 Hermetic letter map, with e read as its author practised it: a point inside a word and alef at the start of one. It writes no c, f, w or x, so a name carrying one of them outside a two letter group returns 400 naming the letter. letter-map-modern follows the modern Israeli transcription rules for the sound each Latin letter carries in English and French spelling, covers every Latin letter, drops the geresh and does not double vav or yod, so send textHebrew for the ktiv male form. Every form states the readings it used in rule. Phonetic Ashkenazi and Sephardi schemes are not offered because no two references agree on a rule for that direction.'
                misparGadol:
                  type: string
                  enum:
                  - finals-500-900
                  - milui
                  default: finals-500-900
                  example: finals-500-900
                  description: Which method the name mispar gadol means, because the sources use it for two. Use finals-500-900 to score the five word final letters as 500 to 900, or milui to score each letter as the value of its own spelled out name.
              example:
                firstName: Sarah
                secondName: David
              description: 'The two names to compare. Each side takes the Latin field or the Hebrew one, never both: which one you send decides whether a transliteration step runs for that side.'
      responses:
        '200':
          description: Both profiles, what they share, and the composite with its components.
          content:
            application/json:
              schema:
                type: object
                properties:
                  first:
                    type: object
                    properties:
                      input:
                        type: string
                        example: Sarah
                        description: The name as sent, in whichever script it was sent in.
                      hebrew:
                        type: string
                        example: שרה
                        description: The Hebrew spelling this side was scored from.
                      romanization:
                        type: string
                        example: ShRH
                        description: Latin transcription of that spelling, from the one mechanical letter map.
                      rule:
                        type: string
                        example: 'Longest match first: every two letter group the table prints is read as one Hebrew letter before the single letters are tried.'
                        description: Why this spelling was chosen over the other parses.
                      standard:
                        type: number
                        example: 505
                        description: Value under the standard reading, which is the relation the tradition works with.
                      reduced:
                        type: number
                        example: 10
                        description: The standard value reduced by repeated digit sum, stopping at ten.
                      sephirah:
                        type: string
                        example: malkuth
                        description: Machine identifier of the sephirah the reduced value points at.
                      sephirahEnglish:
                        type: string
                        example: Kingdom
                        description: The English gloss of that sephirah, in the requested language.
                    required:
                    - input
                    - hebrew
                    - romanization
                    - rule
                    - standard
                    - reduced
                    - sephirah
                    - sephirahEnglish
                  second:
                    type: object
                    properties:
                      input:
                        type: string
                        example: Sarah
                        description: The name as sent, in whichever script it was sent in.
                      hebrew:
                        type: string
                        example: שרה
                        description: The Hebrew spelling this side was scored from.
                      romanization:
                        type: string
                        example: ShRH
                        description: Latin transcription of that spelling, from the one mechanical letter map.
                      rule:
                        type: string
                        example: 'Longest match first: every two letter group the table prints is read as one Hebrew letter before the single letters are tried.'
                        description: Why this spelling was chosen over the other parses.
                      standard:
                        type: number
                        example: 505
                        description: Value under the standard reading, which is the relation the tradition works with.
                      reduced:
                        type: number
                        example: 10
                        description: The standard value reduced by repeated digit sum, stopping at ten.
                      sephirah:
                        type: string
                        example: malkuth
                        description: Machine identifier of the sephirah the reduced value points at.
                      sephirahEnglish:
                        type: string
                        example: Kingdom
                        description: The English gloss of that sephirah, in the requested language.
                    required:
                    - input
                    - hebrew
                    - romanization
                    - rule
                    - standard
                    - reduced
                    - sephirah
                    - sephirahEnglish
                  sharedValues:
                    type: array
                    items:
                      type: object
                      properties:
                        cipher:
                          type: string
                          example: mispar-katan
                          description: Machine identifier of the cipher the two names agree on.
                        name:
                          type: string
                          example: Mispar katan (small value)
                          description: Display name of that cipher.
                        value:
                          type: number
                          example: 10
                          description: The value both names give under it.
                      required:
                      - cipher
                      - name
                      - value
                    description: Every cipher on which the two names give the same number. Empty when they share none, which happens often and carries no traditional reading of its own.
                  score:
                    type: number
                    example: 45
                    description: 'The composite, 0 to 100. A RoxyAPI composite, not a classical measure: no source scores two names against each other, so the components below are published and the number is derivable from them.'
                  band:
                    type: string
                    example: moderate
                    description: 'Which band the composite falls in: high, moderate or low. Derived from the score, always English.'
                  components:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: equalStandardValue
                          description: Machine identifier of the component.
                        points:
                          type: number
                          example: 35
                          description: What this component contributed.
                        maximum:
                          type: number
                          example: 35
                          description: The most it can contribute. The four maxima sum to 100, so the weighting is visible rather than implied.
                        matched:
                          type: boolean
                          example: true
                          description: Whether the component found anything at all.
                      required:
                      - id
                      - points
                      - maximum
                      - matched
                    description: Every component of the composite with its own maximum, so a caller who disagrees with the weighting can recompute rather than argue.
                  reading:
                    type: string
                    example: The two names meet on some readings and part on others, which is the ordinary case rather than a middling result.
                    description: The composed reading, in the requested language. It states that the score is ours.
                  conventions:
                    type: object
                    properties:
                      transliteration:
                        type: string
                        example: letter-map-mathers
                        description: The Latin to Hebrew scheme applied. Absent when the caller sent Hebrew directly.
                      misparGadol:
                        type: string
                        example: finals-500-900
                        description: Which of the two published methods the name mispar gadol was read as.
                    required:
                    - misparGadol
                required:
                - first
                - second
                - sharedValues
                - score
                - band
                - components
                - reading
                - conventions
