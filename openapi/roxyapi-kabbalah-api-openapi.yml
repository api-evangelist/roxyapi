openapi: 3.2.0
info:
  title: Roxy Kabbalah API
  version: 2.0.0
  description: '# RoxyAPI: the Spiritual OS layer for agentic AI


    > **Base URL:** `https://roxyapi.com/api/v2`.'
  x-error-codes:
  - code: validation_error
    status: 400
    meaning: A field is missing or invalid. The body lists every failing field at once in issues, each with its path and the expected shape.
  - code: bad_request
    status: 400
    meaning: The request was rejected as a whole, for example a body that is not valid JSON or a date range that ends before it starts.
  - code: date_out_of_range
    status: 400
    meaning: A date lies outside the span the planetary positions are served for. The error names the supported dates.
  - code: api_key_required
    status: 401
    meaning: No API key was sent.
  - code: invalid_api_key
    status: 401
    meaning: The key sent is malformed or cannot be verified.
  - code: api_key_revoked
    status: 401
    meaning: The key was valid once and has since been revoked from the account page.
  - code: subscription_not_found
    status: 401
    meaning: The key verifies, but the subscription behind it no longer exists.
  - code: subscription_inactive
    status: 401
    meaning: The subscription behind the key is cancelled, expired or suspended, or a trial is past its end date.
  - code: publishable_key_not_allowed_on_mcp
    status: 401
    meaning: A publishable key was used on a Remote MCP server, which takes a secret key.
  - code: invalid_client_ip
    status: 401
    meaning: A keyless request could not be attributed to a caller.
  - code: unauthorized
    status: 401
    meaning: Authentication failed with no more specific reason to give.
  - code: forbidden
    status: 403
    meaning: The key is valid, but this request is not permitted.
  - code: origin_required
    status: 403
    meaning: A publishable key with an origin allowlist was used with no Origin header, as from a server or a native app.
  - code: origin_not_allowed
    status: 403
    meaning: The calling site is not on the origin allowlist of this publishable key.
  - code: not_found
    status: 404
    meaning: Nothing is served at this path, or the identifier in it does not exist. A path miss adds suggestions, the closest real endpoints.
  - code: method_not_allowed
    status: 405
    meaning: The path exists for a different HTTP method. The body lists the accepted methods in allow, as does the Allow header.
  - code: conflict
    status: 409
    meaning: The request cannot be applied in the current state.
  - code: gone
    status: 410
    meaning: The path was removed permanently.
  - code: payload_too_large
    status: 413
    meaning: The request body is larger than the API accepts.
  - code: unsupported_media_type
    status: 415
    meaning: 'A request with a body was sent without Content-Type: application/json.'
  - code: unprocessable_entity
    status: 422
    meaning: Every field is valid, but the combination cannot be computed.
  - code: rate_limit_exceeded
    status: 429
    meaning: The monthly request allowance is used up. Retry-After gives the seconds to the reset.
  - code: rate_limit_per_minute
    status: 429
    meaning: The per-minute limit of the plan was reached. Retry-After gives the seconds to the next minute, and the monthly allowance is not charged.
  - code: rate_limited
    status: 429
    meaning: A rate limit was reached, reported without the plan detail.
  - code: free_tier_exhausted
    status: 429
    meaning: A keyless request has used up its trial allowance.
  - code: internal_error
    status: 500
    meaning: The request failed inside our service. Retry with exponential backoff.
  - code: compute_saturated
    status: 503
    meaning: Heavy calculations are briefly at capacity. Send the same request again after Retry-After seconds.
  - code: error
    status: null
    meaning: A fallback for a status with no more specific code. The status and the error field carry the signal.
  contact:
    name: RoxyAPI Support
    url: https://roxyapi.com/contact
  license:
    name: Proprietary
    url: https://roxyapi.com/policy/terms
servers:
- url: https://roxyapi.com/api/v2
  description: Production API v2
security:
- apiKey: []
tags:
- name: Kabbalah
  description: Kabbalah API for gematria, the 72 names, the Tree of Life and the Hebrew birthday.
paths:
  /kabbalah/gematria:
    post:
      operationId: calculateGematria
      tags:
      - Kabbalah
      summary: Calculate gematria - Hebrew gematria calculator API with every spelling shown
      description: Score a Hebrew word or a Latin name across ten rabbinic gematria ciphers and two substitution transformations, with the per letter breakdown and the curated equal value matches beside each number. A Latin name has no single Hebrew spelling, so every candidate spelling the transliteration map produces comes back with its own values and the rule that produced it, and the chosen one is named. Built for name meaning features, numerology apps that want the Hebrew reading, and any product that has to show a reader why the number is what it is.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: Sarah
                  description: Latin text to write in Hebrew and then score, up to 200 characters. Non Latin scripts are folded to Latin first, so a Cyrillic or Devanagari name works. Send textHebrew instead to control the Hebrew spelling yourself.
                textHebrew:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: שלום
                  description: Hebrew text to score, up to 200 characters. Anything outside the Hebrew script is rejected. Vowel points, cantillation marks, maqaf and paseq are removed before scoring, so a pointed and an unpointed spelling of one word give the same number.
                transliteration:
                  type: string
                  enum:
                  - letter-map-mathers
                  - letter-map-modern
                  default: letter-map-mathers
                  example: letter-map-mathers
                  description: 'How a Latin name is written in Hebrew before it is scored. Two members. letter-map-mathers is the 1887 Hermetic letter map, with e read as its author practised it: a point inside a word and alef at the start of one. It writes no c, f, w or x, so a name carrying one of them outside a two letter group returns 400 naming the letter. letter-map-modern follows the modern Israeli transcription rules for the sound each Latin letter carries in English and French spelling, covers every Latin letter, drops the geresh and does not double vav or yod, so send textHebrew for the ktiv male form. Every form states the readings it used in rule. Phonetic Ashkenazi and Sephardi schemes are not offered because no two references agree on a rule for that direction.'
                ciphers:
                  type: array
                  items:
                    type: string
                    enum:
                    - mispar-hechrachi
                    - mispar-gadol
                    - otiyot-be-milui
                    - mispar-katan
                    - mispar-kidmi
                    - mispar-prati
                    - mispar-ha-merubah-ha-klali
                    - mispar-meshulash
                    - mispar-musafi
                    - kolel
                  example:
                  - mispar-hechrachi
                  - mispar-gadol
                  description: Which ciphers to return, by identifier. Omit for every computed cipher. Valid values are mispar-hechrachi, mispar-gadol, otiyot-be-milui, mispar-katan, mispar-kidmi, mispar-prati, mispar-ha-merubah-ha-klali, mispar-meshulash, mispar-musafi, kolel.
                misparGadol:
                  type: string
                  enum:
                  - finals-500-900
                  - milui
                  default: finals-500-900
                  example: finals-500-900
                  description: Which method the name mispar gadol means, because the sources use it for two. Use finals-500-900 to score the five word final letters as 500 to 900, or milui to score each letter as the value of its own spelled out name.
                atbashOutput:
                  type: string
                  enum:
                  - both
                  - string
                  - value
                  default: both
                  example: both
                  description: 'What AtBash and Albam return: the substituted Hebrew string, its standard value, or both. The biblical witness for AtBash is a substituted WORD rather than a number, which is why the string is available on its own.'
                includeMatches:
                  type: boolean
                  default: true
                  example: true
                  description: Whether to return the curated equal value entries for the chosen spelling. Set false to skip the lookup when only the numbers are wanted.
                latinCiphers:
                  type: boolean
                  default: false
                  example: false
                  description: Whether to also score the Latin text with the three Latin alphabet ciphers. They are Renaissance Christian and modern in lineage rather than rabbinic, and the response labels each one. Ignored when textHebrew was sent.
              example:
                text: Sarah
                ciphers:
                - mispar-hechrachi
                - mispar-gadol
              description: 'What to score and how. Send text for a Latin input or textHebrew for a Hebrew one, never both: which one you send decides whether a transliteration step runs at all. Every other field has a default.'
      responses:
        '200':
          description: Every candidate spelling with its values, the chosen one, and the matches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  input:
                    type: object
                    properties:
                      text:
                        type: string
                        example: Sarah
                        description: Echo of the Latin text sent. Absent when Hebrew was sent instead.
                      textHebrew:
                        type: string
                        example: שלום
                        description: Echo of the Hebrew text sent. Absent when Latin was sent instead.
                  hebrewForms:
                    type: array
                    items:
                      type: object
                      properties:
                        hebrew:
                          type: string
                          example: שרה
                          description: One Hebrew spelling the Latin input can be written as. Data, identical in every language.
                        romanization:
                          type: string
                          example: ShRH
                          description: Latin transcription of the Hebrew beside it, produced by one mechanical letter map. It is a label for reading the string back, never a pronunciation claim.
                        rule:
                          type: string
                          example: 'Longest match first: every two letter group the table prints is read as one Hebrew letter before the single letters are tried.'
                          description: 'Why this spelling came out of the map: the parse rule first, then one sentence for every reading the scheme applied that the letters alone would not show, so a caller can tell the parses apart.'
                        values:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: mispar-hechrachi
                                description: Machine identifier of the cipher. Call the ciphers endpoint for the definition, the tradition and the sources behind each one.
                              value:
                                type: number
                                example: 376
                                description: 'The number this cipher gives for the string. Always a number: the one catalogued cipher this API does not compute is absent from this array rather than present without a value, so no row here has to be guarded. Its catalogue entry carries computed false and says why.'
                              alternateValues:
                                type: array
                                items:
                                  type: number
                                example:
                                - 527
                                - 536
                                description: 'Other published totals for the same string, ascending. Present only where the cipher is not single valued: letter names have several accepted spellings, so several totals are equally published. Absent otherwise, so a caller can branch on presence.'
                              tradition:
                                type: string
                                example: rabbinic
                                description: Provenance class of the cipher, one of rabbinic, renaissance-latin, golden-dawn-transliterated or modern. Always English, so it stays safe to compare against in code.
                              source:
                                type: string
                                example: https://en.wikipedia.org/wiki/Gematria
                                description: The first published source this cipher was taken from.
                            required:
                            - id
                            - value
                            - tradition
                            - source
                          description: 'Every computed cipher applied to this spelling, in catalogue order. The rows carry no display name, because they are the same ciphers in the same order for every spelling: read the names off the top level values array once.'
                        letters:
                          type: array
                          items:
                            type: object
                            properties:
                              glyph:
                                type: string
                                example: ש
                                description: The Hebrew letter as it stands in the string. Data, identical in every language.
                              letterId:
                                type: string
                                example: shin
                                description: Machine identifier of the letter, always English romanization so it stays safe to compare against in code.
                              name:
                                type: string
                                example: Shin
                                description: Display name of the letter, in the requested language. Branch on letterId, never on this.
                              isFinal:
                                type: boolean
                                example: false
                                description: True when the glyph is the word final form. Under the finals-500-900 reading the same letter scores differently in final position, which is why this is on the row.
                              value:
                                type: number
                                example: 300
                                description: What this letter contributed under the standard reading, or under the finals reading when one applies.
                            required:
                            - glyph
                            - letterId
                            - name
                            - isFinal
                            - value
                          description: The per letter breakdown of this spelling under the standard reading.
                      required:
                      - hebrew
                      - romanization
                      - rule
                      - values
                      - letters
                    description: Every Hebrew spelling the input can be written as, greedy parse first. One entry when Hebrew was sent, since there is nothing to choose.
                  chosen:
                    type: object
                    properties:
                      hebrew:
                        type: string
                        example: שרה
                        description: The spelling the values and matches on this response were taken from.
                      rule:
                        type: string
                        example: 'Longest match first: every two letter group the table prints is read as one Hebrew letter before the single letters are tried.'
                        description: Why this spelling was chosen over the others.
                    required:
                    - hebrew
                    - rule
                  values:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: mispar-hechrachi
                          description: Machine identifier of the cipher. Call the ciphers endpoint for the definition, the tradition and the sources behind each one.
                        value:
                          type: number
                          example: 376
                          description: 'The number this cipher gives for the string. Always a number: the one catalogued cipher this API does not compute is absent from this array rather than present without a value, so no row here has to be guarded. Its catalogue entry carries computed false and says why.'
                        alternateValues:
                          type: array
                          items:
                            type: number
                          example:
                          - 527
                          - 536
                          description: 'Other published totals for the same string, ascending. Present only where the cipher is not single valued: letter names have several accepted spellings, so several totals are equally published. Absent otherwise, so a caller can branch on presence.'
                        tradition:
                          type: string
                          example: rabbinic
                          description: Provenance class of the cipher, one of rabbinic, renaissance-latin, golden-dawn-transliterated or modern. Always English, so it stays safe to compare against in code.
                        source:
                          type: string
                          example: https://en.wikipedia.org/wiki/Gematria
                          description: The first published source this cipher was taken from.
                        name:
                          type: string
                          example: Mispar hechrachi (absolute value)
                          description: Display name of the cipher in the requested language, the same string the ciphers catalogue serves for this id. Present so a caller holding one response can label a row without humanizing the identifier or fetching the catalogue. Switch on id, never on this.
                      required:
                      - id
                      - value
                      - tradition
                      - source
                      - name
                    description: Every requested cipher applied to the chosen spelling, in catalogue order, each named as the catalogue names it. Only computed ciphers appear, so every row carries a number.
                  transformations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: atbash
                          description: Machine identifier of the transformation.
                        name:
                          type: string
                          example: AtBash
                          description: Display name of the transformation as the catalogue names it, in the requested language.
                        output:
                          type: string
                          example: בבל
                          description: The substituted Hebrew string. Absent when atbashOutput asked for the value alone.
                        outputRomanization:
                          type: string
                          example: BBL
                          description: Latin transcription of the substituted string, from the same mechanical letter map.
                        value:
                          type: number
                          example: 34
                          description: Standard value of the substituted string. Absent when atbashOutput asked for the string alone.
                        tradition:
                          type: string
                          example: rabbinic
                          description: Provenance class of the transformation.
                        source:
                          type: string
                          example: https://en.wikipedia.org/wiki/Gematria
                          description: The first published source the substitution table was taken from.
                      required:
                      - id
                      - name
                      - tradition
                      - source
                    description: The two substitution transformations applied to the chosen spelling. Each exchanges letters and returns a new word, so the interesting output is often the string rather than the number.
                  latinValues:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: simple-ordinal
                          description: Machine identifier of the Latin cipher.
                        value:
                          type: number
                          example: 52
                          description: The number this cipher gives for the Latin text as sent.
                        tradition:
                          type: string
                          example: renaissance-latin
                          description: Provenance class. None of these is rabbinic, whatever a consumer calculator calls them.
                        lineage:
                          type: string
                          example: A Latin analogue of Greek isopsephy. Traced through Etienne Tabourot 1583, Pietro Bongo, Georg Philipp Harsdorffer 1651, Athanasius Kircher 1665 and Johann Henning 1683, and called the Alphabetum Cabbalisticum Vulgare by Johann Christoph Maennling 1704 and Christian Friedrich Hunold 1707.
                          description: Where the cipher comes from, stated so it cannot be misattributed.
                      required:
                      - id
                      - value
                      - tradition
                      - lineage
                    description: The Latin alphabet ciphers applied to the Latin text. Present only when latinCiphers was set and a Latin text was sent.
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: shalom
                          description: Machine identifier of the entry, an ASCII romanization.
                        hebrew:
                          type: string
                          example: שלום
                          description: The word in Hebrew. Data, identical in every language.
                        romanization:
                          type: string
                          example: ShLVM
                          description: Latin transcription of the Hebrew beside it, from the same mechanical letter map.
                        meaning:
                          type: string
                          example: peace
                          description: What the word means, in the requested language.
                        value:
                          type: number
                          example: 376
                          description: Its value under the standard reading, which is why it matched.
                        note:
                          type: string
                          example: Peace and the name Esau share a value, which the sources treat as a deliberate pairing.
                          description: What the tradition says about the equality, in the requested language.
                        sources:
                          type: array
                          items:
                            type: string
                          example:
                          - https://www.sefaria.org/Noam_Elimelekh%2C_Additions%2C_Likutei_Shoshana.61.1
                          description: Where the value is attested. Every entry in the lexicon carries at least two independent sources, which is why the list is short rather than long.
                      required:
                      - id
                      - hebrew
                      - romanization
                      - meaning
                      - value
                      - note
                      - sources
                    description: Curated words whose standard value equals the chosen spelling. Matching is on the standard reading only, because that is the relation the classical method works with. Empty when nothing matches, which is the ordinary case.
                  conventions:
                    type: object
                    properties:
                      transliteration:
                        type: string
                        example: letter-map-mathers
                        description: The Latin to Hebrew scheme applied. Absent when the caller sent Hebrew directly.
                      misparGadol:
                        type: string
                        example: finals-500-900
                        description: Which of the two published methods the name mispar gadol was read as.
                      atbashOutput:
                        type: string
                        example: both
                        description: What the substitution transformations returned.
                    required:
                    - misparGadol
                    - atbashOutput
                required:
                - input
                - hebrewForms
                - chosen
                - values
                - transformations
                - matches
                - conventions
        '400':
          description: Validation error. `issues[]` lists every failed field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: First issue summary.
                  code:
                    type: string
                    enum:
                    - validation_error
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                  issues:
                    type: array
                    description: Every validation failure. Use this to rebuild a valid request.
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Dot-separated field path, or "(root)" for top-level.
                        message:
                          type: string
                        code:
                          type: string
                          description: Zod issue code (invalid_type, too_small, too_big, invalid_string, ...).
                        expected:
                          type: string
                          description: Expected type for invalid_type.
                        minimum:
                          description: Minimum bound for too_small issues.
                          oneOf:
                          - type: number
                          - type: string
                        maximum:
                          description: Maximum bound for too_big issues.
                          oneOf:
                          - type: number
                          - type: string
                        inclusive:
                          type: boolean
                        format:
                          type: string
                          description: Format name for string issues (regex, email, url, uuid).
                        pattern:
                          type: string
                          description: Regex pattern when format is regex.
                      required:
                      - path
                      - message
                required:
                - error
                - code
                - doc_url
                - issues
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                required:
                - error
                - code
                - doc_url
        '405':
          description: Method not allowed. The path exists but only responds to the methods listed in `allow[]` and the `Allow` response header.
          headers:
            Allow:
              description: Comma-separated list of allowed methods (RFC 9110).
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                    - method_not_allowed
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                  allow:
                    type: array
                    items:
                      type: string
                    description: Allowed HTTP methods for this path. Mirrors the Allow response header.
                  docs:
                    type: string
                    description: Link to the product page for this domain.
                required:
                - error
                - code
                - doc_url
                - allow
        '429':
          description: Monthly rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                required:
                - error
                - code
                - doc_url
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                required:
                - error
                - code
                - doc_url
  /kabbalah/ciphers:
    get:
      operationId: listGematriaCiphers
      tags:
      - Kabbalah
      summary: List gematria ciphers - gematria methods API with provenance on every row
      description: 'Return the full catalogue of gematria methods this API computes: eleven rabbinic ciphers, two substitution transformations, and the three Latin alphabet ciphers, each with its definition, its provenance class, the century of its tradition and the sources it was taken from. Every entry states whether it is rabbinic or a Renaissance Christian or modern Latin cipher, so a product never presents one tradition as the other. Built for calculators that want to show a reader which method produced a number and where the method comes from.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      responses:
        '200':
          description: The cipher catalogue, split by kind.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    example: 16
                    description: Number of entries across all three lists.
                  ciphers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: mispar-hechrachi
                          description: Machine identifier of the cipher, always English romanization so it stays safe to compare against in code. Pass it in the ciphers array on the gematria endpoint.
                        name:
                          type: string
                          example: Mispar hechrachi (absolute value)
                          description: Display name of the cipher, in the requested language.
                        tradition:
                          type: string
                          example: rabbinic
