      description: 'Return one of the seventy two names by its index: the three letters read out of the verses, the exact positions they were read from, the suffixed name, the ecliptic arc it governs, the sign and the choir. The positions are on the response so a reader can check the derivation against the verses rather than trust it. Built for birth angel detail pages and reference features.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 72
          example: 27
          description: Index of the name, 1 to 72.
        required: true
        description: Index of the name, 1 to 72.
        name: number
        in: path
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      responses:
        '200':
          description: The name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  number:
                    type: number
                    example: 27
                    description: Index of the name, 1 to 72. The index is the identifier here, because the Latin spellings differ between published tables while the index never does.
                  letters:
                    type: string
                    example: ירת
                    description: The three letters read out of the verses, with any word final form written as its base letter, which is how every published list prints them.
                  lettersAsWritten:
                    type: string
                    example: םום
                    description: The three letters exactly as they stand in the verses. Eighteen of the seventy two pick up a word final form because the source letter falls at a word end, and keeping this beside the normalized form is what makes the rule auditable.
                  suffix:
                    type: string
                    example: אל
                    description: The divine name suffix added to make the triplet pronounceable. Forty of the seventy two take one and thirty two take the other.
                  name:
                    type: string
                    example: ירתאל
                    description: The suffixed name in Hebrew. Data, identical in every language.
                  romanization:
                    type: string
                    example: IRThAL
                    description: Latin transcription of the Hebrew, from the one mechanical letter map. A label for reading the string back, and NOT the spelling the published tables print, which is in traditionalName.
                  traditionalName:
                    type: string
                    example: Ierathel
                    description: The Latin spelling the published tables print. This is the search term a reader knows the name by. Several rows have two attested spellings across tables and the one used here is stated on the methodology page.
                  arcStart:
                    type: number
                    example: 130
                    description: First degree of the ecliptic arc this name governs, measured from 0 Aries. Inclusive.
                  arcEnd:
                    type: number
                    example: 135
                    description: Last degree of the arc, EXCLUSIVE. Seventy two arcs of five degrees tile the circle exactly, which only works if the upper bound is exclusive.
                  sign:
                    type: string
                    example: leo
                    description: Which sign the arc falls in. Always English lowercase, so it stays safe to compare against in code. Six names fall in each sign.
                  degreeInSign:
                    type: number
                    example: 10
                    description: Where the arc opens inside its sign, 0 to 25 in steps of five.
                  choir:
                    type: string
                    example: Dominions
                    description: The angelic choir this name belongs to under the published Renaissance table. Nine choirs of exactly eight names each.
                  publishedDisagreement:
                    type: object
                    properties:
                      list:
                        type: string
                        example: a second published list of the seventy two names
                        description: Which published list prints something different on this row.
                      prints:
                        type: string
                        example: רעה
                        description: What that list prints, so a caller matching against it can see why.
                    required:
                    - list
                    - prints
                    description: Present only on the rows where a named published list differs from the derivation. Recorded rather than silently corrected, because a reader comparing two sources deserves to know which one moved. Absent on every other row, so a caller can branch on presence.
