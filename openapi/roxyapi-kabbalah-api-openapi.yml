    get:
      operationId: getDailySephirah
      tags:
      - Kabbalah
      summary: Get the sephirah of the day - Omer count API with the sephirot pairing
      description: Return the day of the Omer count for a date, with the sephirah of the week, the sephirah of the day inside it, the printed Hebrew label and a composed reading. The count is a real, dated, forty nine day observance rather than an invented daily, so outside the window the response says the count is not running and gives the date it next opens. Built for daily widgets, Jewish calendar features and lifecycle emails that want a dated reading rather than a random one.
