        name: lang
        in: query
      - schema:
          type: string
          enum:
          - kircher
          default: kircher
          example: kircher
          description: Which arrangement of the twenty two paths. The 1652 arrangement, in which Malkuth carries three paths, is the only one with a published table that letters every path, so it is the only member.
        required: false
        description: Which arrangement of the twenty two paths. The 1652 arrangement, in which Malkuth carries three paths, is the only one with a published table that letters every path, so it is the only member.
        name: treeVariant
        in: query
      - schema:
          type: string
          enum:
          - classical
          - golden-dawn
          default: classical
          example: classical
          description: Which reading assigns a sphere to each sephirah. The two were compared row by row and agree on all ten, so the answer is the same either way; the parameter exists so a caller knows which one produced it rather than assuming.
        required: false
        description: Which reading assigns a sphere to each sephirah. The two were compared row by row and agree on all ten, so the answer is the same either way; the parameter exists so a caller knows which one produced it rather than assuming.
        name: sephirotSystem
        in: query
      - schema:
          type: string
          enum:
