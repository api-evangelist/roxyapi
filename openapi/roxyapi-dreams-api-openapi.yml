      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          example: snake
          description: Unique symbol identifier in kebab-case (e.g., "snake", "chase-dreams", "losing-teeth").
        required: true
        description: Unique symbol identifier in kebab-case (e.g., "snake", "chase-dreams", "losing-teeth").
        name: id
