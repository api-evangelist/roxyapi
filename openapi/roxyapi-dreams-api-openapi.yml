      - apiKey: []
      parameters:
      - schema:
          type: string
          example: snake
          description: Unique symbol identifier in kebab-case (e.g., "snake", "being-chased", "teeth-falling-out").
        required: true
        description: Unique symbol identifier in kebab-case (e.g., "snake", "being-chased", "teeth-falling-out").
        name: id
        in: path
      responses:
