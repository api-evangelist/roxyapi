components:
  schemas:
    BasicDreamSymbol:
      type: object
      properties:
        id:
          type: string
          example: snake
          description: Unique symbol identifier in kebab-case.
        name:
          type: string
          example: Snake
          description: Display name of the dream symbol.
        letter:
          type: string
          example: s
          description: Starting letter for alphabetical filtering.
      required:
      - id
      - name
      - letter
    DreamSymbol:
      type: object
      properties:
        id:
          type: string
          example: snake
          description: Unique symbol identifier in kebab-case. Use this to fetch full interpretation via /symbols/{id}.
        name:
          type: string
          example: Snake
          description: Display name of the dream symbol.
        letter:
          type: string
          example: s
          description: Starting letter (a-z) for alphabetical dream dictionary navigation.
        meaning:
          type: string
          example: To see a snake in your dream signifies hidden fears and worries that are threatening you. Your dream may be alerting you to something in your waking life that you are not aware of or that has not yet surfaced.
