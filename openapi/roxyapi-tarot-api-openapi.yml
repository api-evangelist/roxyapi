              description: Love and relationship interpretation for this orientation. Covers romantic partnerships, dating, emotional connections, and matters of the heart.
            career:
              type: string
              example: 'This is a threshold moment for work: a new role, a new venture, or a bold pivot into unfamiliar territory. The Fool rewards initiative and original thinking, and it can breathe fresh energy into stale projects.'
              description: Career and professional interpretation for this orientation. Covers workplace dynamics, job transitions, ambition, and vocational purpose.
            finances:
