                    type: string
                    example: 'Your card for 2026-03-06: Knight of Pentacles (reversed). stagnation, stubbornness, boredom, overcaution. Reversed, the Knight of Pentacles shows his steady virtues tipping into excess, and the surrounding cards reveal which way. Waite gave the reversal as inertia, idleness, stagnation, and discouragement...'
                    description: Concise daily tarot message summarizing the card, its orientation, key themes, and brief guidance for the day.
