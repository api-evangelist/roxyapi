              description: Key themes and concepts for this card in the given orientation (upright or reversed). Used for quick tarot reference and divination summaries.
            description:
              type: string
              example: Reversed, The Fool turns its open potential in two opposite directions, and the surrounding cards usually reveal which one applies. In the first, the leap becomes recklessness. The traveller ignores the dog at the heels and the cliff at the toe, acting on impulse without regard for consequence and mistaking carelessness for freedom.
              description: Full narrative interpretation of the card in this orientation. Covers symbolism, life lessons, and guidance for the querent.
            love:
