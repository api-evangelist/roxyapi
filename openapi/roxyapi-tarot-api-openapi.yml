components:
  schemas:
    DrawnCard:
      type: object
      properties:
        id:
          type: string
          example: fool
          description: Unique card identifier in kebab-case (e.g. the-fool, ace-of-cups).
        name:
          type: string
          example: The Fool
          description: Display name of the tarot card.
        arcana:
          type: string
          enum:
          - major
          - minor
          description: Whether this card belongs to the Major Arcana (22 trump cards, major life themes) or Minor Arcana (56 suit cards, daily situations).
        suit:
          type: string
          enum:
          - cups
          - wands
          - swords
          - pentacles
          description: Suit of the card (Minor Arcana only). Cups=emotions, Wands=creativity, Swords=intellect, Pentacles=material. Null for Major Arcana cards.
        number:
          type: number
          example: 0
          description: 'Card number within its arcana. Major Arcana: 0 (Fool) through 21 (World). Minor Arcana: 1 (Ace) through 14 (King). Null when not applicable.'
        position:
          type: number
          example: 1
          description: Position index of this card in the draw sequence (1-based). Useful for mapping cards to spread positions.
        reversed:
          type: boolean
          example: false
          description: True if the card was drawn reversed (upside down). Reversed cards carry modified or blocked energy compared to upright position.
        keywords:
          type: array
          items:
            type: string
          example:
          - new beginnings
          - innocence
          - spontaneity
          - free spirit
          - potential
          description: Key themes and concepts associated with this card in its current orientation (upright or reversed).
        meaning:
          type: string
          example: Numbered zero, The Fool stands at the threshold of the Major Arcana as pure, unwritten potential. In the Rider-Waite-Smith image, a young traveller pauses at the edge of a high cliff, gazing into the open sky rather than the drop below, a white rose of innocence in one hand and a light bag of belongings slung from a wand over the shoulder.
          description: Full interpretation of this card in its current orientation, providing detailed divination guidance.
        love:
          type: string
          example: A new romance or a fresh chapter in an existing bond is opening. The card favours openness to unexpected connection and a spirit of play over caution.
          description: Love and relationship interpretation for the drawn orientation. Covers romantic partnerships, dating, emotional connections, and matters of the heart.
        career:
          type: string
          example: 'This is a threshold moment for work: a new role, a new venture, or a bold pivot into unfamiliar territory. The Fool rewards initiative and original thinking, and it can breathe fresh energy into stale projects.'
          description: Career and professional interpretation for the drawn orientation. Covers workplace dynamics, job transitions, ambition, and vocational purpose.
        finances:
          type: string
          example: Financial openings appear, sometimes from unexpected directions, and the mood is expansive and exploratory. Spending tends toward experience, learning, and adventure.
          description: Financial interpretation for the drawn orientation. Covers money management, investments, material prosperity, and abundance mindset.
        health:
          type: string
          example: Renewed vitality and a fresh start are indicated, well suited to a new routine, an unfamiliar sport, or simply more time outdoors and in motion.
          description: Health and wellbeing interpretation for the drawn orientation. Covers physical vitality, mental health, energy levels, and self-care guidance.
        spirituality:
          type: string
          example: A spiritual journey is beginning, marked by openness, wonder, and a beginners willingness to learn.
          description: Spiritual interpretation for the drawn orientation. Covers personal growth, inner wisdom, soul purpose, and metaphysical development.
        imageUrl:
          type: string
          example: https://roxyapi.com/img/tarot/major/fool.jpg
          description: URL to the tarot card artwork image.
      required:
      - id
      - name
      - arcana
      - position
      - reversed
      - keywords
      - meaning
      - imageUrl
    Card:
      type: object
      properties:
        id:
          type: string
          example: fool
          description: Unique card identifier in kebab-case, with no leading article on Major Arcana (e.g. fool, star, ace-of-cups, queen-of-swords). This is the canonical form, whatever spelling was requested.
        name:
          type: string
          example: The Fool
          description: Display name of the tarot card as it appears in the Rider-Waite-Smith tradition.
        arcana:
          type: string
          enum:
          - major
          - minor
          example: major
          description: Whether this card belongs to the Major Arcana (22 trump cards representing major life themes) or Minor Arcana (56 suit cards for daily situations).
        suit:
          type: string
          enum:
          - cups
          - wands
          - swords
          - pentacles
          example: cups
          description: Suit of the card (Minor Arcana only). Cups=emotions, Wands=creativity, Swords=intellect, Pentacles=material. Null for Major Arcana cards.
        number:
          type: number
          example: 0
          description: 'Card number within its arcana. Major Arcana: 0 (Fool) through 21 (World). Minor Arcana: 1 (Ace) through 14 (King).'
        keywords:
          type: object
          properties:
            upright:
              type: array
              items:
                type: string
              example:
              - new beginnings
              - innocence
              - spontaneity
              - free spirit
              - potential
              description: Key themes when the card is drawn upright. Used for quick tarot reference and reading summaries.
            reversed:
              type: array
              items:
                type: string
              example:
              - recklessness
              - hesitation
              - naivety
              - fear of the unknown
              description: Key themes when the card is drawn reversed (inverted). Reversed meanings often indicate blocked or internalized energy.
          required:
          - upright
          - reversed
          description: Keywords for both upright and reversed orientations of this tarot card, useful for quick divination reference.
          example:
            upright:
            - new beginnings
            - innocence
            - spontaneity
            - free spirit
            - potential
            reversed:
            - recklessness
            - hesitation
            - naivety
            - fear of the unknown
        upright:
          type: object
          properties:
            keywords:
              type: array
              items:
                type: string
              example:
              - new beginnings
              - innocence
              - spontaneity
              - free spirit
              - potential
              description: Key themes and concepts for this card in the given orientation (upright or reversed). Used for quick tarot reference and divination summaries.
            description:
              type: string
              example: Numbered zero, The Fool stands at the threshold of the Major Arcana as pure, unwritten potential. In the Rider-Waite-Smith image, a young traveller pauses at the edge of a high cliff, gazing into the open sky rather than the drop below, a white rose of innocence in one hand and a light bag of belongings slung from a wand over the shoulder.
              description: Full narrative interpretation of the card in this orientation. Covers symbolism, life lessons, and guidance for the querent.
            love:
              type: string
