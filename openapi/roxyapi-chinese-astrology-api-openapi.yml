                    minimum: 1
                    maximum: 10
                    example: 9
                    description: Overall energy for this sign on this day, 1 to 10. Derived from the branch relation plus how the day phase treats the sign phase on the generating and controlling cycles, so a favourable relation in a draining phase lands lower than a favourable relation in a supporting one. Built for content widgets and visual indicators.
                  overview:
                    type: string
                    example: The day sits in the Water trine with the Rat, one of the three-sign alliances the cycle divides into.
                    description: What the day does to this sign, from the branch relation and the phase of the day stem.
                  love:
                    type: string
                    example: An easy day for closeness. The trine removes the translation step, so what you meant is roughly what lands.
                    description: Relationship guidance for the day, specific to the branch relation.
                  career:
                    type: string
                    example: Good for anything collaborative. Trine partners cooperate without negotiating first, so meetings run short.
                    description: Work guidance for the day. Clash and harm days carry the traditional cautions about signings and launches.
                  advice:
                    type: string
                    example: Ask for the thing. Trine days are when a request costs the other person least.
                    description: The one thing worth doing differently today, drawn from the relation and from this sign own habitual weak point.
                  year:
                    type: object
                    properties:
                      pillar:
                        type: string
                        example: bing-wu
                        description: Sexagenary year pillar in force on this date, resolved on the lunar new year rule.
                      animal:
                        type: string
