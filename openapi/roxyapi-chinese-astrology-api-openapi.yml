                  conventions:
                    type: object
                    properties:
                      dayBoundary:
                        type: string
                        enum:
                        - split-zi
                        - midnight
                        - early-zi
                        example: split-zi
                        description: Day-boundary school actually applied. Echoes the request, or the default when it was omitted. Always English, whatever the lang parameter says, so it stays safe to compare against in code.
                      yearBoundary:
                        type: string
