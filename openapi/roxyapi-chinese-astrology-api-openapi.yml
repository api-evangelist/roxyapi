  /chinese-astrology/calendar/solar-terms/{year}:
    get:
      operationId: listSolarTerms
      tags:
      - Chinese Astrology
      summary: List the 24 solar terms - Jie Qi calendar API with exact instants
      description: Return all 24 solar terms of a year as astronomical instants rather than dates, each computed from the moment the sun reaches its exact apparent longitude at 15 degree steps. The year is the SOLAR year, which opens at Li Chun in early February, so Minor Cold and Major Cold, the last two terms, are dated in the January of the following Gregorian year. Every instant is returned twice, once in UTC and once at the UTC+8 reference meridian the Chinese calendar is defined on. Built for calendar apps, festival scheduling, and any BaZi feature that has to place a birth on the correct side of a term boundary.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: number
          example: 2026
          description: Solar year, 1900 to 2100. The year opens at Li Chun rather than on 1 January, so its last two terms fall in the following January.
        required: true
        description: Solar year, 1900 to 2100. The year opens at Li Chun rather than on 1 January, so its last two terms fall in the following January.
        name: year
        in: path
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      responses:
        '200':
          description: The 24 solar terms of the year, in chronological order from Li Chun.
          content:
            application/json:
              schema:
                type: object
                properties:
                  year:
                    type: number
                    example: 2026
                    description: Echo of the solar year requested.
                  referenceOffset:
                    type: number
                    example: 8
                    description: Decimal UTC offset of the reference meridian the local fields are given at. Fixed at 8 for the Chinese calendar.
                  total:
                    type: number
                    example: 24
                    description: Number of terms returned, which is always 24.
                  terms:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: li-chun
                          description: Solar term identifier in kebab case pinyin. Always English pinyin, whatever the lang parameter says, because the English names are not standardised and would not be safe to compare against.
                        name:
                          type: string
                          example: Beginning of Spring
                          description: Display name of the term. Several English renderings are in circulation, so treat this as a label and the id as the value.
                        chinese:
                          type: string
                          example: 立春
                          description: The term in Chinese. A data field, identical in every language.
                        pinyin:
                          type: string
                          example: lì chūn
                          description: Tone marked pinyin for the characters.
