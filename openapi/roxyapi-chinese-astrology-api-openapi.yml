  /chinese-astrology/elements:
    get:
      operationId: listFiveElements
      tags:
      - Chinese Astrology
      summary: List the five elements - Wu Xing API with generating and controlling cycles
      description: 'Return the five phases of Wu Xing with the Chinese character, the season and direction each governs, the Heavenly Stems and Earthly Branches that carry it, and both of the cycles that connect them. The generating cycle and the controlling cycle are returned as ordered rings as well as on each phase, so a caller can render either without deriving it. This is the one place the five phase vocabulary is defined: BaZi charts, Na Yin, zodiac element variants and every feng shui star reuse these identifiers rather than restating them.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 5
          default: 5
          example: 5
          description: 'Maximum items to return per page. Range: 1-5, default 5.'
        required: false
        description: 'Maximum items to return per page. Range: 1-5, default 5.'
        name: limit
        in: query
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          default: 0
          example: 0
          description: Number of items to skip for pagination. Default 0.
        required: false
        description: Number of items to skip for pagination. Default 0.
        name: offset
        in: query
      responses:
        '200':
          description: The five phases with both cycles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    example: 5
                    description: Total number of phases, which is always five.
                  limit:
                    type: number
                    example: 5
                    description: Maximum phases returned in this page.
                  offset:
                    type: number
                    example: 0
                    description: Number of phases skipped before this page.
                  generatingCycle:
                    type: array
                    items:
                      type: string
                    example:
                    - Wood
                    - Fire
                    - Earth
                    - Metal
                    - Water
                    description: The producing ring in order. Each phase generates the next and the last generates the first, so the list wraps.
                  controllingCycle:
                    type: array
                    items:
                      type: string
                    example:
                    - Wood
                    - Earth
                    - Water
                    - Fire
                    - Metal
                    description: The restraining ring in order. Each phase controls the next and the last controls the first, so this list wraps too. It is the same five phases walked two steps at a time.
                  elements:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: Wood
                          description: Five phase identifier. Always English, whatever the lang parameter says, so it stays safe to compare against in code. The same five values appear on stems, branches, pillars, Na Yin and every feng shui star.
                        nameLocalized:
                          type: string
                          example: Holz
                          description: Display name of the phase in the requested language. Absent when lang is en, so an English response is unchanged.
                        chinese:
                          type: string
                          example: 木
                          description: Chinese character for the phase. A data field, identical in every language.
                        pinyin:
                          type: string
                          example: mù
                          description: Tone marked pinyin for the character. A data field, identical in every language.
                        season:
                          type: string
                          example: Spring
                          description: Season the phase governs. Earth governs the transitions rather than a season of its own, and is reported as Late Summer.
                        direction:
                          type: string
                          example: East
                          description: Compass direction of the phase. Earth returns Center, because it sits at the middle of the arrangement rather than on the ring.
                        generates:
                          type: string
                          example: Fire
                          description: The phase this one produces in the generating cycle. Wood feeds Fire, Fire makes Earth, Earth bears Metal, Metal condenses Water, Water grows Wood.
                        generatedBy:
                          type: string
                          example: Water
                          description: The phase that produces this one. The inverse of the generates field.
                        controls:
                          type: string
                          example: Earth
                          description: The phase this one restrains in the controlling cycle. Wood breaks Earth, Earth dams Water, Water quenches Fire, Fire melts Metal, Metal cuts Wood.
                        controlledBy:
                          type: string
                          example: Metal
                          description: The phase that restrains this one. The inverse of the controls field.
                        stems:
                          type: array
                          items:
                            type: string
                          example:
                          - jia
                          - yi
                          description: The two Heavenly Stems that carry this phase, yang first. Every phase has exactly two, which is why ten stems cover five phases.
                        branches:
                          type: array
                          items:
                            type: string
                          example:
                          - yin
                          - mao
                          description: The Earthly Branches that carry this phase. Wood, Fire, Metal and Water take two each and Earth takes four, the branches that sit between the seasons.
                        meaning:
                          type: string
                          example: Growth with a direction to it. Wood pushes outward and upward, plans ahead, and needs room; hemmed in it turns to frustration rather than stopping.
                          description: What the phase is and how it behaves, in the terms a reading uses it in. Translated in place.
                      required:
                      - id
                      - chinese
                      - pinyin
                      - season
                      - direction
                      - generates
                      - generatedBy
                      - controls
                      - controlledBy
                      - stems
                      - branches
                      - meaning
                    description: The phases for this page, in generating cycle order.
                required:
                - total
                - limit
                - offset
                - generatingCycle
                - controllingCycle
                - elements
        '400':
          description: Validation error. `issues[]` lists every failed field.
          content:
            application/json:
