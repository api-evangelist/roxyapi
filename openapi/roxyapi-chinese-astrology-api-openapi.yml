                  startDate:
                    type: string
                    example: '2026-03-01'
                    description: Echo of the first date of the range.
                  endDate:
                    type: string
                    example: '2026-04-30'
                    description: Echo of the last date of the range.
                  daysSearched:
                    type: number
                    example: 61
                    description: Number of days in the range, counting both ends.
                  avoidAnimal:
                    type: string
                    example: rat
                    description: Echo of the animal protected. Absent when none was sent, rather than null.
                  total:
                    type: number
                    example: 8
                    description: Number of favoured days found. This is the count after the clash filter, not the number of days searched.
                  days:
                    type: array
                    items:
