                        description: Animal name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                      relationship:
                        type: string
                        example: clash
                        description: How the year branch stands to the requested sign, from the same six-value vocabulary as the daily relationship. This is the slower background the day sits inside.
                      note:
                        type: string
                        example: The year branch clashes with the Rat, so the year asks for decisions the sign would rather defer.
                        description: One line on the year relationship, or on the Ben Ming Nian year when the year animal matches the sign.
                    required:
                    - pillar
                    - animal
                    - relationship
                    - note
                    description: The sexagenary year this date falls in, resolved on the LUNAR NEW YEAR rule to match the folk zodiac this route family answers. The Four Pillars routes use the classical Li Chun rule and can name a different year for dates in early February.
                  benMingNian:
                    type: boolean
                    example: false
                    description: True when the year animal is the same as the requested sign, the return of your own branch that comes round every twelve years. The tradition treats a Ben Ming Nian as a year to be deliberate in rather than one to fear, because the sign own qualities run at full strength and that cuts both ways.
                required:
