  /chinese-astrology/calendar/lunar-date:
    post:
      operationId: calculateLunarDate
      tags:
      - Chinese Astrology
      summary: Convert lunar and Gregorian dates - Chinese lunisolar calendar API
      description: Convert a Gregorian date to the Chinese lunisolar calendar or convert a lunar date back, in one endpoint. The calendar is computed at the UTC+8 reference meridian with the month containing the winter solstice fixed as month 11 and the leap month placed as the first month of the cycle carrying no major solar term, so a lunar date is the same worldwide rather than shifting with the caller timezone. The response reports the length of the lunar month, whether the date sits in a leap month, and which month the year doubles if any. Built for festival calendars, birthday features that follow the lunar date, and any app that has to survive a leap month without shifting every date after it.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                  example: '1990-06-15'
                  description: Gregorian date to convert to the lunisolar calendar. Send this OR the lunar fields, never both.
                lunarYear:
                  type: integer
                  minimum: 1900
                  maximum: 2100
                  example: 1990
                  description: Lunisolar year to convert back to a Gregorian date. Requires lunarMonth and lunarDay.
                lunarMonth:
                  type: integer
                  minimum: 1
                  maximum: 12
                  example: 5
                  description: Lunar month, 1 to 12. Requires lunarYear and lunarDay.
                lunarDay:
                  type: integer
                  minimum: 1
                  maximum: 30
                  example: 23
                  description: Day of the lunar month, 1 to 30. Requires lunarYear and lunarMonth.
                isLeapMonth:
                  type: boolean
                  default: false
                  example: false
                  description: Set true to address the leap repetition of lunarMonth rather than the first pass. Requesting a leap month a year does not have returns 400.
              description: Send a Gregorian date to convert forward, or a lunar year, month and day to convert back.
      responses:
        '200':
          description: The converted date, in both calendars.
          content:
            application/json:
              schema:
                type: object
                properties:
                  gregorianDate:
                    type: string
                    example: '1990-06-15'
                    description: The Gregorian date, echoed when one was sent and computed when the lunar fields were. Echoes the request, or the current UTC date when neither side was supplied.
                  lunar:
                    type: object
                    properties:
                      year:
                        type: number
                        example: 1990
                        description: Lunisolar year. It advances on the first day of month 1, not at Li Chun, so it can lag the Gregorian year by up to seven weeks.
                      month:
                        type: number
                        example: 5
                        description: Lunar month, 1 to 12. A leap month repeats the number of the month it follows.
                      day:
                        type: number
                        example: 23
                        description: Day of the lunar month, 1 to 30. A lunar month never has 31 days.
                      isLeapMonth:
                        type: boolean
                        example: false
                        description: True when this is the leap repetition of the month number rather than the first pass through it.
                      monthLength:
                        type: number
                        example: 30
                        description: Days in this lunar month, 29 for a short month or 30 for a long one. It is the interval between two new moons, so it varies month to month.
                      date:
                        type: string
                        example: '1990-06-15'
                        description: The Gregorian date this lunar day covers, evaluated at the reference meridian.
                    required:
                    - year
                    - month
                    - day
                    - isLeapMonth
                    - monthLength
                    - date
                  leapMonthOfYear:
                    type: number
                    example: 5
                    description: The month this lunisolar year repeats, when it has thirteen months. Absent in a twelve month year, so a caller can branch on presence rather than on a sentinel.
                  referenceOffset:
                    type: number
                    example: 8
                    description: Decimal UTC offset the calendar was evaluated at. Fixed at 8, which is what makes a Chinese lunar date a world constant.
                required:
                - gregorianDate
                - lunar
                - referenceOffset
