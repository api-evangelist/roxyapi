  /chinese-astrology/zodiac/animals:
    get:
      operationId: listZodiacAnimals
      tags:
      - Chinese Astrology
      summary: List the 12 Chinese zodiac animals - Sheng Xiao sign catalogue
      description: Retrieve all twelve Chinese zodiac animals in cycle order, from Rat through Pig. Each entry returns the machine id, the Chinese character and tone-marked pinyin for the animal, its Earthly Branch, the fixed Five Element phase and yin or yang polarity of that branch, and a set of trait keywords. Built for sign pickers, zodiac cards and compatibility widgets that need the whole set in one call.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 12
          default: 12
          example: 12
          description: 'Maximum items to return per page. Range: 1-12, default 12.'
        required: false
        description: 'Maximum items to return per page. Range: 1-12, default 12.'
        name: limit
        in: query
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          default: 0
          example: 0
          description: Number of items to skip for pagination. Default 0.
        required: false
        description: Number of items to skip for pagination. Default 0.
        name: offset
        in: query
      responses:
        '200':
          description: The zodiac animal catalogue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    example: 12
                    description: Total animals in the cycle. Always 12; the zodiac is a closed set.
                  limit:
                    type: number
                    example: 12
                    description: Maximum items returned for this page.
                  offset:
                    type: number
                    example: 0
                    description: Number of items skipped before this page.
                  animals:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: rat
                          description: Stable machine identifier for the animal. Always English and lowercase, whatever the lang parameter says, so it stays safe to compare against in code. Use nameLocalized for anything a reader sees. The twelve ids are rat, ox, tiger, rabbit, dragon, snake, horse, goat, monkey, rooster, dog, pig.
                        name:
                          type: string
                          example: Rat
                          description: Display name of the animal in English. Always English, whatever the lang parameter says, so it stays safe to compare against in code. Use nameLocalized for anything a reader sees.
                        nameLocalized:
                          type: string
                          example: Rata
                          description: Animal name in the requested language, for display only. Present only when lang is set to a language other than English, since in English it would repeat its canonical partner field exactly. Never compare against this value, compare against the canonical field beside it.
                        chinese:
                          type: string
                          example: 鼠
                          description: Traditional hanzi character for the animal itself, not for its Earthly Branch. Data rather than a translation, so it is identical under every lang.
                        pinyin:
                          type: string
                          example: shǔ
                          description: Tone-marked Hanyu Pinyin for the animal name. Data rather than a translation, so it is identical under every lang.
                        branch:
                          type: string
                          example: zi
                          description: Earthly Branch this animal names, as its pinyin identifier. The twelve branches are zi, chou, yin, mao, chen, si, wu, wei, shen, you, xu, hai, and they run in the same order as the animals. Every animal element, polarity and double-hour is a property of this branch.
                        element:
                          type: string
                          example: Water
                          description: 'Fixed Five Element (Wu Xing) phase of the animal own branch: Wood, Fire, Earth, Metal or Water. This never changes for a sign. It is NOT the year phase that makes a Metal Rat differ from a Water Rat, which comes from the year Heavenly Stem. Always English so it stays safe to compare against and to key colours off.'
                        elementLocalized:
