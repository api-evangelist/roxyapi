                          example: month-command
                          description: Which classical factor this is. month-command is de ling, whether the birth month season backs the Day Master element. rooting is de di, whether any branch stores a stem of that element. party is de shi, whether the other three stems help or spend it. Always English, whatever the lang parameter says.
                        name:
                          type: string
                          example: Month command
                          description: Display name of the factor. Always English, whatever the lang parameter says. Use nameLocalized for anything a reader sees.
                        chinese:
                          type: string
                          example: 得令
                          description: The factor named in hanzi. Identical under every lang.
