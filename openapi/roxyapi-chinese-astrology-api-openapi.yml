        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                activity:
                  type: string
                  enum:
                  - wedding
                  - travel
                  - moving-house
                  - opening-business
                  - signing-contracts
                  - construction
                  - groundbreaking
                  - burial
                  - medical-treatment
                  - praying
                  example: wedding
                  description: Activity to choose a date for. One of wedding, travel, moving-house, opening-business, signing-contracts, construction, groundbreaking, burial, medical-treatment, praying. Matching folds case and punctuation, so moving-house and MOVING_HOUSE both resolve.
                startDate:
                  type: string
                  format: date
                  example: '2026-03-01'
                  description: First date of the range to search, inclusive.
                endDate:
                  type: string
                  format: date
                  example: '2026-04-30'
                  description: Last date of the range to search, inclusive. The range may not exceed 93 days.
                avoidAnimal:
                  type: string
                  enum:
                  - rat
                  - ox
                  - tiger
                  - rabbit
                  - dragon
                  - snake
                  - horse
                  - goat
                  - monkey
                  - rooster
                  - dog
                  - pig
                  example: rat
                  description: Zodiac animal to protect. Days that clash with this animal are dropped from the results, which is how a date is chosen around the people attending rather than in the abstract. One of rat, ox, tiger, rabbit, dragon, snake, horse, goat, monkey, rooster, dog, pig.
