                          type: string
                          example: dé lìng
                          description: Tone-marked pinyin for the factor. Identical under every lang.
                        contribution:
                          type: number
                          example: -2
                          description: Points this factor contributed to the composite score, positive for support and negative for drain. The three contributions sum to score, so a caller who weights the factors differently can rebuild its own total from the same findings.
