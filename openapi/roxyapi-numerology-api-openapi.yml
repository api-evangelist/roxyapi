  /numerology/chaldean:
    post:
      operationId: calculateChaldean
      tags:
      - Numerology
      summary: Chaldean numerology name reading - Destiny, compound number, planetary ruler
      description: Calculate a complete Chaldean numerology reading for a name. The older Chaldean system maps letters to values 1 to 8 by vibration (the number 9 is sacred and never assigned to a letter) and reads the unreduced two-digit compound number (10 to 52, also called a fadic number, defined by Cheiro) in addition to the single-digit root. Returns the Destiny or name number from all letters, the Soul Urge from vowels, and the Personality from consonants, each with its compound number, root, and Cheiro compound interpretation, plus the planetary ruler of the Destiny root and a caution flag for the karmic numbers 4 and 8. Perfect for Chaldean numerology calculators, name analysis tools, and AI numerology assistants that need both the compound and root layers in one call.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: Helen
                  description: The name to analyze. Chaldean tradition uses the name a person is most known by, not necessarily the full legal birth name.
              required:
              - name
      responses:
        '200':
          description: Successfully calculated the Chaldean name reading
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Helen
                    description: The name analyzed.
                  destiny:
                    type: object
                    properties:
                      total:
                        type: number
                        example: 23
                        description: Raw sum of the Chaldean letter values before any reduction.
                      compound:
                        type:
                        - number
                        - 'null'
                        example: 23
                        description: The interpretable compound number (10 to 52), the hidden influence behind the name, or null when the total resolves below 10.
                      root:
                        type: number
                        example: 5
                        description: The single-digit root (1 to 9), the outward expression. Chaldean does not preserve master numbers.
                      calculation:
                        type: string
                        example: H=5, E=5, L=3, E=5, N=5 = 23 → 5
                        description: Letter-by-letter Chaldean breakdown summed to the total, then to compound and root.
                      compoundMeaning:
                        type:
                        - object
                        - 'null'
                        properties:
                          number:
                            type: number
                            example: 23
                            description: The compound number (10 to 52).
                          name:
                            type:
                            - string
                            - 'null'
                            example: The Royal Star of the Lion
                            description: Classical symbolic title from Cheiro, or null when the number has no named symbol.
                          nature:
                            type: string
                            enum:
                            - fortunate
                            - unfortunate
                            - mixed
                            example: fortunate
                            description: Overall tenor of the compound. "mixed" covers conditional numbers that are fortunate only alongside a favorable single number or in a specific domain.
                          meaning:
                            type: string
                            example: A promise of success, help from superiors and protection from those in high places.
                            description: Cheiro interpretation of the hidden influence carried by this compound number.
                          sameAs:
                            type: number
                            example: 24
                            description: For numbers 33 to 52, the lower compound in the same series whose meaning this number shares.
                        required:
                        - number
                        - name
                        - nature
                        - meaning
                        description: Cheiro compound-number interpretation when the aspect carries a compound layer.
                    required:
                    - total
                    - compound
                    - root
                    - calculation
                    - compoundMeaning
                    description: The Destiny or name number from all letters. The primary Chaldean number, revealing the overall direction encoded in the name.
                  soulUrge:
                    type: object
                    properties:
