  /numerology/bridge:
    post:
      operationId: calculateBridgeNumbers
      tags:
      - Numerology
      summary: Calculate Bridge Numbers - Harmonize different aspects of personality
      description: 'Calculate three Bridge Numbers that reveal the adjustments needed to create harmony between different aspects of your numerology profile. Bridge Numbers are the absolute difference between pairs of core numbers: Life Path and Expression, Expression and Personality, Expression and Soul Urge. A Bridge of 0 means the two aspects are already aligned. Higher bridges (1 to 8) indicate greater tension and provide specific guidance on what changes to make. Bridge Numbers are essential for personal development, coaching applications, self-improvement platforms, and AI-powered personality analysis tools. Requires both a full birth name and birth date to calculate all four core numbers (Life Path, Expression, Soul Urge, Personality) internally before deriving the bridges.'
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: John William Smith
                  description: Full legal birth name as it appears on the birth certificate. Used to calculate Expression, Soul Urge, and Personality numbers. Include first, middle, and last names separated by spaces.
                year:
                  type: integer
                  minimum: 100
                  maximum: 2100
                  example: 1990
                  description: Birth year between 100 and 2100. Used to calculate the Life Path number via Pythagorean reduction.
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  example: 7
                  description: Birth month (1 to 12)
                day:
                  type: integer
                  minimum: 1
                  maximum: 31
                  example: 15
                  description: Birth day (1 to 31)
              required:
              - fullName
              - year
              - month
              - day
      responses:
        '200':
          description: Successfully calculated three Bridge Numbers with actionable harmony guidance
          content:
            application/json:
              schema:
                type: object
                properties:
                  lifePathExpression:
                    type: object
                    properties:
                      bridge:
                        type: integer
                        minimum: 0
                        maximum: 8
                        example: 3
                        description: Bridge number (0 to 8). The absolute difference between two core numerology numbers after reducing master numbers to single digits. 0 means the two aspects are already in natural harmony. Higher values indicate greater tension requiring conscious adjustment.
                      from:
                        type: object
                        properties:
                          name:
                            type: string
                            example: Life Path
                            description: Name of the first core number in this bridge pair. Identifies which aspect of personality or destiny is being compared.
                          number:
                            type: number
                            example: 5
                            description: The reduced single-digit value (1 to 9) of the first core number used in the bridge calculation.
                        required:
                        - name
                        - number
                      to:
                        type: object
                        properties:
                          name:
                            type: string
                            example: Expression
                            description: Name of the second core number in this bridge pair. Identifies the other aspect of personality or destiny being compared.
                          number:
                            type: number
                            example: 8
                            description: The reduced single-digit value (1 to 9) of the second core number used in the bridge calculation.
                        required:
                        - name
                        - number
                      meaning:
                        type: string
                        example: Focus on developing self-discipline and a consistent work ethic. Channel your creative ideas into structured plans with clear milestones. Regular routines and organized habits will help you align your inner vision with your outer expression.
                        description: Actionable guidance for bridging the gap between these two aspects of your numerology profile. Explains what adjustments to make to bring these energies into harmony.
                    required:
                    - bridge
                    - from
                    - to
                    - meaning
                    description: Bridge between Life Path and Expression numbers. Reveals the gap between your destined life purpose (from birth date) and your natural talents and abilities (from birth name). A high bridge here means your innate skills may not directly serve your life mission without conscious effort.
                  expressionPersonality:
                    type: object
                    properties:
                      bridge:
                        type: integer
                        minimum: 0
                        maximum: 8
                        example: 3
                        description: Bridge number (0 to 8). The absolute difference between two core numerology numbers after reducing master numbers to single digits. 0 means the two aspects are already in natural harmony. Higher values indicate greater tension requiring conscious adjustment.
                      from:
