security:
- apiKey: []
tags:
- name: Numerology
  description: Numerology API for life path numbers, complete numerology charts and compatibility, in both Pythagorean and Chaldean numerology.
paths:
  /numerology/life-path:
    post:
      operationId: calculateLifePath
      tags:
      - Numerology
      summary: Calculate Life Path number - Calculator and meaning API
      description: Calculate a Life Path number from a birth date with Pythagorean numerology. The Life Path is the core number of a numerology chart, read from the birth year, month and day alone, with master numbers 11, 22 and 33 kept and a karmic debt of 13, 14, 16 or 19 flagged with its meaning. The response returns every reduction step and a full interpretation (archetype title, keywords, description, strengths, challenges, career, relationships and spirituality) in the language set by lang. Built for Life Path calculators, numerology apps, onboarding personality profiles and AI agents.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                year:
                  type: integer
                  minimum: 100
                  maximum: 2100
                  example: 1990
                  description: Birth year between 100 and 2100. Supports historical figures like Einstein (1879) and Shakespeare (1564).
                month:
                  type: integer
                  minimum: 1
                  maximum: 12
                  example: 7
                  description: Birth month (1-12)
                day:
                  type: integer
                  minimum: 1
                  maximum: 31
                  example: 15
                  description: Birth day (1-31)
              required:
              - year
              - month
              - day
      responses:
        '200':
          description: Successfully calculated Life Path number with detailed interpretation
          content:
            application/json:
              schema:
                type: object
                properties:
                  number:
                    type: number
                    example: 5
                    description: Your Life Path number, the single most important number in Pythagorean numerology. Values range from 1 to 9 for single digits, or 11, 22, 33 for Master Numbers.
                  calculation:
                    type: string
                    example: 'Month: 7, Day: 15 → 1+5 = 6, Year: 1990 → 1+9+9+0 = 19 → 1+9 = 10 → 1+0 = 1 → 7+6+1=14 → 5'
                    description: 'Every step of the calculation: the birth month, day and year each reduced, then combined into the final Life Path number.'
                  type:
                    type: string
                    enum:
                    - single
                    - master
                    example: single
                    description: Whether this is a standard single-digit number (1 to 9) or a Master Number (11, 22, 33). Master Numbers carry amplified spiritual significance and are never reduced further.
                  hasKarmicDebt:
                    type: boolean
                    example: true
                    description: Indicates whether a Karmic Debt number (13, 14, 16, or 19) appeared during the reduction chain. Karmic Debt reveals past-life challenges carried into this lifetime.
                  karmicDebtNumber:
                    type: number
                    example: 14
                    description: The specific Karmic Debt number detected during reduction, if any. Each debt number (13, 14, 16, 19) represents a distinct past-life lesson requiring resolution.
                  karmicDebtMeaning:
                    type: object
                    properties:
                      description:
                        type: string
                        example: Accumulated Obligation of Moderation and Stability
                        description: Title describing the karmic debt theme and core past-life pattern.
                      challenge:
                        type: string
                        example: A past pattern of misusing personal freedom, whether through overindulgence, excess, or the...
                        description: The specific challenge or pattern from past lives that must be confronted.
                      resolution:
                        type: string
                        example: Develop moderation as a practiced discipline rather than a reactive restriction. Build and honor...
                        description: Practical guidance for resolving the karmic debt and transforming the challenge into growth.
                    required:
                    - description
                    - challenge
                    - resolution
                    description: Detailed interpretation of the Karmic Debt number when present. Only returned when hasKarmicDebt is true.
                  meaning:
                    type: object
                    properties:
                      title:
                        type: string
                        example: The Adventurer
                        description: Numerology archetype name for this Life Path number. Encapsulates the core identity and energy in a single phrase, such as "The Leader" for 1 or "The Master Builder" for 22.
                      keywords:
                        type: array
                        items:
                          type: string
                        example:
                        - freedom
                        - adventure
                        - change
                        - versatility
                        - curiosity
                        description: Defining personality traits and energetic themes of this number. Useful for quick personality snapshots, tag clouds and compatibility matching.
                      description:
                        type: string
                        example: The 5 is the most kinetic of all single-digit numbers. It is in constant motion, oriented toward...
                        description: Core interpretation of the number covering personality, purpose and life themes. Together with the strengths, challenges, career, relationships and spirituality fields it makes a full-page reading.
                      strengths:
                        type: array
                        items:
                          type: string
                        example:
                        - Adaptable
                        - Resourceful
                        - Socially fluent
                        description: Core strengths and positive qualities. Each entry includes a trait name followed by a detailed explanation of how it manifests in daily life.
                      challenges:
                        type: array
                        items:
                          type: string
                        example:
                        - Unreliable
                        - Impulsive
                        - Directionless
                        description: Growth areas and shadow qualities to be aware of. Each entry names the challenge and explains its root cause and how to work through it constructively.
                      career:
                        type: string
                        example: The 5 requires variety, autonomy, and stimulation in its professional life. Sales, journalism...
                        description: Tailored career guidance covering ideal industries, roles, and work environments. Includes specific job titles and explains why certain professional paths align with this number.
                      relationships:
                        type: string
                        example: The 5 brings vitality and spontaneity to relationships but requires genuine freedom within them to...
                        description: Love, friendship, and family dynamics. Covers romantic compatibility with other Life Path numbers, communication style, and the key relationship lessons for this number.
                      spirituality:
                        type: string
                        example: The 5 encounters the sacred primarily through direct experience rather than formal practice....
                        description: Spiritual path, soul lessons, and recommended practices. Explores the deeper purpose behind this number and offers guidance for personal growth and inner alignment.
                    required:
                    - title
                    - keywords
                    - description
                    - strengths
                    - challenges
                    - career
                    - relationships
                    - spirituality
                required:
                - number
                - calculation
                - type
                - hasKarmicDebt
                - meaning
        '400':
          description: Validation error. `issues[]` lists every failed field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: First issue summary.
                  code:
                    type: string
                    enum:
                    - validation_error
                  doc_url:
                    type: string
                    description: Absolute URL of the documented explanation of this code, anchored at the code itself, for example https://roxyapi.com/docs/errors#not_found.
                  issues:
                    type: array
