      description: Analyze a business or brand name with Chaldean numerology, the system practitioners use for trade names. The name is read word by word, and the response returns the compound number and root with every step, the planetary ruler, a business rating, the industries the number favors, whether the compound is one of the fortunate compounds Cheiro names, and guidance, in the language set by lang. The roots 1, 3, 5 and 6 rate excellent, 2 and 9 good, 7 and 8 caution and 4 avoid. Built for naming tools, brand agencies and founder apps; the rating is positioning guidance, not a guarantee.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: Ford
                  description: The business or brand name to evaluate. A name in any script is converted to Latin letters before it is counted, Cyrillic and Greek as the passport spelling and accents folded to the base letter, and the calculation lists the letters counted. For a script that does not write its vowels, send the Latin spelling the person uses.
              required:
              - name
      responses:
        '200':
          description: Successfully analyzed the business name
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Ford
                    description: The business name analyzed.
                  total:
                    type: number
                    example: 21
                    description: 'The sum the compound is read from: for a one-word name, its Chaldean letter total; for a longer name, the sum of each word reduced to its single number, as Cheiro works John Smith (18 to 9, 17 to 8, total 17).'
                  compound:
                    type:
                    - number
                    - 'null'
                    example: 21
                    description: Chaldean compound number (10 to 52), the hidden influence, or null.
                  root:
                    type: number
                    example: 3
                    description: Single-digit business root (1 to 9), the outward commercial expression.
                  planet:
                    type: string
                    example: Jupiter
                    description: Planetary ruler of the business root.
                  rating:
                    type: string
                    enum:
                    - excellent
                    - good
                    - caution
                    - avoid
                    example: excellent
                    description: Overall favorability of the root for business. excellent and good are growth-friendly; caution (7, 8) and avoid (4) flag the demanding and unstable roots.
                  favorableCompound:
                    type: boolean
                    example: true
                    description: True when the compound number is one of Cheiro fortunate compounds, an extra positive signal layered over the root rating.
                  industries:
                    type: array
                    items:
                      type: string
                    example:
                    - Media and content
                    - Education and training
                    - Finance and advisory
                    - Creative services
                    description: Industries the business root favors.
                  guidance:
                    type: string
                    example: An expansive vibration ruled by Jupiter. Excellent for growth, communication and creativity, favoring brands built on expertise, advice and reputation.
                    description: Plain-language guidance for using this number as a brand.
                  calculation:
                    type: string
                    example: F=8, O=7, R=2, D=4 = 21 → 3
                    description: Chaldean letter breakdown of the business name.
                  compoundMeaning:
                    type:
                    - object
                    - 'null'
                    properties:
                      number:
                        type: number
                        example: 21
                        description: The compound number.
                      name:
                        type:
                        - string
                        - 'null'
                        example: The Crown of the Magi
                        description: Symbolic title, if any.
                      nature:
                        type: string
                        enum:
                        - fortunate
                        - unfortunate
                        - mixed
                        example: fortunate
                        description: Tenor of the compound.
                      meaning:
                        type: string
                        example: Symbolized by the Universe. A number of advancement, honors, elevation and general success, meaning victory after long initiation and tests of determination.
                        description: Cheiro interpretation.
                      sameAs:
                        type: number
                        example: 24
                        description: Series equivalent for 33 to 52.
                    required:
                    - number
                    - name
                    - nature
                    - meaning
                    description: Cheiro compound interpretation when present.
                  summary:
                    type: string
                    example: Ford has a Chaldean business root of 3 (excellent). An expansive vibration ruled by Jupiter. Excellent for growth, communication and creativity, favoring brands built on expertise, advice and reputation.
                    description: One-line plain-language verdict for the business name.
                required:
                - name
                - total
                - compound
                - root
                - planet
                - rating
                - favorableCompound
                - industries
                - guidance
                - calculation
                - compoundMeaning
                - summary
