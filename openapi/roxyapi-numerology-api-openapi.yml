                        - manifestation
                        - visionary thinking
                        - practicality
                        - determination
                        description: Core themes in the Pythagorean reading.
                    required:
                    - number
                    - type
                    - calculation
                    - title
                    - keywords
                  chaldean:
                    type: object
                    properties:
                      compound:
                        type:
                        - number
                        - 'null'
                        example: 16
                        description: Chaldean compound number (10 to 52), the hidden influence, or null.
                      root:
                        type: number
                        example: 7
                        description: Chaldean root (1 to 9).
                      total:
                        type: number
                        example: 16
                        description: 'The sum the compound is read from: for a one-word name, its Chaldean letter total; for a longer name, the sum of each word reduced to its single number, as Cheiro works John Smith (18 to 9, 17 to 8, total 17).'
                      calculation:
                        type: string
                        example: D=4, A=1, V=6, I=1, D=4 = 16 → 7
                        description: Chaldean letter breakdown to compound and root.
                      planet:
                        type: string
                        example: Neptune
                        description: Planetary ruler of the Chaldean root.
