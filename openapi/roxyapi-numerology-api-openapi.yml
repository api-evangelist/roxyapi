                    - caution
                    - avoid
                    example: excellent
                    description: Overall favorability of the root for business. excellent and good are growth-friendly; caution (7, 8) and avoid (4) flag the demanding and unstable roots.
                  favorableCompound:
                    type: boolean
                    example: true
                    description: True when the compound number is one of Cheiro fortunate compounds, an extra positive signal layered over the root rating.
                  industries:
                    type: array
                    items:
                      type: string
                    example:
                    - Media and content
                    - Education and training
                    - Finance and advisory
                    - Creative services
                    description: Industries the business root favors.
                  guidance:
                    type: string
                    example: An expansive vibration ruled by Jupiter. Excellent for growth, communication and creativity, favoring brands built on expertise, advice and reputation.
                    description: Plain-language guidance for using this number as a brand.
                  calculation:
                    type: string
                    example: F=8, O=7, R=2, D=4 = 21 → 3
                    description: Chaldean letter breakdown of the business name.
                  compoundMeaning:
                    type:
                    - object
                    - 'null'
                    properties:
                      number:
                        type: number
                        example: 21
                        description: The compound number.
                      name:
                        type:
                        - string
                        - 'null'
                        example: The Crown of the Magi
                        description: Symbolic title, if any.
                      nature:
                        type: string
                        enum:
                        - fortunate
                        - unfortunate
                        - mixed
                        example: fortunate
                        description: Tenor of the compound.
                      meaning:
                        type: string
                        example: Symbolized by the Universe. A number of advancement, honors, elevation and general success, meaning victory after long initiation and tests of determination.
                        description: Cheiro interpretation.
                      sameAs:
                        type: number
                        example: 24
                        description: Series equivalent for 33 to 52.
                    required:
                    - number
                    - name
                    - nature
                    - meaning
                    description: Cheiro compound interpretation when present.
                  summary:
                    type: string
                    example: Ford has a Chaldean business root of 3 (excellent). An expansive vibration ruled by Jupiter. Excellent for growth, communication and creativity, favoring brands built on expertise, advice and reputation.
                    description: One-line plain-language verdict for the business name.
                required:
                - name
                - total
                - compound
                - root
                - planet
                - rating
                - favorableCompound
                - industries
                - guidance
                - calculation
                - compoundMeaning
                - summary
        '400':
          description: Validation error. `issues[]` lists every failed field.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: First issue summary.
                  code:
                    type: string
                    enum:
                    - validation_error
                  issues:
                    type: array
                    description: Every validation failure. Use this to rebuild a valid request.
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Dot-separated field path, or "(root)" for top-level.
                        message:
                          type: string
                        code:
                          type: string
                          description: Zod issue code (invalid_type, too_small, too_big, invalid_string, ...).
                        expected:
                          type: string
                          description: Expected type for invalid_type.
                        minimum:
                          description: Minimum bound for too_small issues.
                          oneOf:
                          - type: number
                          - type: string
                        maximum:
                          description: Maximum bound for too_big issues.
                          oneOf:
                          - type: number
                          - type: string
                        inclusive:
                          type: boolean
                        format:
                          type: string
                          description: Format name for string issues (regex, email, url, uuid).
                        pattern:
                          type: string
                          description: Regex pattern when format is regex.
                      required:
                      - path
                      - message
                required:
                - error
                - code
                - issues
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                required:
                - error
                - code
        '405':
          description: Method not allowed. The path exists but only responds to the methods listed in `allow[]` and the `Allow` response header.
          headers:
            Allow:
              description: Comma-separated list of allowed methods (RFC 9110).
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum:
                    - method_not_allowed
                  allow:
                    type: array
                    items:
                      type: string
                    description: Allowed HTTP methods for this path. Mirrors the Allow response header.
                  docs:
                    type: string
                    description: Link to the product page for this domain.
                required:
                - error
                - code
                - allow
        '429':
          description: Monthly rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                required:
                - error
                - code
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Human-readable error message. May change wording.
                  code:
                    type: string
                    description: Machine-readable error code. Stable identifier.
                required:
                - error
                - code
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your API key for accessing RoxyAPI. Alternatively, you can pass the API key as a query parameter "api_key".
externalDocs:
  description: Complete API Documentation with Examples
  url: https://roxyapi.com/docs
