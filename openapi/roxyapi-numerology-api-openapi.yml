  /numerology/chaldean:
    post:
      operationId: calculateChaldean
      tags:
      - Numerology
      summary: Calculate Chaldean numerology - Chaldean name number calculator API
      description: Calculate a complete Chaldean numerology reading for a name, following Cheiro. The Destiny or name number, the Soul Urge from the vowels and the Personality from the consonants each come with the compound number from 10 to 52, the single-digit root and the classical compound interpretation, and a longer name is read name by name with every step shown in its calculation. The response adds the planetary ruler and meaning of the Destiny root, a caution flag for the roots 4 and 8, and a summary, in the language set by lang. Built for Chaldean numerology calculators, name analysis tools and AI agents.
      security:
      - apiKey: []
      parameters:
      - schema:
          type: string
          enum:
          - en
          - tr
          - de
          - es
          - hi
          - pt
          - fr
          - ru
          - zh-Hans
          - zh-Hant
          default: en
          example: en
          description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        required: false
        description: 'Response language (BCP 47). Supported: en, tr, de, es, hi, pt, fr, ru, zh-Hans, zh-Hant. Defaults to en. Coverage varies by domain, and a field with no translation in the requested language returns English.'
        name: lang
        in: query
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  example: Helen
                  description: The name to analyze. Chaldean tradition uses the name a person is most known by, not necessarily the full legal birth name. It needs at least one vowel (A, E, I, O, U) and one consonant, since the Soul Urge is read from the vowels and the Personality from the consonants; Y counts as a consonant. A name in any script is converted to Latin letters before it is counted, Cyrillic and Greek as the passport spelling and accents folded to the base letter, and the calculation lists the letters counted. For a script that does not write its vowels, send the Latin spelling the person uses.
              required:
              - name
      responses:
        '200':
          description: Successfully calculated the Chaldean name reading
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Helen
                    description: The name analyzed.
                  destiny:
                    type: object
                    properties:
                      total:
                        type: number
                        example: 23
                        description: 'The sum the compound is read from: for a one-word name, its Chaldean letter total; for a longer name, the sum of each word reduced to its single number, as Cheiro works John Smith (18 to 9, 17 to 8, total 17).'
                      compound:
                        type:
                        - number
                        - 'null'
                        example: 23
                        description: The interpretable compound number (10 to 52), the hidden influence behind the name, or null when the total resolves below 10.
                      root:
                        type: number
                        example: 5
                        description: The single-digit root (1 to 9), the outward expression. Chaldean does not preserve master numbers.
                      calculation:
                        type: string
                        example: H=5, E=5, L=3, E=5, N=5 = 23 → 5
                        description: Letter-by-letter Chaldean breakdown, name by name for a longer name, summed to the total, then to compound and root.
                      compoundMeaning:
                        type:
                        - object
                        - 'null'
                        properties:
                          number:
                            type: number
                            example: 23
                            description: The compound number (10 to 52).
                          name:
                            type:
                            - string
                            - 'null'
                            example: The Royal Star of the Lion
                            description: Classical symbolic title from Cheiro, or null when the number has no named symbol.
                          nature:
                            type: string
                            enum:
                            - fortunate
                            - unfortunate
                            - mixed
                            example: fortunate
                            description: Overall tenor of the compound. "mixed" covers conditional numbers that are fortunate only alongside a favorable single number or in a specific domain.
                          meaning:
                            type: string
                            example: A promise of success, help from superiors and protection from those in high places.
                            description: Cheiro interpretation of the hidden influence carried by this compound number.
                          sameAs:
                            type: number
                            example: 24
                            description: For numbers 33 to 52, the lower compound in the same series whose meaning this number shares.
                        required:
                        - number
                        - name
                        - nature
                        - meaning
                        description: Cheiro compound-number interpretation when the aspect carries a compound layer.
                    required:
                    - total
                    - compound
                    - root
                    - calculation
                    - compoundMeaning
                    description: The Destiny or name number from all letters. The primary Chaldean number, revealing the overall direction encoded in the name.
                  soulUrge:
                    type: object
                    properties:
                      total:
                        type: number
                        example: 23
                        description: 'The sum the compound is read from: for a one-word name, its Chaldean letter total; for a longer name, the sum of each word reduced to its single number, as Cheiro works John Smith (18 to 9, 17 to 8, total 17).'
