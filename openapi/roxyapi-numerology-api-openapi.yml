                          type: string
                        example:
                        - love
                        - harmony
                        - responsibility
                        - nurturing
                        - family
                        description: Defining traits and talent themes for this Expression number. Ideal for personality profiles, compatibility engines, and talent-matching features.
                      description:
                        type: string
                        example: The 6 is the most relationship-oriented of the single-digit numbers, organized around a genuine...
