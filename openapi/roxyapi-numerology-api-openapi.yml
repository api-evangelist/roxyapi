                        example: master
                        description: Single digit or preserved master number.
                      calculation:
                        type: string
                        example: D=4, A=1, V=4, I=9, D=4 → 4+1+4+9+4 = 22
                        description: Pythagorean letter breakdown and reduction.
                      title:
                        type: string
                        example: The Master Builder
                        description: Archetype of the number.
                      keywords:
                        type: array
                        items:
                          type: string
                        example:
