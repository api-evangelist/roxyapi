                  targetDate:
                    type: string
                    example: '2026-04-10'
                    description: Date this compatibility was calculated for.
                  overallScore:
                    type: number
                    example: 72
                    description: Overall compatibility score from 0 (fully opposed) to 100 (perfectly synchronized).
                  rating:
                    type: string
                    example: Well Aligned
                    description: 'Compatibility rating label. One of: Highly Aligned, Well Aligned, Moderately Aligned, Misaligned, Opposed.'
                  cycles:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        person1Value:
                          type: number
                          example: 74
