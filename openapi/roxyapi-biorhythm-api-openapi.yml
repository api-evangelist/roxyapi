                        person2Value:
                          type: number
                          example: 55
                          description: Person 2 cycle value on the target date (-100 to 100).
                        difference:
                          type: number
                          example: 19
                          description: Absolute difference between the two values (0-200). Lower values indicate better alignment.
                        alignment:
                          type: number
                          example: 90
                          description: Alignment score from 0 (perfectly opposed) to 100 (perfectly in sync).
                        phase:
                          type: string
                          enum:
                          - in_sync
                          - complementary
                          - neutral
                          - opposing
                          example: in_sync
                          description: 'How the two people''s cycles sit against each other. One of: in_sync, complementary, neutral, opposing. This is a PAIR alignment and shares no values with the single-person cycle phase.'
                        description:
                          type: string
                          example: Both partners share similar physical energy levels. Shared activities, exercise, and daily rhythms align naturally.
                          description: Human-readable description of how this cycle alignment affects the relationship.
                      required:
